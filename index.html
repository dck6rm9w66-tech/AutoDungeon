      (where==="bag"&&!canW?'<span class="better" style="color:var(--bad)">\u2717</span>':"")+
      (it.isNew?'<span class="newdot"></span>':"")+
      (where==="equip"?'<span class="slotname">'+SLOTS[slotKey].n+'</span>':"")+'</div>';
  },
  /** Werte eines Items als benannte Zahlen — Grundlage jedes Vergleichs */
  itemRows(it){
    const r={};
    if(!it)return r;
    const st=itemStats(it);
    if(it.dmax)r["Schaden \u00D8"]=Math.round((it.dmin+it.dmax)/2);
    if(it.armor)r["Rüstung"]=(r["Rüstung"]||0)+it.armor;
    const names={str:"Stärke",dex:"Geschick",int:"Intelligenz",vit:"Ausdauer",hp:"Leben",
      armor:"Rüstung",crit:"Krit-Chance %",critdmg:"Krit-Schaden %",dmgpct:"Schaden %",
      aspd:"Angriffstempo %",leech:"Lebensraub %",gf:"Goldfund %",mf:"Magiefund %",thorns:"Dornen %"};
    for(const k in st){const n=names[k]||k;r[n]=(r[n]||0)+st[k];}
    return r;
  },
  /** Gegenüberstellung: ausgewähltes Teil gegen das angelegte */
  compareHtml(it,eq){
    const A=this.itemRows(it),B=this.itemRows(eq);
    const keys=[];
    for(const k in A)keys.push(k);
    for(const k in B)if(keys.indexOf(k)<0)keys.push(k);
    let h='<div class="cmpgrid"><div class="hd">Eigenschaft</div>'+
      '<div class="hd" style="text-align:right">Neu</div>'+
      '<div class="hd" style="text-align:right">'+(eq?"Angelegt":"\u2014")+'</div>';
    for(const k of keys){
      const va=A[k]||0,vb=B[k]||0,d=Math.round((va-vb)*10)/10;
      h+='<div>'+k+'</div>'+
         '<div class="vn '+(d>0?"up":d<0?"dn":"")+'">'+(va||"\u2014")+
           (d&&eq?' <small>('+(d>0?"+":"")+d+')</small>':"")+'</div>'+
         '<div class="ve">'+(vb||"\u2014")+'</div>';
    }
    const sa=itemScore(it),sb=itemScore(eq),dd=sa-sb;
    h+='<div class="sep"></div><div><b>Gesamtwertung</b></div>'+
       '<div class="vn '+(dd>0?"up":dd<0?"dn":"")+'"><b>'+sa+'</b></div>'+
       '<div class="ve">'+(eq?sb:"\u2014")+'</div></div>';
    if(eq)h+='<div class="verdict '+(dd>0?"good":dd<0?"bad":"neutral")+'">'+
      (dd>0?"\u25B2 Verbesserung um "+dd+" Punkte":dd<0?"\u25BC Verschlechterung um "+(-dd)+" Punkte":
      "Gleichwertig zum angelegten Teil")+'</div>';
    else h+='<div class="verdict good">Der Platz ist frei — anlegen bringt reinen Gewinn.</div>';
    return h;
  },
  /** Detailkarte: erst prüfen und vergleichen, dann anlegen */
  detailHtml(it,where){
    const h=G.hero,R=RARITY[it.rar];
    const eq=where==="equip"?null:h.equip[it.slot];
    let x='<div>'+
      (ASSETS[artIdFor(it)]?'<img class="detail-art" src="'+ASSET_DIR+artIdFor(it)+'.png" alt="">':"")+
      '<div class="dname" style="color:'+R.hex+'">'+iname(it)+'</div>'+
      '<div class="dsub">'+R.n+" \u00B7 "+SLOTS[it.slot].n+" \u00B7 Gegenstandsstufe "+it.lvl+
      (it.up?" \u00B7 beim Schmied "+it.up+"-mal aufgewertet":"")+
      (where==="equip"?" \u00B7 angelegt":"")+'</div>';
    if(it.dmax)x+='<div class="effline">'+it.dmin+" \u2013 "+it.dmax+' Schaden</div>';
    if(it.armor)x+='<div class="effline">'+it.armor+' Rüstung</div>';
    if(it.uniqTxt)x+='<div class="uniq">'+it.uniqTxt+'</div>';
    if(it.sockets.length){
      // Jeder Sockel eine Zeile: was drin steckt, ob er sich veredeln lässt, was Herauslösen kostet
      x+='<div class="socklist"><div class="sockhd">Sockel '+socketDots(it)+' '+
        it.sockets.filter(Boolean).length+' / '+it.sockets.length+' belegt</div>';
      for(const g of it.sockets){
        if(!g){x+='<div class="sockrow"><i class="sdot"></i><span style="color:var(--muted)">frei — Edelstein im Inventar anklicken, dann diesen Gegenstand</span></div>';continue;}
        const P=parseGem(g);
        let tail="";
        if(where!=="shop"&&where!=="relic"){
          if(P.q<9){
            const rc=refineCost(P.q);
            tail+=G.shards>=rc?' <span class="sok">✓ veredelbar ('+rc+' ✦)</span>':
              ' <span class="sno">veredeln: '+rc+' ✦</span>';
          }else tail+=' <span class="sno">höchste Güte</span>';
          tail+=' <span class="sno">· herauslösen: '+fmt(gemRemoveCost(P.q))+' G</span>';
        }
        x+='<div class="sockrow"><i class="sdot f" style="background:'+P.col+'"></i>'+
          '<span><span style="color:'+P.Q.col+'">'+P.name+'</span> '+P.txt+tail+'</span></div>';
      }
      x+='</div>';
    }
    if(it.req){
      const chk=h.canEquip(it);
      const nm={str:"Stärke",dex:"Geschick",int:"Intelligenz",vit:"Ausdauer"}[it.req.k];
      x+='<div style="margin-top:6px" class="'+(chk.ok?"reqok":"reqbad")+'">Voraussetzung: Stufe '+
        it.req.lvl+(it.req.v>0?", "+it.req.v+" "+nm:"")+
        (chk.ok?" \u2713":" \u2717 "+chk.why)+'</div>';
    }
    x+='<div style="margin-top:8px">'+this.compareHtml(it,eq)+'</div>';
    x+='<div class="btnrow" style="margin-top:10px">';
    const wearable=where!=="bag"||h.canEquip(it).ok;
    if(where==="bag")x+='<button class="btn p" id="dEquip"'+(wearable?"":" disabled")+'>'+
       (wearable?"Anlegen":"Nicht tragbar")+'</button>'+
       '<button class="btn" id="dSell">Verkaufen (+'+Math.round(itemScore(it)*.5+it.lvl*2)+' G)</button>';
    else if(where==="relic"){ /* nur Ansicht */ }
    else if(where==="shop"){
      const o=(G.shop||[]).find(y=>y.it===it);
      if(o)x+='<button class="btn p" id="dBuy"'+(h.gold<o.price?" disabled":"")+'>Kaufen für '+fmt(o.price)+' G</button>';
    }
    else x+='<button class="btn" id="dUnequip">Ablegen</button>';
    x+='<button class="btn" id="dClose">Schließen</button></div></div>';
    return x;
  },
  /** Öffnet die Vergleichsansicht als eigenes Fenster — es bleibt beim Weiterspielen stehen */
  openItem(it,where){
    this.sel={it:it,where:where};
    it.isNew=false;
    this.openSheet(this.detailHtml(it,where),()=>this.bindDetail());
    this.renderInv();this.updateBars();
  },
  renderInv(){
    const h=G.hero;
    // Auswahl kann durch Verkauf oder Anlegen ungültig geworden sein
    if(this.sel&&this.sel.where!=="shop"&&h.bag.indexOf(this.sel.it)<0&&
       Object.values(h.equip).indexOf(this.sel.it)<0){
      this.sel=null;if(this.sheetOpen())$("sheetWrap").classList.remove("on");
    }
    let html="";
    html+='<div class="h3">Ausrüstung — anklicken für Details</div><div class="paperdoll">';
    for(const sl of SLOT_ORDER)html+=this.cellHtml(h.equip[sl]||null,sl,sl,"equip");
    html+='</div>';
    html+='<div class="h3">Edelsteine — anklicken, dann ein Item mit freiem Sockel wählen</div>';
    if(h.gems.length){
      const counts={};h.gems.forEach(g=>counts[g]=(counts[g]||0)+1);
      const keys=Object.keys(counts).sort((a,b)=>parseGem(b).q-parseGem(a).q);
      html+='<div class="gemrow">';
      for(const k of keys){
        const P=parseGem(k);
        html+='<div class="gem'+(this.socketGem===k?" sel":"")+'" data-gem="'+k+'" '+
          'style="color:'+P.col+';border-color:'+P.Q.col+'" title="'+P.name+" \u00B7 "+P.txt+'">'+
          artImg("gem_"+P.base.k,P.base.ico)+'<span style="color:'+P.Q.col+'">'+counts[k]+'</span></div>';
      }
      html+='</div><div class="hint">'+(this.socketGem?"Sockel-Modus aktiv: Ziel wählen oder Edelstein erneut anklicken.":"")+'</div>';
    }else html+='<div class="hint">Noch keine Edelsteine gefunden.</div>';
    html+='<div class="h3">Beutel ('+h.bag.length+') — anklicken zum Vergleichen</div>';
    html+='<div class="toggle'+(G.autoEquip?" on":"")+'" id="autoEq"><span class="sw"><i></i></span>'+
      '<span>Bessere Beute automatisch anlegen</span></div>';
    if(h.bag.length){
      html+='<div class="bag" style="margin-top:9px">';
      h.bag.forEach((it,i)=>{html+=this.cellHtml(it,it.slot,i,"bag");});
      html+='</div>';
      // Sammelverkauf: jede Seltenheitsstufe einzeln an- und abwählbar
      const sel=this.sellFilter;
      const marked=h.bag.filter(i=>sel[i.rar]);
      const worth=marked.reduce((n,i)=>n+Math.round(itemScore(i)*.5+i.lvl*2),0);
      html+='<div class="h3">Sammelverkauf</div><div class="btnrow">';
      RARITY.forEach((R,i)=>{
        html+='<button class="btn'+(sel[i]?" p":"")+'" data-rar="'+i+'" '+
          'style="'+(sel[i]?"":"color:"+R.hex)+'">'+R.n+" ("+h.bag.filter(x=>x.rar===i).length+')</button>';
      });
      html+='</div><div class="btnrow" style="margin-top:7px">'+
        '<button class="btn s" id="sellSel"'+(marked.length?"":" disabled")+'>'+
        marked.length+' Gegenstände verkaufen (+'+fmt(worth)+' G)</button></div>'+
        '<div class="hint">Angelegte Ausrüstung bleibt unberührt.</div>';
    }else html+='<div class="hint" style="margin-top:9px">Der Beutel ist leer. Beute erscheint automatisch.</div>';
    const el=$("tab-inv");el.innerHTML=html;
    this.bindCells(el);
    this.bindDetail();
    $("autoEq").onclick=()=>{G.autoEquip=!G.autoEquip;
      this.toast(G.autoEquip?"Automatik an: bessere Funde werden sofort angelegt.":"Automatik aus: du entscheidest.");
      this.renderInv();};
    el.querySelectorAll("[data-gem]").forEach(g=>{
      g.onclick=()=>{SFX.init();this.openGem(g.dataset.gem);};
    });
    el.querySelectorAll("[data-rar]").forEach(b=>{
      b.onclick=()=>{const i=+b.dataset.rar;this.sellFilter[i]=!this.sellFilter[i];this.renderInv();};
    });
    const ss=$("sellSel");
    if(ss)ss.onclick=()=>{
      let g=0,n=0;
      for(let i=h.bag.length-1;i>=0;i--){
        if(this.sellFilter[h.bag[i].rar]){
          g+=Math.round(itemScore(h.bag[i])*.5+h.bag[i].lvl*2);h.bag.splice(i,1);n++;}
      }
      if(n){h.gold+=g;SFX.buy();this.log("Verkauft: "+n+" Gegenstände für "+g+" Gold.","gold");
        this.sel=null;this.renderInv();this.updateBars();}
      else this.toast("Nichts ausgewählt.");
    };
  },
  /** Zeigt, was ein Edelstein bewirkt, bevor er eingesetzt wird */
  openGem(key){
    const P=parseGem(key);const G2=P.base;
    const h=G.hero;
    const n=h.gems.filter(g=>g===key).length;
    const targets=[].concat(Object.values(h.equip).filter(Boolean),h.bag)
      .filter(it=>it.sockets&&it.sockets.indexOf(null)>=0);

      (i===P.q?";color:"+Q.col+";font-weight:700":";opacity:.5")+'"><span>'+(i+1)+". "+Q.n+
      '</span><b>+'+Math.max(1,Math.round(G2.amt*Q.m))+G2.unit+'</b></div>').join("");
    const html='<div>'+
      (ASSETS["gem_"+G2.k]?'<img class="detail-art" src="'+ASSET_DIR+"gem_"+G2.k+'.png" alt="">':"")+
      '<div class="dname" style="color:'+P.Q.col+'">'+P.name+'</div>'+
      '<div class="dsub">Seelenstein \u00B7 Güte '+(P.q+1)+' von 10 \u00B7 '+n+' im Besitz</div>'+
      '<div class="h3" style="margin-top:0">Wirkung beim Einsetzen</div>'+

      '<div class="hint" style="margin-top:6px">Die Wirkung gilt dauerhaft für den Gegenstand, '+
      'in den der Stein eingesetzt wird. Einmal gesockelt, bleibt er drin.</div>'+
      '<div class="hint" style="margin-top:6px">'+
      (targets.length?targets.length+" Gegenstände haben einen freien Sockel.":
       "Kein Gegenstand hat derzeit einen freien Sockel.")+'</div>'+
      '<div class="btnrow" style="margin-top:10px">'+
      '<button class="btn p" id="gemUse"'+(targets.length?"":" disabled")+'>Einsetzen \u2014 Ziel wählen</button>'+

        this.toast("Wähle jetzt einen Gegenstand mit freiem Sockel.");this.renderInv();};
      const cl=$("gemClose");
      if(cl)cl.onclick=()=>this.closeSheet();

  },
  bindDetail(){
    if(!this.sel)return;
    const h=G.hero,it=this.sel.it;
    const close=()=>this.closeSheet();
    const eqB=$("dEquip");
    if(eqB)eqB.onclick=()=>{const i=h.bag.indexOf(it);if(i>=0)this.equipItem(i);close();};
    const unB=$("dUnequip");
    if(unB)unB.onclick=()=>{this.unequip(it.slot);close();};
    const seB=$("dSell");
    if(seB)seB.onclick=()=>{
      const i=h.bag.indexOf(it);if(i<0)return;
      const g=Math.round(itemScore(it)*.5+it.lvl*2);
      h.bag.splice(i,1);h.gold+=g;SFX.buy();
      this.log(it.name+" für "+g+" Gold verkauft.","gold");close();
    };
    const buB=$("dBuy");
    if(buB)buB.onclick=()=>{
      const i=(G.shop||[]).findIndex(y=>y.it===it);if(i<0)return;
      const o=G.shop[i];
      if(h.gold<o.price){this.toast("Zu wenig Gold.");return;}
      h.gold-=o.price;o.it.isNew=true;h.bag.push(o.it);G.shop.splice(i,1);
      SFX.buy();this.log("Gekauft: "+o.it.name+".","gold");close();
    };
    const clB=$("dClose");
    if(clB)clB.onclick=close;
  },
  bindCells(root){
    const h=G.hero;
    root.querySelectorAll(".cell").forEach(c=>{
      const where=c.dataset.where,idx=c.dataset.idx;
      let item=null;
      if(where==="equip"){const key=SLOT_ORDER[Array.from(root.querySelectorAll('[data-where="equip"]')).indexOf(c)];
        item=h.equip[key]||null;c._slot=key;}
      else if(where==="bag")item=h.bag[+idx];
      if(!item)return;
      if(HOVER){
        c.onmouseenter=e=>this.showTooltip(item,e,where==="bag"?h.equip[item.slot]:null);
        c.onmouseleave=()=>this.hideTooltip();
      }
      c.onclick=()=>{
        this.hideTooltip();
        if(this.socketGem){this.insertGem(item);return;}
        this.openItem(item,where);   // erst vergleichen, dann selbst entscheiden
      };
    });
  },
  insertGem(item){
    const h=G.hero;
    const free=item.sockets.indexOf(null);
    if(free<0){this.toast("Kein freier Sockel.");return;}
    const gi=h.gems.indexOf(this.socketGem);
    if(gi<0){this.socketGem=null;return;}
    item.sockets[free]=this.socketGem;
    const G2=parseGem(this.socketGem);
    h.gems.splice(gi,1);
    this.log(G2.name+" in "+item.name+" eingesetzt ("+G2.txt+").","loot");
    SFX.socket();G.parts.puff(120,GROUND-40,G2.Q.col);
    if(h.gems.indexOf(this.socketGem)<0)this.socketGem=null;
    h.recompute();this.renderInv();this.updateBars();
  },
  equipItem(idx,silent){
    const h=G.hero;const it=h.bag[idx];if(!it)return;
    const chk=h.canEquip(it);
    if(!chk.ok){this.toast("Nicht tragbar: "+chk.why);return;}
    it.isNew=false;
    let target=it.slot;
    if(it.isRune){                       // erster freier Runenplatz
      target=["rune","rune2","rune3"].find(k=>!h.equip[k])||"rune";
    }
    const old=h.equip[target];
    h.equip[target]=it;h.bag.splice(idx,1);
    if(old)h.bag.push(old);
    h.recompute();
    if(it.isRune)it.slot=target;
    if(!silent){SFX.buy();this.log(it.name+" angelegt.","loot");}
    else this.log("Automatisch angelegt: "+it.name+".","loot");
    G.parts.ring(120,GROUND-40,RARITY[it.rar].hex);
    this.renderAll();
  },
  unequip(slot){
    const h=G.hero;const it=h.equip[slot];if(!it)return;
    h.bag.push(it);h.equip[slot]=null;h.recompute();
    this.log(it.name+" abgelegt.","sys");
    this.renderAll();
  },
  /* ---------- Tooltip mit Vergleich ---------- */

      aspd:"Angriffstempo",leech:"Lebensraub",gf:"Goldfund",mf:"Magiefund",thorns:"Dornen"};
    const pct={crit:1,critdmg:1,dmgpct:1,aspd:1,leech:1,gf:1,mf:1};
    for(const k in s)h+='<div class="stat">+'+s[k]+(pct[k]?"% ":" ")+names[k]+'</div>';

      h+='<div style="margin-top:5px;color:var(--acc2)">Sockel '+socketDots(it)+' '+
        (it.sockets.indexOf(null)>=0?'<span style="color:var(--acc2)">'+it.sockets.filter(g=>!g).length+' frei</span>':"")+'</div>'+

    }

  if(it.uniqTxt)h+='<div class="uniq">'+it.uniqTxt+'</div>';
    h+='<div class="cmp" style="margin-top:6px">Wertung: '+itemScore(it)+'</div>';
    if(compare){
      const d=itemScore(it)-itemScore(compare);
      h+='<hr><div class="ttype">Angelegt: <span style="color:'+RARITY[compare.rar].hex+'">'+iname(compare)+'</span></div>';
      if(compare.dmax)h+='<div class="cmp">'+compare.dmin+" – "+compare.dmax+' Schaden</div>';
      if(compare.armor)h+='<div class="cmp">'+compare.armor+' Rüstung</div>';

  showTooltip(it,e,compare){
    const tt=$("tooltip");
    tt.innerHTML=this.itemHtml(it,compare&&compare!==it?compare:null);
    tt.classList.add("on");
    this.placeTooltip(e.clientX,e.clientY);
  },
  placeTooltip(x,y){
    const tt=$("tooltip"),r=tt.getBoundingClientRect();
    let px=x+16,py=y+14;
    if(px+r.width>innerWidth-8)px=x-r.width-16;
    if(py+r.height>innerHeight-8)py=innerHeight-r.height-8;
    if(px<8)px=8;if(py<8)py=8;
    tt.style.left=px+"px";tt.style.top=py+"px";
  },
  hideTooltip(){$("tooltip").classList.remove("on");},
  /** Ultimate-Knopf: Ladefüllung, Restzeit, Bereitschaft. Läuft jedes Bild, ändert nur bei Bedarf. */
  updateUlt(force){
    const b=$("ultBtn");if(!b)return;
    const h=G.hero;
    const show=!!h&&G.state!=="idle"&&G.state!=="dead";
    if(!show){if(b.classList.contains("on"))b.classList.remove("on");return;}
    const S=this._ultS&&!force&&this._ultSFor===h.ult.rank+"|"+h.ult.path+"|"+h.level?this._ultS:null;
    const cd=S?S.cd:ultStats(h).cd;
    if(!S){this._ultS=ultStats(h);this._ultSFor=h.ult.rank+"|"+h.ult.path+"|"+h.level;
      const U=ULTS[h.cls];
      b.style.setProperty("--uc",this._ultS.col);$("ultIco").textContent=U.ico;
      b.title=U.n+(h.ult.path?" ("+U.paths[h.ult.path].n+")":"")+" \u00B7 Taste R";}
    if(!b.classList.contains("on")){b.classList.add("on");
      b.onclick=()=>{SFX.init();G.castUlt();};}
    const p=Math.round((1-clamp(h.ultCd/cd,0,1))*100);
    if(p!==this._ultP){this._ultP=p;b.style.setProperty("--p",p);}
    const ready=G.ultReady(),charged=h.ultCd<=0;
    b.classList.toggle("ready",ready);
    b.classList.toggle("wait",charged&&!ready);
    const tt=h.ultCd>0?Math.ceil(h.ultCd)+"s":"";
    if(tt!==this._ultT){this._ultT=tt;$("ultTime").textContent=tt;}
  },
  /** Ultimate-Karte oben im Fertigkeiten-Tab */
  ultCardHtml(){
    const h=G.hero,U=ULTS[h.cls],r=h.ult.rank,S=ultStats(h),T=S.tier;
    const maxed=r>=ULT_MAX,need=ultReqLevel(r+1);
    let x='<div class="ultcard" style="--uc:'+S.col+'"><div class="uhd"><div class="ubig">'+U.ico+'</div><div>'+
      '<b>'+U.n+(h.ult.path?' \u00B7 '+U.paths[h.ult.path].n:"")+'</b>'+
      '<small>Ultimative Fähigkeit \u00B7 Rang '+r+' / '+ULT_MAX+' \u00B7 auslösen mit dem Knopf im Bild oder Taste R</small></div></div>'+
      '<div class="udesc">'+U.d+(h.ult.path?' '+U.paths[h.ult.path].d:"")+'</div>'+
      ultLines(h,S).map(l=>'<div class="uline">'+l+'</div>').join("")+
      '<div class="utier">Erscheinung: '+[1,2,3,4].map(i=>'<i class="'+(i<=T?"on":"")+'"></i>').join("")+
      ' <b style="color:var(--uc)">'+ULT_TIERS[T-1]+'</b>'+
      (T<4?' \u2014 nächste Stufe ab Rang '+[4,7,10][T-1]:"")+'</div>';
    if(!maxed){
      const N=ultStats(h,r+1);
      x+='<div class="h3" style="margin:9px 0 4px">Rang '+(r+1)+'</div>'+
        ultLines(h,N).map(l=>'<div class="unext">'+l+'</div>').join("");
      const ok=h.skillPts>0&&h.level>=need;
      x+='<div class="btnrow" style="margin-top:8px"><button class="btn p" id="ultUp"'+(ok?"":" disabled")+'>'+
        (h.level<need?"Ab Heldenstufe "+need:h.skillPts<=0?"Kein Punkt verfügbar":"Rang "+(r+1)+" lernen (1 Punkt)")+'</button></div>';
    }else x+='<div class="hint" style="margin-top:8px;color:var(--uc)">Höchster Rang erreicht.</div>';
    if(r>=ULT_PATH_RANK&&!h.ult.path){
      x+='<div class="h3" style="margin:10px 0 2px">Pfad wählen \u2014 prägt Wirkung und Aussehen dauerhaft für diesen Helden</div><div class="upaths">';
      for(const k of ["A","B"]){const P=U.paths[k];
        x+='<div class="upath" style="--pc:'+P.col+'"><b>'+P.n+'</b><p>'+P.d+'</p>'+
          '<button class="btn s" data-ultpath="'+k+'">'+P.n+' wählen</button></div>';}
      x+='</div>';
    }else if(!h.ult.path){
      x+='<div class="hint" style="margin-top:6px">Ab Rang '+ULT_PATH_RANK+' wählst du einen von zwei Pfaden: '+
        U.paths.A.n+' oder '+U.paths.B.n+'.</div>';
    }
    return x+'</div>';
  },
  bindUltCard(root){
    const h=G.hero;
    const up=root.querySelector("#ultUp");
    if(up)up.onclick=()=>{
      if(h.ult.rank>=ULT_MAX||h.skillPts<=0||h.level<ultReqLevel(h.ult.rank+1))return;
      h.ult.rank++;h.skillPts--;
      SFX.init();SFX.levelup();G.parts.ring(120,GROUND-40,ultStats(h).col);
      const T=ultTier(h.ult.rank);
      this.log(ULTS[h.cls].n+" auf Rang "+h.ult.rank+(ultTier(h.ult.rank-1)<T?" \u2014 Erscheinung: "+ULT_TIERS[T-1]+"!":"")+".","lvl");
      G.save();this.renderSkills();this.updateBars();this.updateUlt(true);
    };
    root.querySelectorAll("[data-ultpath]").forEach(b=>{
      b.onclick=()=>{
        if(h.ult.path||h.ult.rank<ULT_PATH_RANK)return;
        h.ult.path=b.dataset.ultpath;
        const P=ULTS[h.cls].paths[h.ult.path];
        SFX.init();SFX.levelup();G.parts.ring(120,GROUND-40,P.col);G.parts.confetti(120,GROUND-50);
        this.log(ULTS[h.cls].n+": Pfad "+P.n+" gewählt.","lvl");
        G.save();this.renderSkills();this.updateUlt(true);
      };
    });
  },
  /* ---------- Tab: Fähigkeiten ---------- */
  canLearn(sk){
    const h=G.hero;
    if((h.skills[sk.k]||0)>=sk.max)return false;
    if(h.skillPts<=0)return false;
    if(sk.req&&(h.skills[sk.req[0]]||0)<sk.req[1])return false;
    return true;
  },
  /** Karte über dem Baum: was die Fähigkeit jetzt tut und was der nächste Rang bringt */
  skillDetailHtml(sk){
    const h=G.hero,rank=h.skills[sk.k]||0;
    const maxed=rank>=sk.max;
    const reqOk=!sk.req||(h.skills[sk.req[0]]||0)>=sk.req[1];
    let x='<div>'+
      '<div class="dname" style="color:var(--acc)">'+sk.ico+" "+sk.n+'</div>'+
      '<div class="dsub">Zweig '+BRANCHES[sk.col].n+" \u00B7 Rang "+rank+" von "+sk.max+'</div>';
    x+='<div class="h3" style="margin-top:0">Wirkung pro Rang</div>';
    x+=effLines(sk.e,1).map(l=>'<div class="effline">'+l+'</div>').join("");
    if(rank>0){
      x+='<div class="h3">Aktuell aktiv (Rang '+rank+')</div>';
      x+=effLines(sk.e,rank).map(l=>'<div class="effline">'+l+'</div>').join("");
    }
    if(!maxed){
      x+='<div class="h3">Nach dem nächsten Rang</div>';
      x+=effLines(sk.e,rank+1).map(l=>'<div class="effnext">'+l+'</div>').join("");
    }
    if(sk.req){
      const p=SKILLS.find(y=>y.k===sk.req[0]);
      x+='<div class="hint" style="margin-top:8px">Voraussetzung: '+p.n+" Rang "+sk.req[1]+
        ' <span class="'+(reqOk?"up":"dn")+'">'+(reqOk?"erfüllt":"noch offen ("+(h.skills[sk.req[0]]||0)+"/"+sk.req[1]+")")+'</span></div>';
    }
    x+='<div class="btnrow" style="margin-top:10px">';
    if(maxed)x+='<button class="btn" disabled>Vollständig gelernt</button>';
    else if(!reqOk)x+='<button class="btn" disabled>Voraussetzung fehlt</button>';
    else if(h.skillPts<=0)x+='<button class="btn" disabled>Kein Punkt verfügbar</button>';
    else x+='<button class="btn p" id="skLearn">Rang '+(rank+1)+' lernen (1 Punkt)</button>';
    x+='<button class="btn" id="skClose">Schließen</button></div></div>';
    return x;
  },
  /** Fähigkeitsdetails als Fenster: Wirkung jetzt und nach dem nächsten Rang */
  openSkill(key){
    const sk=SKILLS.find(x=>x.k===key);if(!sk)return;
    this.selSkill=key;
    this.openSheet(this.skillDetailHtml(sk),()=>{
      const h=G.hero;
      const lb=$("skLearn");
      if(lb)lb.onclick=()=>{
        if(!this.canLearn(sk))return;
        h.skills[sk.k]=(h.skills[sk.k]||0)+1;h.skillPts--;h.recompute();
        SFX.init();SFX.skill();G.parts.confetti(120,GROUND-50);
        this.log(sk.n+" auf Rang "+h.skills[sk.k]+": "+effLines(sk.e,h.skills[sk.k]).join(", "),"lvl");
        this.renderSkills();this.updateBars();
        this.openSkill(key);      // Fenster mit dem neuen Rang neu aufbauen
      };
      const cb=$("skClose");
      if(cb)cb.onclick=()=>this.closeSheet();
    });
    this.renderSkills();
  },
  renderSkills(){
    const h=G.hero;
    const COLS=3,ROWS=13;
    const px=c=>((c+.5)/COLS*100);
    const py=r=>(r*80+96);
    let lines="";
    for(const sk of SKILLS){
      if(!sk.req)continue;
      const p=SKILLS.find(x=>x.k===sk.req[0]);
      const on=(h.skills[sk.req[0]]||0)>=sk.req[1];
      lines+='<line x1="'+px(p.col)+'%" y1="'+py(p.row)+'" x2="'+px(sk.col)+'%" y2="'+py(sk.row)+'" '+
        'stroke="'+(on?"#bd93f9":"#3a3455")+'" stroke-width="'+(on?3:2)+'" '+
        (on?'style="filter:drop-shadow(0 0 5px #bd93f9)"':'stroke-dasharray="4 4"')+'/>';
    }
    let heads="";
    BRANCHES.forEach((br,i)=>{
      heads+='<div class="branchhead" style="left:'+px(i)+'%"><b>'+br.n+'</b><small>'+br.d+'</small></div>';
    });
    let nodes="";
    for(const sk of SKILLS){
      const rank=h.skills[sk.k]||0;
      const maxed=rank>=sk.max;
      const locked=sk.req&&(h.skills[sk.req[0]]||0)<sk.req[1];
      const cls=maxed?"max":locked?"locked":rank>0?"taken":this.canLearn(sk)?"avail":"";
      const sel=this.selSkill===sk.k?" picked":"";
      nodes+='<div class="node '+cls+sel+'" data-skill="'+sk.k+'" style="left:'+px(sk.col)+'%;top:'+py(sk.row)+'px">'+
        '<span class="ico">'+sk.ico+'</span><span>'+sk.n+'</span>'+
        '<span class="rk">'+rank+" / "+sk.max+'</span></div>';
    }
    const spent=SKILLS.reduce((n,sk)=>n+(h.skills[sk.k]||0),0);
    const total=SKILLS.reduce((n,sk)=>n+sk.max,0);
    let html=this.ultCardHtml();
    html+='<div class="row"><span>Verfügbare Punkte</span><b style="color:var(--acc)">'+h.skillPts+'</b></div>'+
      '<div class="row"><span>Gelernte Ränge</span><b>'+spent+" / "+total+'</b></div>'+
      '<div class="hint">Ein Punkt pro Stufe. Fähigkeit anklicken, um ihre Wirkung zu sehen — '+
      'gelernt wird erst über den Knopf.</div>'+
      '<div class="tree" style="height:'+(ROWS*80+120)+'px">'+heads+'<svg>'+lines+'</svg>'+nodes+'</div>';
    $("tab-skills").innerHTML=html;
    this.bindUltCard($("tab-skills"));
    $("tab-skills").querySelectorAll("[data-skill]").forEach(n=>{
      n.onclick=()=>{SFX.init();this.openSkill(n.dataset.skill);};
    });
  },
  /* ---------- Tab: Stadt (Händler + Ahnenhalle) ---------- */
  refreshShop(){
    const h=G.hero;
    G.shop=[];
    const n=5;
    for(let i=0;i<n;i++){
      const r=G.meta.smith?(Math.random()<.02?3:Math.random()<.13?2:Math.random()<.45?1:0)
                          :(Math.random()<.02?2:Math.random()<.18?1:0);
      const it=makeItem(Math.max(1,h.level+ri(-1,2)),null,r,0);
      G.shop.push({it,price:Math.round((itemScore(it)*1.6+it.lvl*12)*(1+r*.3))});
    }
  },
  renderTown(){
    const h=G.hero;
    if(!G.shop)this.refreshShop();
    let html='<div class="h3">Händler</div><div class="shop">';
    html+='<div class="offer"><div class="ic" style="color:#5ce08a">'+artImg("misc_potion","\u2665")+'</div>'+
      '<div class="meta"><div>Heiltrank</div><small>Stellt '+Math.round(35+(G.meta.potion||0)*7)+' % Leben her</small></div>'+
      '<button class="btn" data-buy="potion">'+this.potionPrice()+' G</button></div>';
    G.shop.forEach((o,i)=>{
      html+='<div class="offer"><div class="ic" style="color:'+RARITY[o.it.rar].hex+'" data-shop="'+i+'">'+
        artImg(artIdFor(o.it),SLOTS[o.it.slot].ico)+'</div><div class="meta"><div style="color:'+RARITY[o.it.rar].hex+'">'+o.it.name+
        '</div><small>'+RARITY[o.it.rar].n+" \u00B7 "+SLOTS[o.it.slot].n+" \u00B7 Wertung "+itemScore(o.it)+'</small></div>'+
        '<button class="btn" data-buyitem="'+i+'"'+(h.gold<o.price?" disabled":"")+'>'+fmt(o.price)+' G</button></div>';
    });
    html+='</div><div class="btnrow" style="margin-top:9px">'+
      '<button class="btn" id="reroll">Waren erneuern (50 G)</button></div>';

    // ---------- Schmied ----------
    const forgeable=[].concat(Object.values(h.equip).filter(Boolean),h.bag)
      .filter(it=>!it.isRune&&(it.dmax||it.armor))
      .sort((a,b)=>itemScore(b)-itemScore(a)).slice(0,18);
    html+='<div class="h3">Schmied — Waffen und Rüstung aufwerten</div>'+
      '<div class="hint">Jede Stufe hebt Schaden oder Rüstung um 10 % und die festen Attribute um 7 %. '+
      'Höchstens '+maxUpgrade()+' Stufen je Stück.</div>';
    if(forgeable.length){
      html+='<div class="bag" style="margin-top:9px">'+
        forgeable.map((it,i)=>{
          const done=(it.up||0)>=maxUpgrade();
          const cost=smithCost(it);
          return '<div class="cell r'+it.rar+'" data-forge="'+i+'" style="color:'+RARITY[it.rar].hex+
            (done?";opacity:.45":"")+'" title="'+iname(it)+" \u00B7 "+
            (done?"voll aufgewertet":cost+" Gold")+'">'+
            artImg(artIdFor(it),SLOTS[it.slot]?SLOTS[it.slot].ico:"?")+
            ((it.up)?'<span class="upnum">+'+it.up+'</span>':"")+'</div>';
        }).join("")+'</div>';
    }else html+='<div class="hint" style="margin-top:8px">Du trägst nichts, was sich schmieden ließe.</div>';

    // ---------- Mystiker ----------
    const gcounts={};h.gems.forEach(g=>gcounts[g]=(gcounts[g]||0)+1);
    const gkeys=Object.keys(gcounts).sort((a,b)=>parseGem(b).q-parseGem(a).q);
    // Alle eingesetzten Steine, angelegt und im Beutel
    const socketed=[];
    const owned=[].concat(Object.values(h.equip).filter(Boolean),h.bag);
    for(const it of owned){
      if(!it||!it.sockets)continue;
      it.sockets.forEach((g,si)=>{if(g)socketed.push({it,si,gem:g,worn:Object.values(h.equip).indexOf(it)>=0});});
    }
    const scount={};socketed.forEach(x=>scount[x.gem]=(scount[x.gem]||0)+1);
    const nextTxt=P=>P.q>=9?"höchste Güte":"nächste Güte: "+GEM_QUAL[P.q+1].n+
      " (+"+Math.max(1,Math.round(P.base.amt*GEM_QUAL[P.q+1].m))+P.base.unit+")";
    html+='<div class="h3">Mystiker — Edelsteine veredeln</div>'+
      '<div class="hint">Drei gleiche Steine verschmelzen zu einem der nächsten Güte. '+
      'Einzelne Steine hebt der Mystiker gegen Seelensplitter an — auch solche, die schon in einem Gegenstand sitzen.</div>';
    if(gkeys.length){
      html+='<div class="shop" style="margin-top:9px">';
      for(const k of gkeys){
        const P=parseGem(k),n=gcounts[k],top=P.q>=9,inS=scount[k]||0;
        const mc=mergeCost(P.q,h.level),rc=refineCost(P.q);
        let note="";
        if(!top&&n<3&&n+inS>=3){
          // Fehlende Steine stecken in Gegenständen: sagen, was das Herausnehmen kostet
          const need=3-n;
          const pull=socketed.filter(x=>x.gem===k).slice(0,need)
            .reduce((t,x)=>t+gemRemoveCost(parseGem(x.gem).q),0);
          note='<small style="display:block;color:var(--gold)">'+inS+' weitere eingesetzt — '+need+
            ' herausnehmen für '+fmt(pull)+' G, dann verschmelzbar</small>';
        }else if(inS)note='<small style="display:block;color:var(--muted)">'+inS+' weitere eingesetzt</small>';
        html+='<div class="offer stack"><div class="ic" style="color:'+P.col+'">'+
          artImg("gem_"+P.base.k,P.base.ico)+'</div>'+
          '<div class="meta"><div style="color:'+P.Q.col+'">'+P.name+' ×'+n+'</div>'+
          '<small>'+P.txt+" · "+nextTxt(P)+'</small>'+note+'</div><div class="acts">'+
          (top?'<span class="hint">höchste Güte</span>':'<button class="btn" data-merge="'+k+'"'+((n>=3&&h.gold>=mc)?"":" disabled")+'>'+
            '3→1 · '+fmt(mc)+' G</button>'+
          '<button class="btn s" data-refine="'+k+'"'+((G.shards>=rc)?"":" disabled")+'>'+
            'Veredeln · '+rc+' ✦</button>')+
          '</div></div>';
      }
      html+='</div>';
    }else html+='<div class="hint" style="margin-top:8px">Du trägst keine losen Edelsteine bei dir.</div>';

    // Eingesetzte Steine: direkt veredeln oder gegen Gold herauslösen
    html+='<div class="h3">Mystiker — eingesetzte Edelsteine</div>';
    if(socketed.length){
      html+='<div class="hint">Veredeln wirkt sofort im Gegenstand. Herauslösen legt den Stein zurück in deinen Beutel.</div>'+
        '<div class="shop" style="margin-top:9px">';
      socketed.forEach((x,idx)=>{
        const P=parseGem(x.gem),top=P.q>=9,rc=refineCost(P.q),cost=gemRemoveCost(P.q);
        html+='<div class="offer stack"><div class="ic" style="color:'+P.col+'">'+
          artImg("gem_"+P.base.k,P.base.ico)+'</div>'+
          '<div class="meta"><div><span style="color:'+P.Q.col+'">'+P.name+'</span> '+
          '<span style="color:var(--muted)">in</span> <span style="color:'+RARITY[x.it.rar].hex+'">'+iname(x.it)+'</span></div>'+
          '<small>'+P.txt+(x.worn?" · angelegt":" · im Beutel")+" · "+nextTxt(P)+'</small></div><div class="acts">'+
          (top?'':'<button class="btn s" data-refinesock="'+idx+'"'+(G.shards>=rc?"":" disabled")+'>'+
            'Veredeln · '+rc+' ✦</button>')+
          '<button class="btn" data-removegem="'+idx+'"'+(h.gold>=cost?"":" disabled")+'>'+
            'Herauslösen · '+fmt(cost)+' G</button></div></div>';
      });
      html+='</div>';
    }else html+='<div class="hint">In keinem deiner Gegenstände sitzt ein Edelstein.</div>';

    // Sockel bohren, bis zu fünf je Gegenstand
    const drillable=owned.filter(it=>!it.isRune&&it.sockets.length<MAX_SOCKETS)
      .sort((a,b)=>{const wa=Object.values(h.equip).indexOf(a)>=0,wb=Object.values(h.equip).indexOf(b)>=0;
        return (wb-wa)||(itemScore(b)-itemScore(a));}).slice(0,10);
    html+='<div class="h3">Mystiker — Sockel bohren</div>'+
      '<div class="hint">Jeder Gegenstand fasst bis zu '+MAX_SOCKETS+' Sockel. Jeder weitere wird teurer.</div>';
    if(drillable.length){
      html+='<div class="shop" style="margin-top:9px">';
      drillable.forEach((it,idx)=>{
        const cost=drillCost(it),worn=Object.values(h.equip).indexOf(it)>=0;
        html+='<div class="offer stack"><div class="ic" style="color:'+RARITY[it.rar].hex+'">'+
          artImg(artIdFor(it),SLOTS[it.slot]?SLOTS[it.slot].ico:"?")+'</div>'+
          '<div class="meta"><div style="color:'+RARITY[it.rar].hex+'">'+iname(it)+'</div>'+
          '<small>'+socketDots(it)+' '+it.sockets.length+' / '+MAX_SOCKETS+' Sockel'+(worn?" · angelegt":"")+'</small></div><div class="acts">'+
          '<button class="btn" data-drill="'+idx+'"'+(h.gold>=cost?"":" disabled")+'>'+
            '+1 Sockel · '+fmt(cost)+' G</button></div></div>';
      });
      html+='</div>';
    }else html+='<div class="hint">Alle deine Gegenstände haben bereits '+MAX_SOCKETS+' Sockel.</div>';

    html+='<div class="h3">Ahnenhalle — dauerhafte Verbesserungen</div>'+
      '<div class="row"><span>Seelensplitter</span><b style="color:var(--soul)">'+G.shards+'</b></div>'+
      '<div class="hint">Diese Aufwertungen gelten für jeden zukünftigen Run.</div><div style="margin-top:8px">';
    html+=this.metaHtml();
    html+='</div>';
    const el=$("tab-town");el.innerHTML=html;
    el.querySelector("[data-buy=potion]").onclick=()=>{
      const p=this.potionPrice();
      if(h.gold<p){this.toast("Zu wenig Gold.");return;}
      h.gold-=p;h.potions++;SFX.buy();this.log("Heiltrank gekauft.","gold");this.renderTown();this.updateBars();
    };
    el.querySelectorAll("[data-buyitem]").forEach(b=>{
      b.onclick=()=>{
        const o=G.shop[+b.dataset.buyitem];
        if(h.gold<o.price){this.toast("Zu wenig Gold.");return;}
        h.gold-=o.price;h.bag.push(o.it);
        G.shop.splice(+b.dataset.buyitem,1);
        SFX.buy();this.log("Gekauft: "+o.it.name+".","gold");
        this.renderTown();this.updateBars();
      };
    });
    el.querySelectorAll("[data-shop]").forEach(ic=>{
      const o=G.shop[+ic.dataset.shop];
      if(HOVER){ic.onmouseenter=e=>this.showTooltip(o.it,e,h.equip[o.it.slot]);
        ic.onmouseleave=()=>this.hideTooltip();}
      ic.onclick=()=>this.openItem(o.it,"shop");
    });
    // Schmied
    el.querySelectorAll("[data-forge]").forEach(b=>{
      b.onclick=()=>{const it=forgeable[+b.dataset.forge];if(it)this.openForge(it);};
    });
    // Mystiker
    el.querySelectorAll("[data-merge]").forEach(b=>{
      b.onclick=()=>{
        const key=b.dataset.merge,P=parseGem(key);
        const cost=mergeCost(P.q,h.level);
        if(h.gold<cost||h.gems.filter(g=>g===key).length<3)return;
        h.gold-=cost;
        for(let i=0;i<3;i++)h.gems.splice(h.gems.indexOf(key),1);
        const nk=gemId(P.base.k,P.q+1);
        h.gems.push(nk);
        const N=parseGem(nk);
        SFX.init();SFX.socket();
        this.log("Der Mystiker verschmilzt drei "+P.name+" zu einem "+N.name+" ("+N.txt+").","loot");
        this.toast(N.name+" erschaffen.");
        this.renderTown();this.updateBars();
      };
    });
    el.querySelectorAll("[data-refine]").forEach(b=>{
      b.onclick=()=>{
        const key=b.dataset.refine,P=parseGem(key);
        const cost=refineCost(P.q);
        if(G.shards<cost||h.gems.indexOf(key)<0)return;
        G.shards-=cost;
        h.gems.splice(h.gems.indexOf(key),1);
        const nk=gemId(P.base.k,P.q+1);
        h.gems.push(nk);
        const N=parseGem(nk);
        SFX.init();SFX.levelup();
        this.log("Der Mystiker veredelt einen "+P.name+" zu einem "+N.name+" ("+N.txt+").","lvl");
        G.save();this.renderTown();this.updateBars();
      };
    });
    // Eingesetzte Steine

    el.querySelectorAll("[data-removegem]").forEach(b=>{
      b.onclick=()=>{
        const x=socketed[+b.dataset.removegem];if(!x||x.it.sockets[x.si]!==x.gem)return;
        const P=parseGem(x.gem),cost=gemRemoveCost(P.q);
        if(h.gold<cost)return;
        h.gold-=cost;x.it.sockets[x.si]=null;h.gems.push(x.gem);
        SFX.init();SFX.socket();G.parts.puff(120,GROUND-40,P.col);
        this.log("Der Mystiker löst "+P.name+" aus "+iname(x.it)+" (−"+fmt(cost)+" Gold).","gold");
        afterGemChange();
      };
    });
    el.querySelectorAll("[data-refinesock]").forEach(b=>{
      b.onclick=()=>{
        const x=socketed[+b.dataset.refinesock];if(!x||x.it.sockets[x.si]!==x.gem)return;
        const P=parseGem(x.gem),cost=refineCost(P.q);
        if(G.shards<cost||P.q>=9)return;
        G.shards-=cost;
        const nk=gemId(P.base.k,P.q+1);x.it.sockets[x.si]=nk;
        const N=parseGem(nk);
        SFX.init();SFX.levelup();G.parts.ring(120,GROUND-40,N.Q.col);
        this.log("Der Mystiker veredelt "+P.name+" in "+iname(x.it)+" zu "+N.name+" ("+N.txt+").","lvl");
        afterGemChange();
      };
    });
    el.querySelectorAll("[data-drill]").forEach(b=>{
      b.onclick=()=>{
        const it=drillable[+b.dataset.drill];if(!it||it.sockets.length>=MAX_SOCKETS)return;
        const cost=drillCost(it);if(h.gold<cost)return;
        h.gold-=cost;it.sockets.push(null);
        SFX.init();SFX.socket();G.parts.sparks(120,GROUND-40);
        this.log("Der Mystiker bohrt einen Sockel in "+iname(it)+" ("+it.sockets.length+" / "+MAX_SOCKETS+").","loot");
        afterGemChange();
      };
    });
    $("reroll").onclick=()=>{
      if(h.gold<50){this.toast("Zu wenig Gold.");return;}
      h.gold-=50;this.refreshShop();SFX.buy();this.renderTown();this.updateBars();
    };
    this.bindMeta(el);
  },

  openForge(it){
    const h=G.hero;
    const draw=()=>{
      const up=it.up||0,max=maxUpgrade(),done=up>=max;
      const cost=smithCost(it);
      const preview=JSON.parse(JSON.stringify(it));
      if(!done)upgradeItem(preview);
      const rows=(a,b)=>{
        const A=this.itemRows(a),B=this.itemRows(b);
        const keys=[];for(const k in B)keys.push(k);
        let x='<div class="cmpgrid"><div class="hd">Eigenschaft</div>'+

        for(const k of keys){
          const va=A[k]||0,vb=B[k]||0,d=Math.round((vb-va)*10)/10;
          x+='<div>'+k+'</div><div class="ve">'+(va||"\u2014")+'</div>'+
             '<div class="vn '+(d>0?"up":"")+'">'+(vb||"\u2014")+
             (d?' <small>(+'+d+')</small>':"")+'</div>';
        }
        return x+'</div>';

      const html='<div>'+
        (ASSETS[artIdFor(it)]?'<img class="detail-art" src="'+ASSET_DIR+artIdFor(it)+'.png" alt="">':"")+
        '<div class="dname" style="color:'+RARITY[it.rar].hex+'">'+iname(it)+'</div>'+
        '<div class="dsub">Aufwertung '+up+' von '+max+
        (G.meta.smith?' \u00B7 Meisterschmied: 25 % Rabatt':"")+'</div>'+
        (done?'<div class="verdict neutral">Dieses Stück ist voll aufgewertet.</div>':
          '<div style="margin-top:6px">'+rows(it,preview)+'</div>'+
          '<div class="verdict '+(h.gold>=cost?"good":"bad")+'">Kosten: '+fmt(cost)+
          ' Gold \u00B7 vorhanden: '+fmt(h.gold)+' Gold</div>')+
        '<div class="btnrow" style="margin-top:10px">'+
        (done?"":'<button class="btn p" id="forgeGo"'+(h.gold>=cost?"":" disabled")+'>Aufwerten</button>')+
        '<button class="btn" id="forgeClose">Schließen</button></div></div>';

        const go=$("forgeGo");
        if(go)go.onclick=()=>{

  /** Zusammenfassung dessen, was die Weihgaben zurzeit bewirken */
  relicSummaryHtml(only){
    const R=relicBonuses(only);
    const names={str:"Stärke",dex:"Geschick",int:"Intelligenz",vit:"Ausdauer",hp:"Leben",
      armor:"Rüstung",crit:"Krit-Chance %",critdmg:"Krit-Schaden %",dmgpct:"Schaden %",
      aspd:"Angriffstempo %",leech:"Lebensraub %",gf:"Goldfund %",mf:"Magiefund %",thorns:"Dornen %"};
    const parts=[];
    for(const k in R.stats){const v=Math.round(R.stats[k]*10)/10;if(v)parts.push("+"+v+" "+(names[k]||k));}
    if(R.armor)parts.push("+"+Math.round(R.armor)+" Rüstung");
    if(R.dmgpct)parts.push("+"+Math.round(R.dmgpct)+" Schaden %");
    for(const k in R.rune){const v=Math.round(R.rune[k]*10)/10;
      parts.push(effLines({[k]:v},1)[0]);}
    for(const k in R.skills){const sk=SKILLS.find(x=>x.k===k);
      if(sk)parts.push("+"+R.skills[k]+" Rang "+sk.n);}
    for(const k in R.uniq){const u=UNIQUES.find(x=>x.e===k);if(u)parts.push(u.d);}
    return parts.length?parts.join(" \u00B7 "):"Noch keine Weihgabe wirkt.";

  /** Schreibt den Spielstand als JSON-Datei; klappt der Download nicht, öffnet sich das Textfenster */
  downloadSave(){
    const json=JSON.stringify(this.saveBlob(),null,1);
    try{
      const blob=new Blob([json],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download="auto-dungeon-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
      this.toast("Im Browser gesichert und als JSON-Datei geschrieben.");
    }catch(e){
      this.toast("Download blockiert \u2014 hier ist der Text zum Kopieren.");
      this.showExport();
    }
  },
  showExport(){
    const json=JSON.stringify(this.saveBlob(),null,1);
    const html='<div><div class="dname">Spielstand sichern</div>'+
      '<div class="dsub">Vollständiger Stand als JSON \u2014 herunterladen oder den Text kopieren</div>'+

  /** Zeichnet den Helden so, wie er im Spiel aussehen wird — für den Editor */
  drawPortrait(cv,race,cls,tint,lookIdx){
    const ctx=cv.getContext("2d");
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled=false;
    ctx.clearRect(0,0,cv.width,cv.height);
    const R=2;ctx.setTransform(R,0,0,R,0,0);
    const W2=cv.width/R,H2=cv.height/R;
    const look=raceLook(race,lookIdx||0);
    const comboId=HERO_SPRITES[look.key+"_"+cls];
    const hasArt=!!ASSETS[comboId];
    const sp=(hasArt?SPRITES[comboId]:SPRITES[CLASSES[cls].sp])||SPRITES.humanoid;
    const hue=CLASSES[cls].hue+(tint||0);
    const pal=palette(hue,55);
    const sc=3.1*look.sc;
    const gy=H2-9,x=W2/2;
    // Bodenkreis
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();ctx.ellipse(x,gy+1,15*look.sc*(look.wide||1),4,0,0,7);ctx.fill();
    if(look.wide){ctx.save();ctx.translate(x,0);ctx.scale(look.wide,1);ctx.translate(-x,0);}
    drawSprite(ctx,sp,x,gy,sc,pal,false,null,1,hasArt?ASSET_HUE:hue);
    if(look.wide)ctx.restore();
    if(!hasArt)drawRaceFeatures(ctx,look,x,gy-sp.base*(sc/sp.f)+7*look.sc,look.sc,false);
    ctx.setTransform(1,0,0,1,0,0);
  },

  drawFoePortrait(cv,foe){
    const sp=SPRITES[foe.model];if(!sp)return;
    const ctx=cv.getContext("2d");
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled=false;
    ctx.clearRect(0,0,cv.width,cv.height);
    const R=2;ctx.setTransform(R,0,0,R,0,0);
    const W2=cv.width/R,H2=cv.height/R;
    const pal=palette(foe.hue,foe.boss?62:55);
    const u=(H2-14)/sp.base;                 // auf die Kachelhöhe einpassen
    ctx.globalAlpha=.3;ctx.fillStyle="#000";
    ctx.beginPath();ctx.ellipse(W2/2,H2-6,sp.w*u*.4,4,0,0,7);ctx.fill();ctx.globalAlpha=1;
    drawSprite(ctx,sp,W2/2,H2-6,u*sp.f,pal,true,null,1,foe.hue);
    ctx.setTransform(1,0,0,1,0,0);
  },
  /** Weg-Strahl: wie weit dieser Held kam und wo alle Vorgänger gefallen sind */
  pathHtml(currentDist){
    const graves=G.graves.slice();
    const marks=graves.map((g,i)=>({d:g.dist,g:g,now:false,idx:i}));
    if(currentDist!==null&&currentDist!==undefined)
      marks.push({d:Math.round(currentDist),g:null,now:true,idx:-1});
    if(!marks.length)return '<div class="hint">Noch keine Wege zurückgelegt.</div>';
    const maxD=Math.max.apply(null,marks.map(m=>m.d));
    const best=Math.max.apply(null,graves.map(g=>g.dist).concat([0]));
    const span=Math.max(600,maxD*1.08);
    const pos=d=>(d/span*100);
    // Beschriftete Marken abwechselnd über und unter den Strahl, damit sie sich nicht überlagern
    marks.sort((a,b)=>a.d-b.d);
    // Beschriftungen brauchen Platz: höchstens acht Marken, mindestens 96 px Abstand
    let ticks="",tickN=0;
    const steps=[250,500,1000,2000,5000,10000,20000,50000,100000];
    let step=steps[steps.length-1];
    for(const st of steps){if(span/st<=7){step=st;break;}}
    const fmtD=d=>d>=1000?(d%1000===0?(d/1000)+" km":(d/1000).toFixed(1)+" km"):d+" m";
    for(let d=0;d<=span;d+=step){
      ticks+='<div class="tick" style="left:'+pos(d)+'%"></div>'+
        '<div class="ticklb" style="left:'+pos(d)+'%">'+fmtD(d)+'</div>';
      tickN++;
    }
    // Weltenbosse aller Läufe plus des aktuellen Helden
    let bossList=[];
    for(const g of graves)if(g.bosses)bossList=bossList.concat(g.bosses);
    if(currentDist!==null&&currentDist!==undefined&&G.bossMarks)
      bossList=bossList.concat(G.bossMarks);
    let bossPins="";
    for(const b of bossList){
      if(b.d>span)continue;
      bossPins+='<div class="bossmark" style="left:'+pos(b.d)+'%" title="'+b.n+
        " \u00B7 Stufe "+b.lvl+" \u00B7 "+fmt(b.d)+' m">'+
        '<span class="pin">\u265B</span><span class="lb">Zone '+(b.zone||1)+'</span>'+
        '<span class="stem"></span></div>';
    }
    let pins="";
    marks.forEach((m,i)=>{
      const up=i%2===0;
      if(m.now){
        // Nur der Marker, ohne Beschriftung — die Einordnung liefert die Achse
        pins+='<div class="grave now" style="left:'+pos(m.d)+'%" title="Hier gefallen \u00B7 '+
          fmt(m.d)+' m">'+
          '<span class="pin">\u25BC</span></div>';
      }else{
        const g=m.g;
        const isBest=g.dist===best&&best>0;
        pins+='<div class="grave '+(isBest?"best ":"")+(up?"up":"down")+'" style="left:'+pos(m.d)+'%" '+
          'title="'+g.name+" \u00B7 Stufe "+g.level+" \u00B7 Zone "+g.zone+" \u00B7 "+g.biome+'">'+
          '<span class="pin">\u2020</span><span class="lb">'+
          (isBest?"\u2605 ":"")+"St. "+g.level+'</span></div>';
      }
    });
    // Innenbreite so wählen, dass jede Beschriftung Platz hat; der Rahmen scrollt
    const needPx=Math.max(tickN*96,marks.length*64,520);
    return '<div class="path"><div class="pathinner" style="width:'+needPx+'px;min-width:100%">'+
      '<div class="ray"><span class="glow"></span></div>'+ticks+bossPins+pins+'</div></div>'+
      '<div class="pathlegend"><span>\u25BC dieser Held</span><span>\u2020 frühere Helden</span>'+
      '<span style="color:#ff7ad9">\u265B besiegte Weltenbosse ('+bossList.length+')</span>'+
      '<span style="color:var(--gold)">\u2605 bisher weiteste Strecke</span>'+
      '<span>Weiteste: '+fmt(Math.max(best,currentDist||0))+' m</span></div>';
  },

        (it.sockets&&it.sockets.length?'<span class="sock'+(it.sockets.indexOf(null)>=0?" open":"")+'">'+socketDots(it)+'</span>':"")+
        (this._heirPick.indexOf(it)>=0?'<span class="better">\u2713</span>':"")+'</div>').join("")+
      '</div>'+
      '<div class="h3">Seelensteine ('+this._gemPick.length+" / "+maxGem+')</div>'+
      (gemList.length?'<div class="gemrow">'+
        gemList.map((g,i)=>{const P=parseGem(g);
          return '<div class="gem'+(this._gemPick.indexOf(i)>=0?" sel":"")+'" data-gem2="'+i+'" '+
            'style="color:'+P.col+';border-color:'+P.Q.col+'" title="'+P.name+" \u00B7 "+P.txt+'">'+
            artImg("gem_"+P.base.k,P.base.ico)+'</div>';}).join("")+
        '</div>':'<div class="hint">Dieser Held hat keine Steine hinterlassen.</div>')+
      (goldHeir?'<div class="hint" style="margin-top:6px;color:var(--gold)">Der Erbbeutel gibt '+
        fmt(goldHeir)+' Gold an den nächsten Helden weiter.</div>':"")+
      '<div class="h3">Ahnenhalle</div>'+
      '<div class="hint">Splitter jetzt ausgeben — die Boni gelten sofort für den nächsten Run.</div>'+
      '<div style="margin-top:8px">'+this.metaHtml()+'</div>'+
      '<div class="btnrow" style="justify-content:center;margin-top:16px">'+
      '<button class="btn p" id="dNew">Neuen Helden erschaffen</button></div>';
    // Standbild einhängen; notfalls jetzt noch einmal vom Spielfeld abgreifen
    const box=$("shotBox");
    if(box){
      if(!G.deathCv)G.grabFrame();
      if(G.deathCv){box.innerHTML="";box.appendChild(G.deathCv);}
      else box.innerHTML='<div class="hint" style="padding:14px;text-align:center">'+
        'Das Standbild konnte nicht gesichert werden.</div>';
    }
    // Porträt des Gegners, der den letzten Schlag geführt hat
    const fcv=$("foeCv");
    if(fcv&&G.deathFoe)this.drawFoePortrait(fcv,G.deathFoe);
    c.querySelectorAll("[data-holy]").forEach(el=>{
      const it=holyList[+el.dataset.holy];
      if(HOVER){el.onmouseenter=e=>this.showTooltip(it,e,null);
        el.onmouseleave=()=>this.hideTooltip();}
      el.onclick=()=>{
        this.hideTooltip();
        this._relicPick=this._relicPick===it?null:it;
        SFX.init();SFX.socket();this.showDeath(null,null,true);
      };
    });
    const cBtn=$("dConsecrate");
    if(cBtn)cBtn.onclick=()=>{
      const it=this._relicPick;
      if(!it||!grave||grave.relic||G.shards<relicPrice)return;
      G.shards-=relicPrice;
      // Ist jeder Platz belegt, ruht die älteste wirkende Weihgabe — die neue wirkt sofort
      const act=G.graves.filter(x=>x.relic&&x.active);
      if(act.length>=relicSlots())act[0].active=false;
      grave.relic=JSON.parse(JSON.stringify(it));
      grave.active=true;
      // Der Gegenstand bleibt am Grab und kann nicht zusätzlich vererbt werden
      for(const sl in h.equip)if(h.equip[sl]===it)h.equip[sl]=null;
      const bi=h.bag.indexOf(it);if(bi>=0)h.bag.splice(bi,1);
      const hi=this._heirPick.indexOf(it);if(hi>=0)this._heirPick.splice(hi,1);
      this._relicPick=null;
      SFX.init();SFX.levelup();
      this.log(it.name+" wurde "+grave.name+" geweiht und wirkt in jeder künftigen Generation.","lvl");
      this.toast("✦ "+it.name+" geweiht");
      G.save();this.updateBars();
      this.showDeath(null,null,true);
    };
    c.querySelectorAll("[data-gem2]").forEach(el=>{
      el.onclick=()=>{
        const i=+el.dataset.gem2;
        const at=this._gemPick.indexOf(i);
        if(at>=0)this._gemPick.splice(at,1);
        else{if(this._gemPick.length>=maxGem){this.toast("Grenze erreicht.");return;}this._gemPick.push(i);}
        SFX.socket();this.showDeath(null,null,true);
      };
    });
    c.querySelectorAll("[data-heir]").forEach(el=>{
      const it=candidates[+el.dataset.heir];
      if(HOVER){el.onmouseenter=e=>this.showTooltip(it,e,null);
        el.onmouseleave=()=>this.hideTooltip();}
      el.onclick=()=>{
        const i=this._heirPick.indexOf(it);
        if(i>=0)this._heirPick.splice(i,1);
        else{if(this._heirPick.length>=maxHeir){this.toast("Grenze erreicht.");return;}this._heirPick.push(it);}
        SFX.socket();this.showDeath(null,null,true);
      };
    });
    this.bindMeta(c);
    $("dNew").onclick=async()=>{
      G.heirlooms=this._heirPick.map(i=>JSON.parse(JSON.stringify(i)));
      G.heirGems=this._gemPick.map(i=>gemList[i]);
      G.heirGold=goldHeir;
      await Store.del("ad_run");
      await G.save();
      this.showCreator();
    };
    o.classList.add("on");
  }
};

/* ============================================================================
   10. BOOT
   ========================================================================== */
buildHeroSprites();
loadAssets();
const G=new Game();
UI.init();
(async function boot(){
  await G.loadAudioSettings();
  await G.loadMeta();
  const run=await Store.get("ad_run");
  UI.showIntro(!!run);
  setInterval(()=>{if(G.hero&&G.state!=="dead"&&G.state!=="idle")G.save();},20000);
})();
buildTabs();
checkFontAwesome();
setTimeout(checkFontAwesome,1500);      // Stylesheet kann später eintreffen
MUSIC.preload();
document.addEventListener("pointerdown",()=>{SFX.init();MUSIC.init();updateMusic();},{once:true});
</script>
</body>
</html>
