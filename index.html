<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auto-Dungeon: Legacy</title>
<link rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   THEME — "Midnight Arcade": tiefes Violett-Nachtblau, Dracula-nah
   ============================================================ */
:root{
  --bg:#14121f; --bg2:#0e0c17;
  --panel:#1e1b2e; --panel2:#262238; --panel3:#302b46;
  --line:#3a3455;
  --text:#e8e5f6; --muted:#8d86ab; --dim:#5f5980;
  --acc:#bd93f9; --acc2:#8be9fd;
  --hp:#ff5566; --xp:#c39bff; --mana:#5aa9ff;
  --gold:#ffc861; --soul:#7ef0d0;
  --r-0:#b6b2c9; --r-1:#5aa9ff; --r-2:#f2e06a; --r-3:#ff9a3c;
  --good:#5ce08a; --bad:#ff6b6b;
  --font:"Courier New",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
/* Touch: Doppeltippen zoomt nicht mehr ins Bild, Antippen blitzt nicht grau auf.
   Pinch-Zoom bleibt erlaubt. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body,button,.cell,.gem,.node,.tabs,canvas,.ultbtn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.cell,.gem,.node,.tabs,.ultbtn,.bar,.chip{-webkit-user-select:none;user-select:none}
body{
  margin:0;background:
    radial-gradient(1200px 600px at 20% -10%,#241f3d 0%,transparent 60%),
    radial-gradient(900px 500px at 100% 0%,#1b2440 0%,transparent 55%),
    var(--bg);
  color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--panel3),var(--panel2));border-radius:8px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 26px}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-weight:700;letter-spacing:2px;font-size:19px;
  text-shadow:0 0 12px rgba(189,147,249,.55);white-space:nowrap}
.logo span{color:var(--acc)}
.topstats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:4px 10px;font-size:12px;letter-spacing:.5px;white-space:nowrap}
.chip.gold{color:var(--gold);border-color:#5a4a1e}
.chip.soul{color:var(--soul);border-color:#1e5a4c}
.chip.soul .gain{color:#b6ffe8;font-weight:700}
.chip.soul .csub{color:var(--muted);font-size:11px}
.chip.soul.pulse{animation:soulpop .5s ease-out}
@keyframes soulpop{0%{transform:scale(1)}35%{transform:scale(1.16);
  box-shadow:0 0 14px var(--soul)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.chip.soul.pulse{animation:none}}
.chip.zone{color:var(--acc2);border-color:#1e4a5a}

/* ---------- Layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.85fr);gap:14px;align-items:start}
/* Ohne min-width:0 dehnt ein breites Kind (die Chronik) die ganze Rasterspalte */
.grid>*{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

.panel{background:linear-gradient(180deg,var(--panel) 0%,#1a172a 100%);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.ptitle{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);
  font-size:11px;letter-spacing:2px}

/* ---------- Canvas / CRT ---------- */
.screen{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:#05040a;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 4px #100e1c inset}
.crt{position:relative;line-height:0}
#game{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  filter:drop-shadow(1.2px 0 0 rgba(255,0,64,.28)) drop-shadow(-1.2px 0 0 rgba(0,220,255,.24)) saturate(1.08)}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.26) 0 1px,rgba(0,0,0,0) 1px 4px);
  mix-blend-mode:multiply;opacity:.75}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 88%,rgba(0,0,0,.85) 100%);
  box-shadow:inset 0 0 60px rgba(120,80,255,.10)}
/* Ultimate-Knopf unten rechts im Bild: füllt sich beim Aufladen, pulsiert wenn bereit */
.ultbtn{position:absolute;right:12px;bottom:12px;z-index:7;width:58px;height:58px;border-radius:50%;
  border:2px solid var(--uc,#bd93f9);background:#0e0c17;padding:0;overflow:hidden;color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.ultbtn.on{display:flex}
.ultbtn .ucd{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--uc,#bd93f9) calc(var(--p,0)*1%),rgba(255,255,255,.04) 0);opacity:.55}
.ultbtn .uico{position:relative;font-size:26px;line-height:1;text-shadow:0 0 8px var(--uc)}
.ultbtn .ukey{position:absolute;bottom:3px;right:13px;font-size:9px;color:var(--muted)}
.ultbtn .utime{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.ultbtn.ready{animation:ultready 1.1s ease-in-out infinite}
.ultbtn.ready .ucd{opacity:.9}
.ultbtn.wait{filter:saturate(.55)}
@keyframes ultready{50%{box-shadow:0 0 22px var(--uc),0 0 6px var(--uc) inset;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ultbtn.ready{animation:none}}
@media (max-width:640px){.ultbtn{width:50px;height:50px;right:8px;bottom:8px}.ultbtn .uico{font-size:22px}}
/* Ultimate-Karte im Fertigkeiten-Tab */
.ultcard{border:1px solid var(--uc);border-radius:14px;padding:11px 12px;margin-bottom:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.15)),#1b1829;
  box-shadow:0 0 18px color-mix(in srgb,var(--uc) 25%,transparent)}
.ultcard .uhd{display:flex;gap:10px;align-items:center}
.ultcard .ubig{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:24px;border:2px solid var(--uc);text-shadow:0 0 8px var(--uc);flex:0 0 auto;background:#0e0c17}
.ultcard .uhd b{display:block;font-size:15px;color:var(--uc)}
.ultcard .uhd small{color:var(--muted)}
.ultcard .udesc{margin:8px 0 6px;font-size:12.5px}
.ultcard .uline{font-size:12px;color:var(--acc2);padding:1px 0}
.ultcard .unext{font-size:12px;color:var(--good);padding:1px 0}
.ultcard .utier{display:flex;gap:5px;align-items:center;margin:8px 0 2px;font-size:11px;color:var(--muted)}
.ultcard .utier i{width:18px;height:6px;border-radius:3px;background:#2c2840;display:inline-block}
.ultcard .utier i.on{background:var(--uc);box-shadow:0 0 6px var(--uc)}
.upaths{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
@media (max-width:480px){.upaths{grid-template-columns:1fr}}
.upath{border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:#15131f;font-size:12px}
.upath b{color:var(--pc)}.upath.sel{border-color:var(--pc);box-shadow:0 0 12px color-mix(in srgb,var(--pc) 40%,transparent)}
.upath p{margin:4px 0 7px;color:var(--text)}
.flicker{position:absolute;inset:0;z-index:5;pointer-events:none;background:rgba(190,160,255,.05);
  animation:flick 5.5s steps(2) infinite;mix-blend-mode:screen}
@keyframes flick{0%,96%{opacity:0}97%{opacity:.5}98%{opacity:.1}99%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flicker{animation:none}}

/* ---------- Bars ---------- */
.bars{display:grid;gap:6px;margin-top:10px}
.bar{position:relative;height:20px;background:#100e1c;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0%;display:block;transition:width .18s ease-out}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:400;letter-spacing:1px;text-shadow:0 1px 2px #000;z-index:2}
.bar.hp i{background:linear-gradient(180deg,#ff7a86,#d32a3c)}
.bar.xp i{background:linear-gradient(180deg,#d3b0ff,#7d4fd6)}
.bar.xp.full{box-shadow:0 0 14px var(--acc),0 0 3px var(--acc) inset;border-color:var(--acc)}
.bar.small{height:14px}.bar.small b{font-size:10px}

/* ---------- Log ---------- */
.log{height:168px;overflow-y:auto;padding:8px 12px;font-size:12.5px}
.log div{padding:1px 0;border-bottom:1px dotted rgba(255,255,255,.045)}
.log .t{color:var(--dim);margin-right:6px}
.c-dmg{color:#ff9f9f}.c-crit{color:#ffd166;font-weight:700}.c-heal{color:var(--good)}
.c-loot{color:var(--acc2)}.c-lvl{color:var(--acc)}.c-bad{color:var(--bad)}
.c-gold{color:var(--gold)}.c-sys{color:var(--muted)}.c-boss{color:#ff7ad9}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{position:relative;flex:1;min-width:0;background:transparent;border:1px solid transparent;
  border-radius:9px;padding:9px 4px;color:var(--muted);
  transition:background .18s,color .18s,border-color .18s;display:flex;align-items:center;justify-content:center}
.tabico{width:19px;height:19px;font-size:17px;line-height:1;display:block}
svg.tabico{fill:currentColor}
body.nofa i.tabico{display:none}
body:not(.nofa) svg.tabico{display:none}
.tabs .badge{position:absolute;top:2px;right:4px;min-width:15px;height:15px;line-height:15px;
  border-radius:8px;background:var(--acc2);color:#0e1a20;font-size:10px;font-weight:700;text-align:center;
  padding:0 3px;box-shadow:0 0 7px rgba(139,233,253,.6)}
.tabs button.active .badge{background:#14121f;color:var(--acc2)}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.active{color:#14121f;background:linear-gradient(180deg,#d3b0ff,var(--acc));border-color:#d3b0ff;font-weight:700}
.tabs button.alert:not(.active){color:var(--acc2);border-color:var(--acc2);box-shadow:0 0 10px rgba(139,233,253,.35)}
.tabbody{position:relative;min-height:430px;max-height:min(72vh,660px);overflow-y:auto;
  overflow-x:hidden;padding:12px;min-width:0}
/* Handy und schmale Fenster (eine Spalte): keine eigenen Scrollbereiche mehr in der
   Seite — Tab-Inhalt und Protokoll fließen in die Seite, gescrollt wird nur noch sie.
   Die Tab-Leiste bleibt oben angeheftet, damit man jederzeit wechseln kann. */
@media (max-width:900px){
  .tabbody{max-height:none;overflow:visible;min-height:0}
  aside.panel>.tabs{position:sticky;top:0;z-index:20;background:#1e1b2e;border-radius:14px 14px 0 0;
    box-shadow:0 6px 14px rgba(0,0,0,.35)}
  .log{height:auto;max-height:136px;overflow:hidden}
  .log.full{max-height:none}
  .logtoggle{display:inline}
}
.logtoggle{display:none;float:right;color:var(--acc2);letter-spacing:0;text-transform:none}
/* Fenster und Overlays scrollen für sich, ohne die Seite dahinter mitzuziehen */
.sheet,.card{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card{max-height:calc(100dvh - 32px)}
body.modal{overflow:hidden}
.path{touch-action:pan-x pan-y}
.tab{display:none;opacity:0;transform:translateY(6px);transition:opacity .22s,transform .22s}
.tab.active{display:block}
.tab.shown{opacity:1;transform:none}

.h3{font-size:11px;letter-spacing:2px;color:var(--muted);margin:14px 0 7px}
.h3:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted rgba(255,255,255,.05)}
.row b{font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;color:var(--acc2)}

/* ---------- Item Cells ---------- */
.paperdoll{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.cell{position:relative;aspect-ratio:1;border-radius:10px;background:#15131f;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;user-select:none}
.cell:hover{transform:translateY(-2px)}
.cell .slotname{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:8.5px;color:var(--dim);letter-spacing:.5px}
.cell.empty{background:#131120;border-style:dashed;border-color:#332e4a}
/* Freie Plätze zeigen ein reines Symbol — nie das Bild eines Gegenstands,
   damit nichts vorgetäuscht wird, das noch gar nicht angelegt ist. */
.slotico{display:block;margin:auto;color:#494263;font-size:19px;line-height:1;
  width:22px;height:22px}
svg.slotico{fill:#494263}
i.slotico{display:flex;align-items:center;justify-content:center}
body.nofa i.slotico{display:none}
body:not(.nofa) svg.slotico{display:none}
.cell.empty .slotname{color:#4c4568}
.cell.empty:hover{border-color:var(--line)}
.cell.empty:hover .slotico{color:#6b6390}
.cell.empty:hover svg.slotico{fill:#6b6390}
.cell.r0{border-color:#4a4760;box-shadow:0 0 0 1px #2a2740 inset}
.cell.r1{border-color:#3f6ea8;box-shadow:0 0 10px rgba(90,169,255,.28)}
.cell.r2{border-color:#8f8437;box-shadow:0 0 10px rgba(242,224,106,.28)}
.cell.r3{border-color:#a55f1c;box-shadow:0 0 14px rgba(255,154,60,.42)}
.cell .upnum{position:absolute;bottom:1px;left:4px;font-size:9px;font-weight:700;
  color:var(--gold);text-shadow:0 0 4px rgba(0,0,0,.9)}
/* Sockel: echte Punkte, freie leuchten türkis, belegte in der Farbe des Steins */
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin:0 1px;
  border:1.5px solid var(--acc2);background:rgba(10,8,18,.85);box-shadow:0 0 4px rgba(139,233,253,.6)}
.sdot.f{border-color:rgba(255,255,255,.85);box-shadow:0 0 5px rgba(255,255,255,.35)}
.cell .sock{position:absolute;top:3px;right:3px;display:grid;grid-auto-flow:column;
  grid-template-rows:repeat(3,9px);gap:2px;line-height:0;direction:rtl;
  padding:2px;border-radius:7px;background:rgba(10,8,18,.55)}
.cell .sock .sdot{width:9px;height:9px;margin:0}
.cell .sock.open .sdot:not(.f){animation:sockglow 1.6s ease-in-out infinite}
@keyframes sockglow{50%{box-shadow:0 0 8px var(--acc2);background:rgba(139,233,253,.25)}}
@media (prefers-reduced-motion:reduce){.cell .sock.open .sdot{animation:none}}
.socklist{margin:6px 0;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:#15131f;font-size:12px}
.socklist .sockhd{color:var(--acc2);margin-bottom:4px}
.sockrow{display:flex;gap:7px;align-items:flex-start;padding:2px 0}
.sockrow .sdot{margin-top:3px;flex:0 0 auto}
.sok{color:var(--good)}.sno{color:var(--dim)}
.cell.socketing{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 16px var(--acc2)}}
.gemrow{display:flex;gap:7px;flex-wrap:wrap}
.gem{width:44px;height:44px;border-radius:10px;background:#15131f;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;position:relative}
.gem span{position:absolute;bottom:-2px;right:2px;font-size:9px;color:var(--muted)}
.gem.sel{border-color:var(--acc2);box-shadow:0 0 12px var(--acc2)}

/* ---------- Detailfenster (mobil als Bottom-Sheet) ---------- */
.sheetwrap{position:fixed;inset:0;z-index:880;display:none;
  background:rgba(6,5,12,.72);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;padding:16px}
.sheetwrap.on{display:flex}
.sheet{width:min(460px,100%);max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#282343,#191627);border:1px solid var(--line);
  border-radius:16px;padding:15px 16px 16px;box-shadow:0 24px 70px rgba(0,0,0,.8)}
.sheet .close{position:sticky;top:-15px;float:right;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;width:30px;height:30px;line-height:1;font-size:16px;color:var(--muted);margin:-4px -4px 0 0}
@media (max-width:640px){
  .sheetwrap{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:18px 18px 0 0;padding-bottom:26px}
}
/* ---------- Detail- und Vergleichsansicht ---------- */
.detail{background:linear-gradient(180deg,#282343,#1d1a2e);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.detail .dname{font-size:15px;font-weight:700;line-height:1.25}
.detail .dsub{color:var(--muted);font-size:11px;margin-bottom:8px}
.cmpgrid{display:grid;grid-template-columns:1fr 74px 62px;gap:1px 6px;font-size:12px;align-items:baseline}
.cmpgrid .hd{color:var(--muted);font-size:10px;letter-spacing:1px;padding-bottom:3px;
  border-bottom:1px solid var(--line);margin-bottom:3px}
.cmpgrid .vn{text-align:right;color:var(--text)}
.cmpgrid .ve{text-align:right;color:var(--dim)}
.cmpgrid .vn small{font-size:10px}
.cmpgrid .sep{grid-column:1/-1;border-top:1px dotted rgba(255,255,255,.07);margin:4px 0}
.cmpgrid .vn.up{color:var(--good)}.cmpgrid .vn.dn{color:var(--bad)}
.verdict{margin-top:9px;padding:7px 9px;border-radius:9px;font-size:12px;text-align:center}
.verdict.good{background:rgba(92,224,138,.13);color:var(--good);border:1px solid rgba(92,224,138,.35)}
.verdict.bad{background:rgba(255,107,107,.10);color:var(--bad);border:1px solid rgba(255,107,107,.3)}
.verdict.neutral{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.effline{color:var(--r-1);font-size:12px}
.effnext{color:var(--good);font-size:12px}
.cell img.ico,.cell span.ico{width:74%;height:74%;display:block;margin:auto;
  image-rendering:pixelated;font-size:20px;line-height:1.5;text-align:center}
.gem img.ico{width:78%;height:78%;image-rendering:pixelated}
.offer .ic img.ico{width:88%;height:88%;image-rendering:pixelated}
.detail-art{width:52px;height:52px;image-rendering:pixelated;float:right;margin:-2px 0 6px 8px}
.cell .better{position:absolute;top:1px;left:4px;font-size:10px;color:var(--good);text-shadow:0 0 5px var(--good)}
.cell .newdot{position:absolute;bottom:3px;right:4px;width:6px;height:6px;border-radius:50%;
  background:var(--acc2);box-shadow:0 0 7px var(--acc2)}
.cell.picked{border-color:var(--acc)!important;box-shadow:0 0 0 2px var(--acc) inset,0 0 14px rgba(189,147,249,.5)!important}
.node.picked{outline:2px solid var(--acc2);outline-offset:2px}
.cell.consecrated{border-color:#ffd166!important;box-shadow:0 0 0 2px #ffd166 inset,0 0 18px rgba(255,209,102,.6)!important}
.cell .holy{position:absolute;top:1px;left:4px;font-size:11px;color:#ffd166;text-shadow:0 0 6px #ffb02e}
.consec{background:linear-gradient(180deg,#2a2236,#1b1726);border:1px solid #5a4a1e;border-radius:12px;
  padding:10px 12px;margin-top:8px}
.consec .ctitle{color:#ffd166;font-weight:700;letter-spacing:1px}
.consec .ceff{color:var(--acc2);font-size:12px;margin-top:6px}
.consec.done{border-color:#ffd166;box-shadow:0 0 18px rgba(255,209,102,.35)}
.branchhead{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:112px}
.branchhead b{font-size:12px;color:var(--acc)}
.branchhead small{display:block;color:var(--dim);font-size:9.5px;line-height:1.25}
.audiorow{display:flex;align-items:center;gap:10px;padding:6px 0}
.audiorow span{flex:0 0 128px;color:var(--muted);font-size:12.5px}
.audiorow input[type=range]{flex:1;accent-color:var(--acc);height:18px}
.audiorow b{min-width:38px;text-align:right;font-size:12px}
.toggle{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);

.toggle .sw{width:30px;height:16px;border-radius:9px;background:#15131f;border:1px solid var(--line);

.toggle.on .sw{background:rgba(189,147,249,.3);border-color:var(--acc)}

/* ---------- Tooltip ---------- */
#tooltip{position:fixed;z-index:900;max-width:280px;pointer-events:none;opacity:0;
  background:rgba(14,12,23,.97);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  box-shadow:0 16px 40px rgba(0,0,0,.7);font-size:12px;transition:opacity .1s}
#tooltip.on{opacity:1}
#tooltip .tname{font-size:13.5px;font-weight:700;margin-bottom:2px}
#tooltip .ttype{color:var(--muted);font-size:11px;margin-bottom:6px}
#tooltip .stat{color:var(--r-1)}
#tooltip .big{color:var(--text);font-size:13px}
#tooltip .uniq{color:var(--r-3);margin-top:5px;font-style:italic}
#tooltip hr{border:0;border-top:1px dotted var(--line);margin:7px 0}
#tooltip .cmp{color:var(--muted);font-size:11px}
.up{color:var(--good)}.dn{color:var(--bad)}

.attrrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted rgba(255,255,255,.06)}
.attrrow .nm{flex:1}
.attrrow .vl{font-weight:700;min-width:34px;text-align:right}
.attrrow .pl{width:28px;height:26px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);font-weight:700;line-height:1}
.attrrow .pl:hover:not(:disabled){background:var(--acc);color:#14121f;border-color:var(--acc)}
.reqbad{color:var(--bad)}
.reqok{color:var(--muted)}
.shotwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.6);margin-bottom:4px;line-height:0}
.shotwrap #shotBox canvas{width:100%;height:auto;display:block;image-rendering:pixelated;
  filter:grayscale(.35) contrast(1.05) brightness(.88)}
.shotwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 45%,rgba(90,0,10,.45) 100%),
             repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 4px)}
.killrow{display:flex;gap:12px;align-items:center;margin:10px 0 4px;padding:10px 12px;

  background:rgba(255,90,110,.10);border:1px solid rgba(255,90,110,.35)}
.causebox b{color:#ff9aa6;font-size:15px}
.causebox small{display:block;color:var(--muted);margin-top:2px}
.preview{display:flex;gap:12px;align-items:center;background:#12101c;border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:10px}
.preview canvas{width:104px;height:130px;image-rendering:pixelated;border-radius:9px;
  background:linear-gradient(180deg,#221d38,#171327);border:1px solid var(--line);flex:0 0 auto}
.preview .pinfo{min-width:0}
.preview .pinfo b{display:block;font-size:14px}
.preview .pinfo small{color:var(--muted);display:block;line-height:1.4;margin-top:3px}
.jsonbox{width:100%;height:150px;background:#12101c;border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:inherit;font-size:11px;padding:8px;resize:vertical}
/* ---------- Buttons ---------- */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--panel3);border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.p{background:linear-gradient(180deg,#d3b0ff,var(--acc));color:#14121f;border-color:#d3b0ff;font-weight:700}
.btn.p:hover{filter:brightness(1.1)}
.btn.s{background:linear-gradient(180deg,#9df3dc,#3fbfa0);color:#0e1a17;border-color:#9df3dc;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btnrow{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- Skilltree ---------- */
.tree{position:relative;margin-top:10px}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:76px;height:56px;transform:translate(-50%,-50%);
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:10px;text-align:center;padding:3px;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .1s}
.node:hover{transform:translate(-50%,-50%) scale(1.06)}
.node .ico{font-size:16px;line-height:1}
.node .rk{color:var(--muted);font-size:9.5px}

.node.taken{border-color:var(--acc);background:linear-gradient(180deg,#3b2f5c,#2a2340);box-shadow:0 0 14px rgba(189,147,249,.4)}

.shop{display:grid;gap:7px}
.offer{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:7px 9px}
.offer .ic{width:34px;height:34px;border-radius:8px;background:#15131f;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex:0 0 auto}
.offer .meta{flex:1;min-width:0}
.offer .meta div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer.stack{flex-wrap:wrap}
.offer.stack .meta{flex:1 1 170px}
.offer.stack .meta div:first-child{white-space:normal}
.offer.stack .acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.offer.stack .acts .btn{padding:7px 10px}
.offer small{color:var(--muted)}
.upg{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:7px}

.upg small{color:var(--muted);display:block;margin:2px 0 6px}
.pips{display:flex;gap:3px;margin-bottom:6px}
.pip{width:14px;height:6px;border-radius:3px;background:#2a2740}
.pip.on{background:var(--soul);box-shadow:0 0 7px var(--soul)}

/* ---------- Weg-Strahl: Chronik der gefallenen Helden ---------- */
.path{position:relative;max-width:100%;margin:16px 0 8px;padding:66px 10px 62px;

  overflow-x:auto;overflow-y:hidden}
.pathinner{position:relative;min-width:100%;height:26px}
.ray{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,#3a3455 0%,#5b4a8a 60%,#bd93f9 100%)}
.ray .glow{position:absolute;inset:0;border-radius:2px;box-shadow:0 0 12px rgba(189,147,249,.5)}
.tick{position:absolute;top:6px;width:1px;height:14px;background:rgba(255,255,255,.14);transform:translateX(-50%)}
.ticklb{position:absolute;top:24px;font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;letter-spacing:.3px}
.grave{position:absolute;top:2px;transform:translateX(-50%);text-align:center;cursor:default}
.grave .pin{font-size:14px;line-height:1;filter:drop-shadow(0 0 4px rgba(0,0,0,.8))}
.grave .lb{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:9px;color:var(--muted);margin-top:1px}
.grave.up .lb{bottom:22px}
.grave.down .lb{top:20px}
.grave.now .pin{font-size:18px;color:var(--acc);animation:bob 1.6s ease-in-out infinite}
.grave.now .lb{color:var(--acc);font-weight:700}
.grave.best .pin{color:var(--gold)}
.grave.best .lb{color:var(--gold)}
/* Besiegte Weltenbosse bekommen ein eigenes Band oberhalb des Strahls */
.bossmark{position:absolute;top:-30px;transform:translateX(-50%);text-align:center;cursor:default}
.bossmark .pin{font-size:15px;line-height:1;color:#ff7ad9;
  filter:drop-shadow(0 0 5px rgba(255,122,217,.65))}
.bossmark .lb{display:block;font-size:9px;color:#c98ec0;white-space:nowrap;margin-top:1px}
.bossmark .stem{position:absolute;left:50%;top:17px;width:1px;height:16px;
  background:linear-gradient(180deg,rgba(255,122,217,.7),rgba(255,122,217,0))}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.grave.now .pin{animation:none}}
.pathlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);margin-top:4px}
.mountbox{display:flex;gap:11px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:10px}
.mountbox canvas{width:66px;height:48px;flex:0 0 auto;image-rendering:pixelated;border-radius:9px;
  background:linear-gradient(180deg,#241f38,#171226);border:1px solid var(--line)}
.mountbox .mbody{flex:1;min-width:0}
.mountbox .mbody b{display:block;font-size:13.5px}
.mountbox .mbody small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:2px}
/* ---------- Ahnengalerie ---------- */
.ahn{display:flex;gap:11px;background:linear-gradient(180deg,#242038,#1a172a);
  border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px}
.ahn.lit{border-color:var(--acc);box-shadow:0 0 16px rgba(189,147,249,.28)}
.ahn canvas{width:72px;height:90px;flex:0 0 auto;image-rendering:pixelated;border-radius:10px;
  background:linear-gradient(180deg,#221d38,#141122);border:1px solid var(--line)}
.ahn .abody{flex:1;min-width:0}
.ahn .anm{font-weight:700;font-size:13.5px;line-height:1.2}
.ahn .asub{color:var(--muted);font-size:11px;margin:2px 0 6px}
.ahn .astats{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:3px 8px;
  font-size:11px;color:var(--muted);margin-bottom:7px}
.ahn .astats b{color:var(--text);font-weight:700}
.ahn .relic{display:flex;align-items:center;gap:8px;background:#15131f;border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;font-size:11.5px}
.ahn .relic img{width:26px;height:26px;image-rendering:pixelated;flex:0 0 auto}
.ahn .relic{flex-wrap:wrap}
.ahn .relic .rtxt{flex:1 1 120px;min-width:0}
.ahn .releff{font-size:11.5px;color:var(--acc2);margin:5px 2px 0;line-height:1.45}
.ahn .releff.off{color:var(--dim)}
.ahn .relic .rtxt div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahnhead{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:11px}
.ahnhead .cnt{font-size:13px}
.ahnhead .cnt b{color:var(--acc)}
/* ---------- Overlay ---------- */
.overlay{position:fixed;inset:0;z-index:800;display:none;place-items:center;padding:16px;
  background:radial-gradient(circle at 50% 40%,rgba(40,26,70,.75),rgba(6,5,12,.96));backdrop-filter:blur(4px)}
.overlay.on{display:grid}
.card{width:min(760px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#221e35,#15121f);
  border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.title{font-size:clamp(26px,6vw,46px);letter-spacing:5px;font-weight:700;text-align:center;
  color:#f3ecff;text-shadow:0 0 18px rgba(189,147,249,.8),0 4px 0 #4a2f7a;margin:6px 0 2px}
.subtitle{text-align:center;color:var(--acc2);letter-spacing:4px;font-size:12px;margin-bottom:20px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;
  cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;text-align:left}
.choice:hover{transform:translateY(-2px)}
.choice.sel{border-color:var(--acc);box-shadow:0 0 16px rgba(189,147,249,.4);background:#2f2749}
.choice b{display:block;margin-bottom:3px}
.choice small{color:var(--muted);display:block;font-size:11px;line-height:1.4}
input[type=text]{width:100%;background:#12101c;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;color:var(--text);font-family:inherit;font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--acc);box-shadow:0 0 12px rgba(189,147,249,.3)}
.deathstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.deathstat div{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}
.deathstat b{display:block;font-size:19px;color:var(--acc)}
.deathstat small{color:var(--muted);font-size:10.5px;letter-spacing:1px}
.hint{color:var(--dim);font-size:11px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:950;
  background:rgba(20,17,32,.96);border:1px solid var(--acc);border-radius:11px;padding:9px 16px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>

<script>
"use strict";
/* ============================================================================
   0. UTILITIES
   ========================================================================== */
const $=id=>document.getElementById(id);
/* Touchgeräte kennen kein echtes Hover — dort ersetzen Detailfenster die Tooltips */
const HOVER=!!(window.matchMedia&&window.matchMedia("(hover: hover)").matches);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hsl=(h,s,l)=>"hsl("+((h%360)+360)%360+","+s+"%,"+l+"%)";
/** Farbton als #rrggbb — für Effekte, die Transparenz über hexA brauchen */
function hueHex(h,s,l){
  h=((h%360)+360)%360;s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return "#"+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,"0")).join("");
}
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?(n/1e3).toFixed(1)+"k":Math.floor(n);
function lerpCol(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
const rgb=c=>"rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
/** #rrggbb + Deckkraft -> rgba(); für Tönungen in Segensfarben */
function hexA(hex,a){
  const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||"");
  if(!m)return "rgba(255,255,255,"+a+")";
  return "rgba("+parseInt(m[1],16)+","+parseInt(m[2],16)+","+parseInt(m[3],16)+","+a+")";
}
/** Quadratischer Schwierigkeitsanteil, der erst ab Stufe `off` einsetzt */
const QS=(lvl,off)=>{const v=Math.max(0,lvl-off);return v*v;};

/* Persistenter Speicher: nutzt die Artifact-Storage-API, fällt sonst auf RAM zurück */
/* Speicher-Kette: zuerst der Browser-Cache (localStorage), sonst die Artifact-API,
   im Notfall nur im Arbeitsspeicher. So läuft der Spielstand lokal wie online. */
const Store={
  mem:{},
  ls(){try{const t="__ad";localStorage.setItem(t,"1");localStorage.removeItem(t);return localStorage;}
       catch(e){return null;}},
  async get(k){
    const L=this.ls();
    if(L){const v=L.getItem("autodungeon:"+k);if(v!==null){try{return JSON.parse(v);}catch(e){}}}
    try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value);}catch(e){}
    return this.mem[k]!==undefined?this.mem[k]:null;
  },
  async set(k,v){
    this.mem[k]=v;
    const j=JSON.stringify(v);
    const L=this.ls();
    if(L){try{L.setItem("autodungeon:"+k,j);}catch(e){}}
    try{await window.storage.set(k,j);}catch(e){}
  },
  async del(k){
    delete this.mem[k];
    const L=this.ls();
    if(L){try{L.removeItem("autodungeon:"+k);}catch(e){}}
    try{await window.storage.delete(k);}catch(e){}
  }
};

/* ============================================================================
   1. AUDIO — 8-Bit Synth über die Web Audio API
   ========================================================================== */
class AudioEngine{
  constructor(){this.ctx=null;this.on=true;this.vol=.28;}
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){this.on=false;}}
    if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();}
  /** Grundbaustein: ein Oszillator mit Frequenz-Rampe und Hüllkurve */
  tone(f1,f2,dur,type,gain,delay){
    if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"square";o.frequency.setValueAtTime(f1,t);
    if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime((gain||1)*this.vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }
  /** Gefiltertes Rauschen — für Treffer, Explosionen, Regen */
  noise(dur,freq,gain,q){
    if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;
    const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);

/* ============================================================================
   1b. MUSIC — sechs eigens komponierte, lizenzfreie Hintergrundstücke
   ----------------------------------------------------------------------------
   Statt fertige MIDI-Dateien einzubinden (die Umgebung hat keinen Netzwerk-
   zugriff auf Musikarchive und jede eingebettete Fremddatei bräuchte eine
   Lizenzprüfung), komponiert das Spiel sechs eigene Loops als Notendaten und
   spielt sie über die Web Audio API — dieselbe Technik, mit der ein MIDI-
   Sequencer Töne auslöst, nur ohne Bindung an eine externe Datei oder
   Lizenz. Jedes Stück ist vollständig selbst geschrieben und frei nutzbar.
   ========================================================================== */
const NOTE_BASE={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
/** "A4" -> Frequenz in Hz; "." oder leer -> Pause (null) */
function noteFreq(tok){
  if(!tok||tok===".")return null;
  const m=/^([A-G]#?)(-?\d)$/.exec(tok);
  if(!m)return null;
  const semis=NOTE_BASE[m[1]]+(parseInt(m[2],10)+1)*12;
  return 440*Math.pow(2,(semis-69)/12);
}
/** Zerlegt eine mit Leerzeichen getrennte Notenfolge in Frequenzen */
function parsePattern(str){return str.trim().split(/\s+/).map(noteFreq);}

/* Sechs Stücke, je mit Bass, Begleitung und Melodie. bpm bestimmt das Tempo,

const MUSIC_DIR="music/";
/* Endungen in der Reihenfolge, in der sie probiert werden. Scheitert eine,
   nimmt der Lader die nächste; erst wenn keine trägt, springt der eingebaute
   Synthesizer ein. So laufen sowohl MP3- als auch OGG-Sammlungen. */
const MUSIC_EXT=[".mp3",".ogg",".m4a"];
class MusicEngine{
  constructor(){
    this.ctx=null;this.on=true;this.vol=.5;
    this.master=null;this.current=null;this.nextT=0;this.timer=null;this.gen=0;
    this.files={};       // Schlüssel -> HTMLAudioElement, sobald geladen
    this.state={};       // Schlüssel -> "laden" | "bereit" | "fehlt"
    this.playing=null;   // gerade laufendes Element
    this.fade=null;
  }
  /** Lädt die gerenderten Stücke aus dem music-Ordner vor */
  preload(){
    for(const k in TRACKS){
      if(this.state[k])continue;
      this.state[k]="laden";
      const a=new Audio();
      a.preload="auto";a.loop=true;a.volume=0;
      let ext=0;
      const tryNext=()=>{
        if(ext>=MUSIC_EXT.length){this.state[k]="fehlt";return;}
        a.src=MUSIC_DIR+k+MUSIC_EXT[ext++];
        try{a.load();}catch(e){tryNext();}
      };
      a.addEventListener("canplaythrough",()=>{
        this.state[k]="bereit";this.files[k]=a;
        if(this.current===k&&this.on)this.play(k,true);
      },{once:true});
      a.addEventListener("error",()=>{if(this.state[k]!=="bereit")tryNext();});
      tryNext();
    }
  }
  /** Weiches Überblenden zwischen zwei Dateien */
  crossfade(next){
    const prev=this.playing;
    if(prev===next)return;
    this.playing=next;
    if(next){next.currentTime=0;next.volume=0;const pr=next.play();if(pr&&pr.catch)pr.catch(()=>{});}
    if(this.fade)clearInterval(this.fade);
    const target=this.on?this.vol:0;
    let t=0;
    this.fade=setInterval(()=>{
      t+=.05;
      const k=clamp(t/.9,0,1);
      if(next)next.volume=target*k;
      if(prev)prev.volume=target*(1-k);
      if(k>=1){
        clearInterval(this.fade);this.fade=null;
        if(prev){prev.pause();prev.currentTime=0;}
      }
    },50);
  }
  init(){
    if(!this.ctx){
      try{
        this.ctx=new (window.AudioContext||window.webkitAudioContext)();
        this.master=this.ctx.createGain();this.master.gain.value=this.on?this.vol:0;
        this.master.connect(this.ctx.destination);
      }catch(e){this.on=false;return;}
    }
    if(this.ctx.state==="suspended")this.ctx.resume();
  }
  setVolume(v){
    this.vol=clamp(v,0,1);
    if(this.master&&this.ctx)this.master.gain.setTargetAtTime(this.on?this.vol:0,this.ctx.currentTime,.15);
    if(this.playing&&!this.fade)this.playing.volume=this.on?this.vol:0;
  }
  setOn(on){
    this.on=on;
    if(this.master&&this.ctx)this.master.gain.setTargetAtTime(on?this.vol:0,this.ctx.currentTime,.15);
    if(this.playing&&!this.fade)this.playing.volume=on?this.vol:0;
    if(!on){if(this.playing)this.playing.pause();this.stopSynth();}
    else if(this.current)this.play(this.current,true);
  }
  /** Läuft die Wiedergabe über die gerenderten Dateien oder über den Synthesizer? */
  mode(){
    const k=this.current;
    return (k&&this.state[k]==="bereit")?"datei":"synth";
  }
  /** Wechselt sanft zum angegebenen Stück; ruft man denselben Schlüssel erneut auf, passiert nichts */
  play(key,force){
    if(!TRACKS[key])return;
    if(this.current===key&&!force)return;
    this.current=key;
    if(!this.on)return;
    // Bevorzugt die gerenderte Aufnahme; nur wenn sie fehlt, spielt der Synthesizer
    if(this.state[key]==="bereit"){
      this.stopSynth();
      this.crossfade(this.files[key]);
      return;
    }
    if(this.state[key]==="laden")return;      // sobald sie da ist, startet sie von selbst
    if(this.playing){this.playing.pause();this.playing=null;}
    if(!this.ctx)this.init();
    if(!this.ctx)return;
    this.gen++;const myGen=this.gen;
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
    this.nextT=this.ctx.currentTime+.12;
    const loop=()=>{
      if(myGen!==this.gen)return;         // ein neueres Stück hat übernommen
      this.scheduleBar(TRACKS[key],this.nextT);
      const bars=2,stepDur=60/TRACKS[key].bpm/4,barDur=stepDur*32;
      this.nextT+=barDur;
      this.timer=setTimeout(loop,Math.max(50,(this.nextT-this.ctx.currentTime-.25)*1000));
    };
    loop();
  }
  /** Plant eine Taktschleife (32 Sechzehntel) für Bass, Begleitung und Melodie */
  scheduleBar(tr,t0){
    const c=this.ctx,stepDur=60/tr.bpm/4;
    const parts=[["bass",.5,.22],["mid",.24,.5],["lead",.34,.32]];
    for(const [key,gain,rel] of parts){
      const seq=parsePattern(tr[key]);
      for(let i=0;i<seq.length;i++){
        const f=seq[i];if(!f)continue;
        const t=t0+i*stepDur;
        const o=c.createOscillator(),g=c.createGain();
        o.type=tr.wave;o.frequency.value=f;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(gain*.16,t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+stepDur*rel*4);
        o.connect(g);g.connect(this.master);
        o.start(t);o.stop(t+stepDur*rel*4+.05);
      }
    }
  }
  stopSynth(){
    this.gen++;
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
  }
  stop(){
    this.stopSynth();this.current=null;
    if(this.fade){clearInterval(this.fade);this.fade=null;}
    if(this.playing){this.playing.pause();this.playing.currentTime=0;this.playing=null;}
  }
}

/** Wählt das passende Stück zur aktuellen Spielsituation.
    Kampfmusik gibt es nur für Minibosse und Weltenbosse — bei gewöhnlichen
    Gegnern läuft die Musik der Umgebung einfach weiter. `null` bedeutet
    ausdrücklich "nichts ändern". */
function pickTrack(){
  if(!G||!G.hero||G.state==="dead")return null;
  if(G.state==="fight"){
    const e=G.target?G.target():null;
    if(e&&e.boss)return"reckoning";      // Weltenboss
    if(e&&e.mini)return"steel";          // Miniboss
    return null;                          // gewöhnlicher Kampf: Musik bleibt
  }
  const b=G.biome;
  if(!b)return"wander";
  if(b.lava)return"ember";
  if(b.indoor)return"halls";
  if(b.k==="dorf"||b.k==="stadt")return"village";
  return"wander";
}
function updateMusic(){
  const k=pickTrack();
  if(k)MUSIC.play(k);
}

/* ----------------------------------------------------------------------------
   Detailverdopplung: EPX/Scale2x verdoppelt jede Matrix und rundet dabei
   Treppenkanten ab. Danach setzt ein Shading-Durchlauf Lichtkanten oben und
   Schattenkanten unten — das gibt den Figuren Volumen wie in 16-Bit-RPGs.
   -------------------------------------------------------------------------- */
function epx(rows){
  const h=rows.length,w=rows[0].length;
  const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?".":rows[y][x];
  const out=[];
  for(let y=0;y<h;y++){
    let r1="",r2="";
    for(let x=0;x<w;x++){
      const P=rows[y][x],A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),D=at(x,y+1);
      let e0=P,e1=P,e2=P,e3=P;
      if(C===A&&C!==D&&A!==B)e0=A;
      if(A===B&&A!==C&&B!==D)e1=B;
      if(D===C&&D!==B&&C!==A)e2=C;
      if(B===D&&B!==A&&D!==C)e3=D;
      r1+=e0+e1;r2+=e2+e3;
    }
    out.push(r1,r2);
  }
  return out;
}
/** Lichtkante oben, Schattenkante unten — nur auf Körperflächen, nicht auf Augen */
function shadeRows(rows){
  const h=rows.length,w=rows[0].length;
  const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?".":rows[y][x];
  const out=[];
  for(let y=0;y<h;y++){
    let r="";
    for(let x=0;x<w;x++){
      const p=rows[y][x];
      if(p==="2"||p==="4"){
        const up=at(x,y-1),dn=at(x,y+1),lf=at(x-1,y);
        const solid=ch=>ch>="1"&&ch<="7";
        if(!solid(up)||up==="1"){ r+=(p==="2"?"3":"2"); continue; }
        if(!solid(dn)||dn==="1"){ r+=(p==="2"?"4":"1"); continue; }
        if(!solid(lf)&&p==="2"){ r+="3"; continue; }
      }
      r+=p;
    }
    out.push(r);
  }
  return out;
}
/* Modelle vorbereiten: zweimal hochskalieren (16 -> 32 -> 64), nach jedem
   Durchgang schattieren, dann den Bodenkontakt bestimmen. */
const SPRITES={};
for(const k in MODELS){
  const rows=shadeRows(epx(shadeRows(epx(MODELS[k]))));
  const w=rows[0].length;
  let last=0;for(let y=0;y<rows.length;y++)if(/[1-7]/.test(rows[y]))last=y;
  SPRITES[k]={rows,w,h:rows.length,base:last+1,f:4,id:k};  // f = Pixel je Ursprungspixel
}
/** Achtstufige Palette: dunkle Kontur, kühler Schatten, warmes Licht, Metallton.
    Die Verschiebung von Farbton zwischen Licht und Schatten ist das, was Sprites
    der 16-Bit-Ära plastisch wirken lässt — reines Auf- und Abdunkeln wirkt flach. */
function palette(hue,sat,light){
  sat=sat===undefined?55:sat;light=light===undefined?0:light;
  const cl=v=>clamp(v,0,100);
  return [null,
    hsl(hue-6,cl(sat*.7),cl(8+light*.25)),      // 1 Kontur
    hsl(hue,cl(sat),cl(36+light)),              // 2 Hauptfarbe
    hsl(hue+14,cl(sat*.92),cl(57+light)),       // 3 warmes Licht
    hsl(hue-16,cl(sat*1.12),cl(20+light*.6)),   // 4 kühler Schatten
    "#f2eee0",                                  // 5 Knochen / Weiß
    hsl(hue+180,85,cl(62+light*.4)),            // 6 Glut / Augen
    hsl(hue+42,22,cl(66+light*.3))              // 7 Metall
  ];
}
/** Zeichnet eine Pixel-Matrix; `flash` färbt alle Pixel ein (Trefferblitz) */
/* Für jede der 64 Kombinationen aus Unterrasse und Klasse ein eigener
   Sprite-Eintrag. Ohne passende PNG-Datei greift der Klassenkörper plus die
   gezeichneten Rassenmerkmale — mit Datei wird nur diese verwendet. */
const HERO_SPRITES={};
function buildHeroSprites(){          // wird beim Start aufgerufen, sobald die Tabellen stehen
  for(const race in RACE_LOOKS){
    for(const look of RACE_LOOKS[race]){
      for(const cls in CLASSES){
        const src=SPRITES[CLASSES[cls].sp];
        const id="hero_"+look.key+"_"+cls;
        SPRITES[id]={rows:src.rows,w:src.w,h:src.h,base:src.base,f:src.f,id:id};
        HERO_SPRITES[look.key+"_"+cls]=id;
      }
    }
  }
}

   Dadurch bleiben die Farbbeziehungen innerhalb der Figur erhalten — glühende

/** Liefert den Namen der Grafik zu einem Gegenstand */
function artIdFor(it){
  if(!it)return null;
  if(it.isRune)return "rune_"+(1+(it.id%8));
  if(it.slot==="weapon"){
    if(it.wtype==="axe"&&/Hammer/.test(it.base||""))return "weapon_hammer";
    const map={sword:"weapon_sword",dagger:"weapon_dagger",axe:"weapon_axe",
               staff:"weapon_staff",bow:"weapon_bow"};
    return map[it.wtype]||"weapon_sword";
  }
  if(it.slot==="offhand")return /Kugel/.test(it.base||"")?"armor_orb":"armor_offhand";
  return "armor_"+it.slot;
}

    '<svg class="slotico" viewBox="0 0 24 24" aria-hidden="true">'+I.svg+'</svg>';
}
/** Prüft, ob Font Awesome geladen wurde; sonst übernimmt der SVG-Satz */
function checkFontAwesome(){
  const probe=document.createElement("i");
  probe.className="fa-solid fa-shirt";
  probe.style.cssText="position:absolute;left:-9999px;opacity:0";
  document.body.appendChild(probe);
  let ok=false;
  try{ok=/font\s*awesome/i.test(getComputedStyle(probe,"::before").fontFamily||"");}catch(e){}
  document.body.removeChild(probe);
  document.body.classList.toggle("nofa",!ok);

/** HTML für ein Symbol: eigene Grafik, sonst das Schriftzeichen */
function artImg(id,fallback,cls){
  if(ASSETS[id])return '<img class="ico'+(cls?" "+cls:"")+'" src="'+ASSET_DIR+id+'.png" alt="">';
  return '<span class="ico'+(cls?" "+cls:"")+'">'+fallback+'</span>';

function loadAssets(){
  for(const id of ITEM_ART_IDS){
    const img=new Image();
    img.onload=()=>{if(img.naturalWidth>0)ASSETS[id]=img;};
    img.onerror=()=>{ASSETS[id]=false;};
    img.src=ASSET_DIR+id+".png";
  }
  for(const id in SPRITES){
    const img=new Image();
    img.onload=()=>{if(img.naturalWidth>0){ASSETS[id]=img;for(const k in SPR_CACHE)delete SPR_CACHE[k];
      for(const k in AFFIX_CACHE)delete AFFIX_CACHE[k];}};
    img.onerror=()=>{ASSETS[id]=false;};
    img.src=ASSET_DIR+id+".png";
  }
}
/* Sprites werden einmal je Farbvariante in ein Offscreen-Canvas gerastert und
   danach nur noch als Bild kopiert — sonst kostet die vierfache Pixelzahl zu viel. */
const SPR_CACHE={};let SPR_KEYS=0;
function spriteBitmap(sp,pal,flash){
  const key=(sp.id||"?")+"|"+(sp._rot||0)+"|"+(flash||pal[2]+pal[4]+pal[6]);
  let cv=SPR_CACHE[key];
  if(cv)return cv;
  if(SPR_KEYS>240){for(const k in SPR_CACHE)delete SPR_CACHE[k];SPR_KEYS=0;}
  cv=document.createElement("canvas");
  cv.width=sp.w;cv.height=sp.h;
  const x=cv.getContext("2d");
  const art=ASSETS[sp.id];
  if(art){
    if(sp._rot&&CAN_FILTER){
      // Farbtondrehung: alle Farben der Zeichnung wandern um denselben Winkel
      x.filter="hue-rotate("+sp._rot+"deg) saturate("+TINT_SATURATE+")";
      x.drawImage(art,0,0,sp.w,sp.h);
      x.filter="none";
    }else if(sp._rot){
      // Ohne Filterunterstützung: Farbauftrag über den Kompositionsmodus
      x.drawImage(art,0,0,sp.w,sp.h);
      x.globalCompositeOperation="color";
      x.fillStyle=sp._tint;
      x.fillRect(0,0,sp.w,sp.h);
      x.globalCompositeOperation="destination-in";
      x.drawImage(art,0,0,sp.w,sp.h);
      x.globalCompositeOperation="source-over";
    }else{
      x.drawImage(art,0,0,sp.w,sp.h);
    }
    if(flash){x.globalCompositeOperation="source-atop";x.fillStyle=flash;x.fillRect(0,0,sp.w,sp.h);
      x.globalCompositeOperation="source-over";}
    SPR_CACHE[key]=cv;SPR_KEYS++;
    return cv;
  }
  for(let y=0;y<sp.h;y++){
    const row=sp.rows[y];
    for(let i=0;i<sp.w;i++){
      const c=row.charCodeAt(i)-48;
      if(c<1||c>7)continue;
      x.fillStyle=flash||pal[c];
      x.fillRect(i,y,1,1);
    }
  }
  SPR_CACHE[key]=cv;SPR_KEYS++;
  return cv;
}
/* Affix-Überlagerung auf die Silhouette einer Figur beschnitten (z.B. Glutrisse).
   Einmal je Figur gerastert und danach nur noch kopiert. */
const AFFIX_CACHE={};
function affixMask(id,sp,pal,hue){
  const art=ASSETS[id];if(!art||!sp)return null;
  const key=id+"|"+(sp.id||"?")+"|"+sp.w+"x"+sp.h;
  if(AFFIX_CACHE[key])return AFFIX_CACHE[key];
  const cv=document.createElement("canvas");cv.width=sp.w;cv.height=sp.h;
  const x=cv.getContext("2d");x.imageSmoothingEnabled=false;
  x.drawImage(art,0,0,sp.w,sp.h);
  x.globalCompositeOperation="destination-in";
  x.drawImage(spriteBitmap(sp,pal,null),0,0);
  return AFFIX_CACHE[key]=cv;
}
/** `scale` = logische Pixel je URSPRUNGS-Pixel; die Matrix ist doppelt so fein */
function drawSprite(ctx,sp,cx,groundY,scale,pal,flip,flash,alpha,hue){
  // Wie weit der Farbkreis gedreht wird — 0 lässt die Zeichnung unverändert
  if(hue===undefined||hue===null){sp._rot=0;sp._tint=null;}
  else{
    sp._rot=Math.round(((hue-ASSET_HUE)%360+540)%360-180);
    sp._tint=hsl(hue,TINT_SAT,TINT_LIGHT);      // nur für die Rückfallebene
  }
  const u=scale/(sp.f||1);
  const w=sp.w*u,hh=sp.h*u;
  const x0=Math.round((cx-w/2)*2)/2,y0=Math.round((groundY-sp.base*u)*2)/2;
  const bmp=spriteBitmap(sp,pal,flash);
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.imageSmoothingEnabled=false;
  if(flip){
    ctx.save();ctx.translate(x0+w,y0);ctx.scale(-1,1);
    ctx.drawImage(bmp,0,0,w,hh);ctx.restore();
  }else ctx.drawImage(bmp,x0,y0,w,hh);
  ctx.globalAlpha=1;
}

/* ============================================================================
   3. PARTIKEL & FLOATING COMBAT TEXT
   ========================================================================== */
class Particles{
  constructor(){this.p=[];}
  add(x,y,n,cfg){
    // Obergrenze: bei Effektgewittern lieber Partikel weglassen als Bilder verlieren
    if(this.p.length>1400)return;
    if(this.p.length>900)n=Math.ceil(n/3);
    for(let i=0;i<n;i++){
      const a=cfg.dir!==undefined?cfg.dir+rnd(-cfg.spread,cfg.spread):rnd(0,Math.PI*2);
      const s=rnd(cfg.spdMin,cfg.spdMax);
      this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:rnd(cfg.lifeMin,cfg.lifeMax),max:cfg.lifeMax,
        col:typeof cfg.col==="function"?cfg.col():cfg.col,
        size:cfg.size||2,g:cfg.g===undefined?300:cfg.g,fade:cfg.fade!==false,
        glow:cfg.glow,trail:cfg.trail});
    }
  }
  blood(x,y,dir){this.add(x,y,12,{dir,spread:1.1,spdMin:40,spdMax:170,lifeMin:.3,lifeMax:.75,
    col:()=>pick(["#c1121f","#e5383b","#8d0801","#ff4d6d"]),size:2,g:420});}
  sparks(x,y){this.add(x,y,14,{spread:Math.PI,dir:Math.PI,spdMin:60,spdMax:210,lifeMin:.18,lifeMax:.45,
    col:()=>pick(["#fff3b0","#ffd166","#ffffff","#8be9fd"]),size:2,g:260,glow:1});}
  confetti(x,y){this.add(x,y,50,{spdMin:50,spdMax:210,lifeMin:.7,lifeMax:1.5,
    col:()=>pick(["#bd93f9","#8be9fd","#50fa7b","#f1fa8c","#ff79c6","#ffffff"]),size:3,g:190,glow:1});}
  puff(x,y,col){this.add(x,y,10,{spdMin:10,spdMax:60,lifeMin:.3,lifeMax:.8,col:col,size:2,g:-30});}
  ring(x,y,col){this.add(x,y,22,{spdMin:110,spdMax:140,lifeMin:.25,lifeMax:.45,col:col,size:2,g:0,glow:1});}
  update(dt){
    for(let i=this.p.length-1;i>=0;i--){
      const p=this.p[i];p.life-=dt;
      if(p.life<=0){this.p.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.99;
    }
  }
  draw(ctx){
    for(const p of this.p){
      ctx.globalAlpha=p.fade?clamp(p.life/p.max,0,1):1;
      ctx.fillStyle=p.col;
      if(p.glow){ctx.shadowBlur=6;ctx.shadowColor=p.col;}
      ctx.fillRect(p.x|0,p.y|0,p.size,p.size);
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  }
}
class FloatTexts{
  constructor(){this.t=[];}
  add(x,y,txt,type){
    const cfg={dmg:{c:"#ffffff",s:8},crit:{c:"#ffd166",s:13},heal:{c:"#5ce08a",s:9},
      xp:{c:"#c39bff",s:8},gold:{c:"#ffc861",s:8},bad:{c:"#ff6b6b",s:9},
      loot:{c:"#8be9fd",s:8},block:{c:"#b6b2c9",s:8}}[type||"dmg"];
    this.t.push({x,y,txt,life:type==="crit"?1.2:.95,max:type==="crit"?1.2:.95,
      vy:type==="crit"?-46:-34,vx:rnd(-12,12),col:cfg.c,size:cfg.s,pop:type==="crit"?1:0});
  }
  update(dt){for(let i=this.t.length-1;i>=0;i--){const t=this.t[i];t.life-=dt;
    if(t.life<=0){this.t.splice(i,1);continue;}t.y+=t.vy*dt;t.x+=t.vx*dt;t.vy+=34*dt;}}
  draw(ctx){
    ctx.textAlign="center";
    for(const t of this.t){
      const k=t.life/t.max;
      const grow=t.pop?1+Math.max(0,(k-.82))*3.2:1;
      ctx.globalAlpha=clamp(k*1.4,0,1);
      ctx.font="700 "+Math.round(t.size*grow)+"px "+"'Courier New',monospace";
      ctx.fillStyle="#000";ctx.fillText(t.txt,(t.x|0)+1,(t.y|0)+1);
      ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x|0,t.y|0);
    }
    ctx.globalAlpha=1;ctx.textAlign="left";
  }
}

/* ----------------------------------------------------------------------------
   Zauber-Effekte: Geschosse, Kettenblitze, Wellen, Lichtsäulen, Explosionen.
   Geschosse tragen ihre Wirkung als Rückruf und lösen sie erst beim Einschlag
   aus — der Schaden kommt also genau dann, wenn man den Treffer sieht.
   -------------------------------------------------------------------------- */
class SpellFx{
  constructor(parts){this.f=[];this.parts=parts;}
  /** Geschoss von (x,y) zum Ziel; tgt ist ein Gegner oder {x,y} */
  shot(x,y,tgt,o){
    this.f.push(Object.assign({k:"shot",x,y,sx:x,sy:y,tgt,spd:300,r:4,col:"#ff7a2b",core:"#fff3b0",
      arc:0,t:0,trail:"fire"},o));
  }
  chain(points,col){this.f.push({k:"chain",pts:points,col,t:0,max:.45,seed:Math.random()*99});}
  nova(x,y,col,maxR){this.f.push({k:"nova",x,y,col,t:0,max:.55,maxR:maxR||300});}
  pillar(x,col){this.f.push({k:"pillar",x,col,t:0,max:.7});}
  flare(x,y,col,r,max){this.f.push({k:"flare",x,y,col,r:r||20,t:0,max:max||.32});}
  cloud(x,y,col,max){this.f.push({k:"cloud",x,y,col,t:0,max:max||3});}
  /* --- Gegnerangriffe --- */
  slash(x,y,col,dir,big){this.f.push({k:"slash",x,y,col,dir:dir||-1,t:0,max:.22,big:big||1});}
  claw(x,y,col){this.f.push({k:"claw",x,y,col,t:0,max:.3});}
  beam(x1,y1,x2,y2,col,max,w){this.f.push({k:"beam",x1,y1,x2,y2,col,t:0,max:max||.28,w:w||1});}
  tentacle(x,col,max){this.f.push({k:"tentacle",x,col,t:0,max:max||.7});}
  roots(x,col,max,pal,sz){this.f.push({k:"roots",x,col,t:0,max:max||.65,seed:Math.random()*9,pal:pal||["#4c7a2a","#6b4a2a"],sz:sz||1});}
  sword(x,col,max){this.f.push({k:"sword",x,col,t:0,max:max||1.1});}
  cross(col,max){this.f.push({k:"cross",col,t:0,max:max||.9});}
  /** Lebensraub-Kugel auf einer quadratischen Bézierbahn mit Ease-In-Out */
  orb(x0,y0,x1,y1,o){
    const mx=(x0+x1)/2,my=(y0+y1)/2,dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;                 // Senkrechte zur Flugrichtung
    this.f.push({k:"orb",x0,y0,x1,y1,cx:mx+nx*o.bend+o.lean,cy:my+ny*o.bend,
      t:-(o.delay||0),max:o.max||.6,r:o.r||2,onArrive:o.onArrive});
  }
  quake(x1,x2,col,dur,onHit){this.f.push({k:"quake",x1,x2,x:x1,col,t:0,max:dur,onHit});}
  wave(x1,x2,y,col,dur,onHit){this.f.push({k:"wave",x1,x2,x:x1,y,col,t:0,max:dur,onHit});}
  update(dt){
    for(let i=this.f.length-1;i>=0;i--){
      const f=this.f[i];f.t+=dt;
      if(f.k==="shot"){
        const tx=f.tgt.x,ty=f.tgt.y!==undefined?f.tgt.y:GROUND-(f.tgt.ph||30)*.55;
        const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);
        const step=f.spd*dt;
        // Schweif
        if(f.trail==="fire")this.parts.add(f.x,f.y,2,{spdMin:5,spdMax:30,lifeMin:.15,lifeMax:.4,
          col:()=>pick(["#ffd166","#ff7a2b","#ff4d1a","#fff3b0"]),size:2,g:-60,glow:1});
        else if(f.trail==="dark")this.parts.add(f.x,f.y,2,{spdMin:4,spdMax:20,lifeMin:.2,lifeMax:.45,
          col:()=>pick([f.col,"#3b1f5c","#e0c6ff"]),size:2,g:-20,glow:1});
        else if(f.trail==="blood")this.parts.add(f.x,f.y,1,{spdMin:2,spdMax:12,lifeMin:.12,lifeMax:.3,
          col:f.col,size:1,g:0,glow:1});
        else if(f.trail==="glow")this.parts.add(f.x,f.y,1,{spdMin:2,spdMax:14,lifeMin:.15,lifeMax:.35,
          col:f.col,size:2,g:0,glow:1});
        else if(f.trail==="thorn")this.parts.add(f.x,f.y,1,{spdMin:2,spdMax:10,lifeMin:.1,lifeMax:.22,
          col:"#a3d977",size:1,g:0});
        else if(f.trail==="meteor")this.parts.add(f.x,f.y,4,{spdMin:10,spdMax:50,lifeMin:.2,lifeMax:.6,
          col:()=>pick(["#ffd166","#ff7a2b","#ff3b1a","#6b3a1e","#fff3b0"]),size:3,g:-30,glow:1});
        if(d<=step||f.t>2){
          this.f.splice(i,1);
          if(f.onHit)f.onHit(tx,ty);
          continue;
        }
        f.x+=dx/d*step;f.y+=dy/d*step;
        // leichter Bogen, je nach Strecke
        if(f.arc){const k=1-d/Math.max(1,Math.hypot(tx-f.sx,ty-f.sy));f.y-=Math.sin(k*Math.PI)*f.arc*dt*6;}
      }else if(f.k==="quake"||f.k==="wave"){
        const k=clamp(f.t/f.max,0,1);
        f.x=lerp(f.x1,f.x2,k);
        if(f.k==="quake")this.parts.add(f.x+rnd(-6,6),GROUND-1,3,{dir:-Math.PI/2,spread:.7,
          spdMin:30,spdMax:90,lifeMin:.25,lifeMax:.55,col:pick([f.col,"#5b4a3a","#8a7a66"]),size:2,g:380});
        if(f.t>=f.max){this.f.splice(i,1);if(f.onHit)f.onHit(f.x2,GROUND-40);}
      }else if(f.k==="orb"){
        if(f.t>=f.max){this.f.splice(i,1);if(f.onArrive)f.onArrive();}
      }else if(f.k==="cloud"){
        if(Math.random()<.6)this.parts.add(f.x+rnd(-22,22),f.y+rnd(-14,10),1,{spdMin:2,spdMax:12,
          lifeMin:.5,lifeMax:1.1,col:pick([f.col,"#2f6b2a","#c6ff8a"]),size:3,g:-14});
        if(f.t>=f.max)this.f.splice(i,1);
      }else if(f.t>=f.max)this.f.splice(i,1);
    }
  }
  draw(c){
    for(const f of this.f){
      if(f.k==="shot"&&f.shape){
        // Geformte Geschosse zeigen in Flugrichtung
        const tx=f.tgt.x,ty=f.tgt.y!==undefined?f.tgt.y:GROUND-(f.tgt.ph||30)*.55;
        const ang=Math.atan2(ty-f.y,tx-f.x);
        c.save();c.translate(f.x,f.y);
        if(f.shape==="dagger")c.rotate(f.t*26);else c.rotate(ang);
        c.shadowBlur=4;c.shadowColor=f.col;
        if(f.shape==="arrow"){
          c.fillStyle="#6b4a2a";c.fillRect(-10,-.5,10,1.5);
          c.fillStyle=f.core;c.fillRect(0,-1.5,3,3);c.fillRect(3,-.5,1,1);
          c.fillStyle=f.col;c.fillRect(-11,-2,3,1);c.fillRect(-11,1,3,1);
        }else if(f.shape==="dagger"){
          c.fillStyle=f.core;c.fillRect(-1,-5,2,7);c.fillStyle=f.col;c.fillRect(-2.5,1,5,1.5);
          c.fillStyle="#3a2a22";c.fillRect(-1,2.5,2,3);
        }else if(f.shape==="shard"){
          c.fillStyle=f.col;c.beginPath();c.moveTo(6,0);c.lineTo(-4,-3);c.lineTo(-7,0);c.lineTo(-4,3);c.closePath();c.fill();
          c.fillStyle=f.core;c.fillRect(-2,-1,6,2);
        }else if(f.shape==="star"){
          c.rotate(f.t*12);c.fillStyle=f.col;
          for(let j=0;j<4;j++){c.rotate(Math.PI/2);c.fillRect(-1,-5,2,5);}
          c.fillStyle=f.core;c.fillRect(-1.5,-1.5,3,3);
        }else if(f.shape==="blade"){            // Ultimate: rotierende Klinge
          c.rotate(f.t*30);c.fillStyle=f.col;
          for(let j=0;j<3;j++){c.rotate(Math.PI*2/3);c.beginPath();c.moveTo(0,0);c.lineTo(9*f.r/4,-2);c.lineTo(7*f.r/4,3);c.fill();}
          c.fillStyle=f.core;c.fillRect(-1.5,-1.5,3,3);
        }
        c.restore();
      }else if(f.k==="shot"){
        c.save();c.shadowBlur=f.r*3;c.shadowColor=f.col;
        const pulse=1+Math.sin(f.t*40)*.15;
        c.fillStyle=f.col;c.beginPath();c.arc(f.x,f.y,f.r*1.5*pulse,0,7);c.fill();
        c.fillStyle=f.core;c.beginPath();c.arc(f.x,f.y,f.r*.75,0,7);c.fill();
        c.restore();
      }else if(f.k==="chain"){
        const a=1-f.t/f.max;
        // Blitz flackert: alle 40 ms neue Zacken
        let s=f.seed+Math.floor(f.t*25)*7.3;
        const jit=()=>{s=(s*9301+49297)%233280;return s/233280-.5;};
        c.save();c.globalAlpha=clamp(a*1.6,0,1);c.lineJoin="round";
        for(const pass of [[4,f.col,12],[1.5,"#ffffff",0]]){
          c.lineWidth=pass[0];c.strokeStyle=pass[1];c.shadowBlur=pass[2];c.shadowColor=f.col;
          s=f.seed+Math.floor(f.t*25)*7.3;
          c.beginPath();
          for(let p=0;p<f.pts.length-1;p++){
            const A=f.pts[p],B=f.pts[p+1];
            if(p===0)c.moveTo(A.x,A.y);
            const n=7;
            for(let j=1;j<=n;j++){
              const k=j/n;
              const off=j===n?0:jit()*16;
              c.lineTo(A.x+(B.x-A.x)*k,A.y+(B.y-A.y)*k+off);
            }
          }
          c.stroke();
        }
        c.restore();
      }else if(f.k==="nova"){
        const k=f.t/f.max,r=8+k*f.maxR;
        c.save();c.globalAlpha=(1-k)*.85;c.strokeStyle=f.col;c.shadowBlur=10;c.shadowColor=f.col;
        c.lineWidth=5*(1-k)+1;
        c.beginPath();c.ellipse(f.x,GROUND-14,r,r*.32,0,0,7);c.stroke();
        c.globalAlpha=(1-k)*.3;c.lineWidth=2;
        c.beginPath();c.ellipse(f.x,GROUND-14,r*.7,r*.22,0,0,7);c.stroke();
        c.restore();
      }else if(f.k==="pillar"){
        const k=f.t/f.max,a=Math.sin(k*Math.PI);
        const w=10+a*14;
        c.save();c.globalAlpha=a*.55;
        const g=c.createLinearGradient(0,0,0,GROUND);
        g.addColorStop(0,hexA(f.col,0));g.addColorStop(.6,hexA(f.col,.7));g.addColorStop(1,hexA("#ffffff",.9));
        c.fillStyle=g;c.fillRect(f.x-w/2,0,w,GROUND);
        c.globalAlpha=a*.9;c.fillStyle="#ffffff";c.fillRect(f.x-1,0,2,GROUND);
        c.restore();
      }else if(f.k==="flare"){
        const k=f.t/f.max,r=f.r*(.4+k*.9);
        c.save();c.globalAlpha=(1-k);
        const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
        g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(.35,hexA(f.col,.85));g.addColorStop(1,hexA(f.col,0));
        c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,r,0,7);c.fill();
        c.restore();
      }else if(f.k==="orb"){
        if(f.t<0)continue;                       // wartet noch auf ihren Start
        const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;    // easeInOutCubic
        const at=u=>{const v=1-u;return [v*v*f.x0+2*v*u*f.cx+u*u*f.x1,v*v*f.y0+2*v*u*f.cy+u*u*f.y1];};
        const p=ease(clamp(f.t/f.max,0,1));
        // Fade-in am Gegner, Schrumpfen beim Eintauchen in den Helden
        const grow=Math.min(1,f.t/.08),fin=p>.9?1-(p-.9)/.1*.6:1,r=f.r*grow*fin;
        c.save();
        // Schweif: drei Nachbilder etwas weiter zurück auf derselben Bahn
        for(let j=3;j>=1;j--){
          const q=at(ease(clamp((f.t-j*.022)/f.max,0,1)));
          c.globalAlpha=.16*(4-j);c.fillStyle="#c1121f";
          c.beginPath();c.arc(q[0],q[1],r*(1-j*.18),0,7);c.fill();
        }
        const P=at(p);
        c.globalAlpha=1;c.shadowBlur=7;c.shadowColor="#ff4d6d";
        c.fillStyle="#ff4d6d";c.beginPath();c.arc(P[0],P[1],r+.8,0,7);c.fill();
        c.shadowBlur=0;c.fillStyle="#ffd0d8";c.beginPath();c.arc(P[0]-.4,P[1]-.4,r*.45,0,7);c.fill();
        c.restore();
      }else if(f.k==="slash"){
        const k=f.t/f.max,r=(14+k*6)*f.big;
        c.save();c.globalAlpha=1-k;c.strokeStyle=f.col;c.shadowBlur=8;c.shadowColor=f.col;
        c.lineCap="round";
        const a0=-Math.PI*.75,a1=a0+Math.PI*1.1*Math.min(1,k*3);
        c.lineWidth=4*f.big*(1-k)+1;c.beginPath();c.arc(f.x,f.y,r,a0,a1);c.stroke();
        c.strokeStyle="#ffffff";c.lineWidth=1.2;c.beginPath();c.arc(f.x,f.y,r-1,a0,a1);c.stroke();
        c.restore();
      }else if(f.k==="sword"){
        // Schwert aus Licht: stürzt herab, steckt im Boden, verglüht
        const k=f.t/f.max,fall=Math.min(1,k/.32),tip=lerp(-70,GROUND+4,fall*fall);
        const a=k<.75?1:1-(k-.75)/.25;
        c.save();c.globalAlpha=a;c.shadowBlur=16;c.shadowColor=f.col;
        c.fillStyle=f.col;c.beginPath();c.moveTo(f.x,tip);c.lineTo(f.x-7,tip-14);c.lineTo(f.x-7,tip-82);
        c.lineTo(f.x+7,tip-82);c.lineTo(f.x+7,tip-14);c.closePath();c.fill();
        c.fillStyle="#ffffff";c.fillRect(f.x-1.5,tip-80,3,66);
        c.fillStyle="#c9a227";c.fillRect(f.x-18,tip-88,36,6);c.fillRect(f.x-3,tip-108,6,20);
        c.fillStyle="#fff3b0";c.beginPath();c.arc(f.x,tip-111,5,0,7);c.fill();
        c.restore();
      }else if(f.k==="cross"){
        const k=f.t/f.max,a=Math.sin(Math.min(1,k)*Math.PI);
        c.save();c.globalAlpha=a*.55;c.fillStyle=f.col;c.shadowBlur=20;c.shadowColor=f.col;
        c.fillRect(W/2-6,0,12,H);c.fillRect(0,H*.38-6,W,12);
        c.globalAlpha=a*.9;c.fillStyle="#ffffff";c.fillRect(W/2-1.5,0,3,H);c.fillRect(0,H*.38-1.5,W,3);
        c.restore();
      }else if(f.k==="claw"){
        const k=f.t/f.max,len=Math.min(1,k*4)*16;
        c.save();c.globalAlpha=1-k*k;c.strokeStyle=f.col;c.lineWidth=2;c.shadowBlur=5;c.shadowColor=f.col;
        for(let j=-1;j<=1;j++){c.beginPath();c.moveTo(f.x-6+j*5,f.y-9);c.lineTo(f.x-6+j*5+len*.45,f.y-9+len);c.stroke();}
        c.restore();
      }else if(f.k==="beam"){
        const k=f.t/f.max,w=((1-k)*5+1)*f.w;
        c.save();c.globalAlpha=1-k*.6;c.lineCap="round";
        c.strokeStyle=f.col;c.lineWidth=w+3;c.shadowBlur=12;c.shadowColor=f.col;
        c.beginPath();c.moveTo(f.x1,f.y1);c.lineTo(f.x2,f.y2);c.stroke();
        c.strokeStyle="#ffffff";c.lineWidth=Math.max(1,w*.4);
        c.beginPath();c.moveTo(f.x1,f.y1);c.lineTo(f.x2,f.y2);c.stroke();c.restore();
      }else if(f.k==="tentacle"){
        const k=f.t/f.max,hgt=Math.sin(Math.min(1,k)*Math.PI)*56;
        c.save();c.strokeStyle=f.col;c.lineCap="round";
        for(let j=0;j<12;j++){
          const q=j/12,q2=(j+1)/12;
          const sway=a=>Math.sin(f.t*9+a*5)*8*a;
          c.lineWidth=7*(1-q)+1.5;
          c.beginPath();c.moveTo(f.x+sway(q),GROUND-hgt*q);c.lineTo(f.x+sway(q2),GROUND-hgt*q2);c.stroke();
        }
        c.fillStyle="#1a0f24";c.beginPath();c.ellipse(f.x,GROUND+1,14,3,0,0,7);c.fill();
        c.restore();
      }else if(f.k==="roots"){
        const k=f.t/f.max,g=Math.sin(Math.min(1,k)*Math.PI);
        c.save();
        for(let j=0;j<4;j++){
          const ox=((j-1.5)*7+Math.sin(f.seed+j*2.1)*2)*f.sz,hh=(18+j%2*10)*g*f.sz,bw=3*f.sz;
          c.fillStyle=f.pal[j%2];
          c.beginPath();c.moveTo(f.x+ox-bw,GROUND);c.lineTo(f.x+ox+Math.sin(f.seed+j)*4,GROUND-hh);c.lineTo(f.x+ox+bw,GROUND);c.fill();
          c.fillStyle=f.col;c.fillRect(f.x+ox-2,GROUND-hh*.5,2,2);c.fillRect(f.x+ox+1,GROUND-hh*.75,2,2);
        }
        c.restore();
      }else if(f.k==="quake"){
        c.save();c.fillStyle="#2a2018";c.globalAlpha=.8;
        c.fillRect(Math.min(f.x1,f.x),GROUND-1,Math.abs(f.x-f.x1),2);
        // aufgeworfene Erdschollen als Welle
        const j=Math.sin(f.t*30)*2;
        c.globalAlpha=1;c.fillStyle="#3a2a1e";
        c.beginPath();c.moveTo(f.x-16,GROUND+1);c.lineTo(f.x-8,GROUND-12-j);c.lineTo(f.x-2,GROUND-6);
        c.lineTo(f.x+3,GROUND-20+j);c.lineTo(f.x+9,GROUND-8);c.lineTo(f.x+13,GROUND-14-j);c.lineTo(f.x+18,GROUND+1);c.fill();
        c.fillStyle=f.col;
        c.beginPath();c.moveTo(f.x-13,GROUND);c.lineTo(f.x-8,GROUND-9-j);c.lineTo(f.x-3,GROUND-4);
        c.lineTo(f.x+3,GROUND-17+j);c.lineTo(f.x+8,GROUND-6);c.lineTo(f.x+13,GROUND-11-j);c.lineTo(f.x+16,GROUND);c.fill();
        c.restore();
      }else if(f.k==="wave"){
        c.save();c.strokeStyle=f.col;c.shadowBlur=6;c.shadowColor=f.col;
        for(let j=0;j<3;j++){
          const xx=f.x+j*9,r=8+j*3;
          c.globalAlpha=.85-j*.22;c.lineWidth=2;
          c.beginPath();c.arc(xx,f.y,r,Math.PI*.65,Math.PI*1.35);c.stroke();
        }
        c.restore();
      }else if(f.k==="cloud"){
        const k=f.t/f.max,a=Math.min(1,f.t*4)*Math.min(1,(f.max-f.t)*2);
        c.save();c.globalAlpha=.32*a;c.fillStyle=f.col;
        for(let j=0;j<4;j++){
          const ox=Math.sin(f.t*1.7+j*1.9)*14,oy=Math.cos(f.t*1.3+j*2.3)*5;
          c.beginPath();c.ellipse(f.x+ox+(j-1.5)*9,f.y+oy,16,9,0,0,7);c.fill();
        }
        c.restore();
      }
    }
  }
}

/** Ein Edelstein wird als "typ:güte" gespeichert — kurz und gut serialisierbar */

function parseGem(id){
  const pcs=String(id).split(":");
  const base=GEMS.find(g=>g.k===pcs[0])||GEMS[0];
  const q=clamp(parseInt(pcs[1],10)||0,0,9);
  const Q=GEM_QUAL[q];
  const amt=Math.max(1,Math.round(base.amt*Q.m));
  return {base:base,q:q,Q:Q,amt:amt,
    name:Q.n+"er "+base.n,
    txt:"+"+amt+base.unit,
    col:base.col};
}

/* ----------------------------------------------------------------------------
   Ahnengalerie: Wer einem gefallenen Helden einen Gegenstand weiht, übernimmt
   dessen Eigenschaften dauerhaft in alle künftigen Läufe. Damit sich das über
   viele Generationen nicht ins Uferlose summiert, wirken Weihgaben zu 60 % und
   nur eine begrenzte Zahl ist gleichzeitig aktiv.
   -------------------------------------------------------------------------- */
const RELIC_RATE=.6;
function relicSlots(){
  return 1+((typeof G!=="undefined"&&G.meta&&G.meta.shrine)||0);
}
/** Taugt ein Gegenstand als Weihgabe? Nur Legendäres; Zauberrunen nicht,
    denn ihr Zauber hängt am Tragen und ließe sich nicht vererben. */
function isRelicWorthy(it){return !!it&&it.rar===3&&!it.spell;}
function relicBonuses(only){
  const out={stats:{},armor:0,dmgpct:0,uniq:{},skills:{},rune:{},n:0};
  const list=only?[{relic:only,active:true}]:
    (typeof G!=="undefined"&&G.graves)?G.graves:[];
  for(const g of list){
    const it=g.relic;
    if(!it||!g.active)continue;
    out.n++;
    const st=itemStats(it);
    for(const k in st)out.stats[k]=(out.stats[k]||0)+st[k]*RELIC_RATE;
    if(it.armor)out.armor+=it.armor*RELIC_RATE;
    if(it.dmax)out.dmgpct+=(it.rar+1)*4*RELIC_RATE;   // Waffen wirken als Schadensbonus
    if(it.uniq)out.uniq[it.uniq]=true;
    if(it.skillK)out.skills[it.skillK]=(out.skills[it.skillK]||0)+it.skillV;
    if(it.rune)for(const k in it.rune)out.rune[k]=(out.rune[k]||0)+it.rune[k]*RELIC_RATE;
  }
  return out;
}
let ITEM_ID=1;
/** Erzeugt eine Rune mit zufälliger passiver Eigenschaft oder zufälligem Zauber */
function makeRune(level){
  const it={id:ITEM_ID++,slot:pick(["rune1","rune2","rune3"]),rar:3,lvl:level,
            stats:{},sockets:[],gems:[],isRune:true};
  it.slot="rune";
  it.base="Rune";
  const spell=Math.random()<.45;
  const t=clamp(level/40,0,1);
  if(spell){
    const sp=pick(RUNE_SPELLS);
    it.spell={k:sp.k,chance:ri(8,20),power:Math.round((10+level*3.2)*rnd(.8,1.4)),col:sp.col};
    it.name=pick(RUNE_WORDS)+"-Rune "+(sp.rn||"des "+sp.n);
    it.uniqTxt=it.spell.chance+" % Chance je Treffer: "+sp.d+".";
  }else{
    const a=pick(RUNE_PASSIVE);
    const v=Math.round(lerp(a.v[0],a.v[1],rnd(.3,1))*(1+t)*10)/10;
    it.rune={};it.rune[a.k]=v;
    it.name=pick(RUNE_WORDS)+"-Rune der "+a.n;
    it.uniqTxt=effLines(it.rune,1).join(", ")+".";
  }
  it.req={lvl:Math.max(1,Math.round(level*.6)),k:"int",v:0};
  return it;
}
/** Zentrale Item-Fabrik: Level skaliert alle Werte, Seltenheit die Anzahl der Affixe */
const LOOT_SLOTS=["head","amulet","weapon","chest","offhand","hands","ring","legs","feet"];
function makeItem(level,slot,forceRar,mf){
  slot=slot||pick(LOOT_SLOTS);
  // Die Stufe des Helden bestimmt, was die Welt überhaupt hergibt:
  // Rares erst ab Stufe 5, Legendäres ab Stufe 10; die Chance wächst milde mit der Stufe.
  const gate=level>=10?3:level>=5?2:1;
  let r;
  if(forceRar!==undefined&&forceRar!==null)r=Math.min(forceRar,gate);
  else{
    const lvlFactor=1+Math.min(.35,level*.01);
    const roll=Math.random()*100/((1+(mf||0)/100)*lvlFactor);
    r=roll<.22?3:roll<1.4?2:roll<9?1:0;
    r=Math.min(r,gate);
  }
  const R=RARITY[r];
  const it={id:ITEM_ID++,slot,rar:r,lvl:level,stats:{},sockets:[],gems:[]};
  if(slot==="weapon"){
    const b=pick(WEAPONS);
    it.base=b.n;it.wtype=b.t;it.hue=b.hue;it.spd=b.s;
    const dps=(5+level*2.3)*b.d*R.mult;
    it.dmin=Math.max(1,Math.round(dps*.78));it.dmax=Math.round(dps*1.26);
  }else{
    const b=pick(ARMORS[slot]);
    it.base=b[0];it.hue=ri(0,359);
    it.armor=Math.max(1,Math.round((3+level*1.7)*b[1]*R.mult));
  }
  const pool=AFFIXES.filter(a=>Math.random()<a.p);
  const n=r===0?0:ri(Math.max(1,R.aff-2),R.aff);
  const used={};
  for(let i=0;i<n&&pool.length;i++){
    const a=pool.splice(ri(0,pool.length-1),1)[0];
    if(used[a.k])continue;used[a.k]=1;
    const t=clamp(level/40,0,1);
    it.stats[a.k]=Math.max(1,Math.round(lerp(a.v[0],a.v[1],rnd(.25,1))*(1+t*1.6)));
  }
  // Anforderungen: höherwertige Beute verlangt Stufe und Attribute
  const primaryOf={sword:"str",axe:"str",dagger:"dex",bow:"dex",staff:"int"};
  const reqAttr=slot==="weapon"?primaryOf[it.wtype]:
    (slot==="ring"||slot==="amulet")?"int":(Math.random()<.5?"str":"vit");
  // Der Wert orientiert sich daran, was eine fokussierte Verteilung erreicht:
  // wer seine Punkte streut, kann seltene Beute schlicht nicht heben.
  const reqScale=slot==="weapon"?1:.72;
  it.req={lvl:Math.max(1,Math.round(level*(.55+r*.13)-1)),k:reqAttr,
          v:Math.max(0,Math.round((8+level*2.2)*(.45+r*.20)*reqScale))};
  // Sehr selten trägt ein Fundstück den Rang einer Fähigkeit
  if(Math.random()<(r===3?.22:r===2?.05:0)){
    const sk=pick(SKILLS);
    it.skillK=sk.k;it.skillV=r===3?ri(1,2):1;
  }
  // Sockel: erst die Chance auf überhaupt einen, dann die Anzahl
  const sc=(R.sock&&Math.random()<R.sockP)?ri(1,R.sock):0;
  for(let i=0;i<sc;i++)it.sockets.push(null);
  if(r===3){
    const u=pick(UNIQUES);it.uniq=u.e;it.uniqTxt=u.d;it.name=u.n;
  }else if(r===0){it.name=it.base;}
  else if(r===1){it.name=pick(AFF_PRE)+" "+it.base;}
  else{it.name=pick(AFF_PRE)+" "+it.base+" "+pick(AFF_SUF);}
  return it;
}
/** Effektive Werte inkl. eingesetzter Edelsteine */
function itemStats(it){
  const s=Object.assign({},it.stats);
  for(const g of it.sockets){
    if(!g)continue;
    const P=parseGem(g);
    s[P.base.stat]=(s[P.base.stat]||0)+P.amt;
  }
  return s;
}

function drillCost(it){return Math.round((90+it.lvl*14)*Math.pow(2.1,it.sockets.length)*(1+it.rar*.15));}

function socketDots(it){

function itemScore(it){
  if(!it)return 0;const s=itemStats(it);let v=0;
  if(it.dmax)v+=(it.dmin+it.dmax)/2*3;

  if(it.uniq)v+=60;

}

/** Erzeugt aus einem Wirkungsobjekt lesbare Zeilen ("+12 % Schaden") */
function effLines(e,mult){
  const out=[];
  for(const k in e){
    const v=Math.round(e[k]*(mult===undefined?1:mult)*10)/10;
    const nm=EFFN[k]||[k,""];
    out.push("+"+v+(nm[1]?" "+nm[1]:"")+" "+nm[0]);
  }
  return out;
}
