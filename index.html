class Entity{
  constructor(){this.hp=1;this.maxHp=1;this.x=0;this.flash=0;this.atkTimer=0;this.anim=0;this.lunge=0;this.dead=false;}
  get hpPct(){return clamp(this.hp/this.maxHp,0,1);}
  /* Sichtbare Größe in logischen Bildschirmpixeln — nicht in Sprite-Pixeln.
     Ohne die Division durch sp.f wächst alles mit der Sprite-Auflösung mit. */
  get ph(){return this.sp?this.sp.base*this.scale/this.sp.f:0;}
  get pw(){return this.sp?this.sp.w*this.scale/this.sp.f:0;}
}
class Hero extends Entity{
  constructor(name,race,cls,meta){
    super();
    this.name=name;this.race=race;this.cls=cls;
    this.level=1;this.xp=0;this.gold=0;this.potions=3+(meta.potion||0);
    this.skillPts=1+(meta.skill||0);this.skills={};
    this.ult={rank:1,path:null};this.ultCd=12;   // Ultimative Fähigkeit: Rang 1 von Beginn an
    this.attrPts=4;                       // vier Punkte pro Stufe, frei verteilbar
    this.alloc={str:0,dex:0,int:0,vit:0}; // selbst verteilte Punkte (Grundlage der Vererbung)
    this.equip={};this.bag=[];this.gems=[];
    this.statPts=0;this.base={str:5,dex:5,int:5,vit:5};
    const R=RACES[race],C=CLASSES[cls];
    for(const k in R.b)this.base[k]+=R.b[k];
    for(const k in C.b)this.base[k]+=C.b[k];
    this.meta=meta;
    this.tint=ri(-22,22);            // jeder Held trägt eine eigene Farbnuance
    this.look=ri(0,3);               // eines von vier Erscheinungsbildern seiner Rasse
    this.status={poison:0,poisonDmg:0,burn:0,slow:0};
    this.boons=[];                   // zeitweilige Segen
    this.mount=null;                 // Reittier, kommt nach dem ersten Boss
    this.kills=0;this.bossKills=0;this.shardsRun=0;this.dmgDone=0;
    this.recompute();this.hp=this.maxHp;
  }
  skill(k){return this.skills[k]||0;}
  /** Summiert die Wirkungen aller gelernten Fähigkeitsränge */
  /** Rang einer Fähigkeit inklusive Ausrüstung und geweihter Gegenstände */
  rankOf(k){
    let r=this.skills[k]||0;
    for(const sl in this.equip){const it=this.equip[sl];if(it&&it.skillK===k)r+=it.skillV;}
    const R=this.relics||relicBonuses();
    if(R.skills[k])r+=R.skills[k];
    return r;
  }
  /** Einzigartige Wirkung aus Ausrüstung oder Ahnengalerie? */
  hasUniq(k){
    for(const sl in this.equip){const it=this.equip[sl];if(it&&it.uniq===k)return true;}
    const R=this.relics||relicBonuses();
    return !!R.uniq[k];
  }
  skillEffects(){
    const e={};
    for(const s of SKILLS){
      const r=Math.min(s.max+2,this.rankOf(s.k));if(!r)continue;
      for(const k in s.e)e[k]=(e[k]||0)+s.e[k]*r;
    }
    for(const sl in this.equip){            // Runen wirken wie zusätzliche Fähigkeiten
      const it=this.equip[sl];
      if(it&&it.rune)for(const k in it.rune)e[k]=(e[k]||0)+it.rune[k];
    }
    const R=this.relics||relicBonuses();    // geweihte Runen der Ahnen
    for(const k in R.rune)e[k]=(e[k]||0)+R.rune[k];
    for(const b of this.boons||[]){         // zeitweilige Segen
      for(const k in b.e)e[k]=(e[k]||0)+b.e[k];
    }
    if(this.mount){                         // dauerhafter Bonus des Reittiers
      for(const k in this.mount.bonus)e[k]=(e[k]||0)+this.mount.bonus[k];
    }
    return e;
  }
  /** Prüft, ob der Held einen Gegenstand tragen darf */
  canEquip(it){
    if(!it||!it.req)return {ok:true};
    if(this.level<it.req.lvl)return {ok:false,why:"Stufe "+it.req.lvl+" nötig"};
    if(it.req.v>0&&this[it.req.k]<it.req.v){
      const nm={str:"Stärke",dex:"Geschick",int:"Intelligenz",vit:"Ausdauer"}[it.req.k];
      return {ok:false,why:it.req.v+" "+nm+" nötig (du hast "+this[it.req.k]+")"};
    }
    return {ok:true};
  }
  /** Sammelt alle Boni aus Ausrüstung, Skills, Rasse/Klasse und Meta-Upgrades */
  recompute(){
    const R=RACES[this.race],C=CLASSES[this.cls],m=this.meta;
    this.relics=relicBonuses();             // Weihgaben der Ahnengalerie
    const s={str:0,dex:0,int:0,vit:0,hp:0,armor:0,crit:0,critdmg:0,dmgpct:0,aspd:0,leech:0,gf:0,mf:0,thorns:0};
    for(const k in this.relics.stats)s[k]=(s[k]||0)+this.relics.stats[k];
    s.armor+=this.relics.armor;s.dmgpct+=this.relics.dmgpct;
    for(const k in this.equip){
      const it=this.equip[k];if(!it)continue;
      const st=itemStats(it);
      for(const a in st)s[a]=(s[a]||0)+st[a];
      if(it.armor)s.armor+=it.armor;
      if(it.uniq==="leech")s.leech+=8;
      if(it.uniq==="thorns")s.thorns+=Math.round(this.level*1.5);
      if(it.uniq==="mf")s.mf+=40;
    }
    const K=this.skillEffects();this.sk=K;
    const g=x=>K[x]||0;
    const allp=g("allpct")/100;
    const A=this.alloc||{str:0,dex:0,int:0,vit:0};
    this.str=Math.round((this.base.str+A.str+s.str)*(1+allp));
    this.dex=Math.round((this.base.dex+A.dex+s.dex+g("dex"))*(1+allp));
    this.int=Math.round((this.base.int+A.int+s.int)*(1+allp));
    this.vit=Math.round((this.base.vit+A.vit+s.vit+g("vit"))*(1+allp));

    let hpm=(R.hpm||1)*(C.hpm||1)*(1+g("hppct")/100)*(1+(m.hp||0)*.06);
    this.maxHp=Math.round((70+this.level*10+this.vit*15+s.hp)*hpm);
    this.armor=Math.round(16+this.level*2+this.vit*1.6+s.armor+(R.armor||0)+(C.armor||0)+g("armor"));
    this.crit=clamp(5+(C.crit||0)+(R.crit||0)+s.crit+this.dex*.30+g("crit"),0,75);
    this.critDmg=150+s.critdmg+g("critdmg");
    this.aspd=1+((R.aspd||0)+(C.aspd||0)+s.aspd+g("aspd")+this.dex*.35)/100;
    this.leech=s.leech+(C.leech||0)+g("leech");
    this.thorns=s.thorns+g("thorns");
    this.gf=(R.gf||0)+s.gf+g("gf");
    this.mf=s.mf+g("mf")+(m.mf||0)*10;
    this.dmgRed=clamp(g("dr"),0,40);
    this.blockChance=clamp(5+this.armor/9+g("block"),0,50);
    this.regen=g("regen");
    this.potionPower=g("potion");
    this.xpBonus=((R.xp||1)-1)*100+(m.xp||0)*10;
    this.dmgMult=(1+((C.dmg||0)+(R.dmg||0)+s.dmgpct+g("dmgpct")+(m.dmg||0)*5)/100);
    const w=this.equip.weapon;
    const prim=this[C.prim];
    this.wMin=w?w.dmin:Math.round(3+this.level*1.1);
    this.wMax=w?w.dmax:Math.round(6+this.level*1.9);
    this.wSpd=w?w.spd:1;
    if(this.relics.uniq.leech)this.leech+=8*RELIC_RATE;
    if(this.relics.uniq.thorns)this.thorns+=Math.round(this.level*1.5*RELIC_RATE);
    if(this.relics.uniq.mf)this.mf+=40*RELIC_RATE;
    this.dmgMin=Math.round(this.wMin*(1+prim*.048)*this.dmgMult);
    this.dmgMax=Math.round(this.wMax*(1+prim*.048)*this.dmgMult);
    this.atkPerSec=clamp(.85*this.aspd*this.wSpd*(this.status.slow>0?.8:1),.25,4);
    this.dps=Math.round((this.dmgMin+this.dmgMax)/2*this.atkPerSec*(1+this.crit/100*(this.critDmg-100)/100));
    this.hp=Math.min(this.hp,this.maxHp);
  }
  /* Sehr flache Aufstiegskurve: eine Stufe ist ein Ereignis, kein Zwischenschritt */
  xpNeeded(){return Math.round(165*Math.pow(this.level,1.62));}
}

      this.model=BOSS_MODELS[(Math.floor(level/10)-1)%BOSS_MODELS.length];
      this.name=bn[0];this.hue=bn[1];this.scale=4;
      this.maxHp=Math.round((150+level*70+QS(level,2)*49)*(1+zone*.18));
      this.dmg=Math.round((6+level*2.4+QS(level,3)*1.84)*(1+zone*.16));
      this.atkPerSec=.62;this.xp=Math.round(240+level*95);this.gold=Math.round(90+level*30);
      this.affix=null;this.enraged=false;
    }else{
      const pool=BESTIARY.filter(b=>b.t<=Math.max(1,Math.ceil(level/6)));
      const b=pick(pool.length?pool:BESTIARY);
      const v=pick(b.v);
      this.model=b.m;this.hue=v[1];this.scale=b.sc;
      let hpM=b.hp,dmM=b.dm;
      this.name=v[0];
      if(level>=6&&Math.random()<clamp(.10+level*.012,0,.55)){
        const a=pick(level<14?ENEMY_AFFIXES.filter(x=>["giant","ancient","armored","shielded","explosive"].indexOf(x.k)<0):ENEMY_AFFIXES);
        this.affix=a;this.name=a.n+" "+v[0];
        hpM*=a.hp;dmM*=a.dm;this.hue=Math.round(lerp(this.hue,a.hue,.65));
        if(a.k==="giant")this.scale=Math.round(this.scale*1.55);
      }else this.affix=null;
      this.maxHp=Math.round((26+level*13+QS(level,2)*7.0)*hpM*(1+zone*.14));
      this.dmg=Math.round((3.5+level*1.35+QS(level,3)*1.15)*dmM*(1+zone*.16));
      this.atkPerSec=(this.affix&&this.affix.k==="swift")?1.15:.78;
      this.xp=Math.round((14+level*8)*(this.affix&&this.affix.k==="ancient"?2.2:1));
      this.gold=Math.round((6+level*3.4)*(this.affix&&this.affix.k==="golden"?4:1));
      this.enraged=false;
      if(mini){
        // Miniboss: einzelner, deutlich überlegener Gegner mit eigenem Balken
        this.name=pick(MINI_TITLES)+" "+this.name;
        this.maxHp=Math.round(this.maxHp*2.7);
        this.dmg=Math.round(this.dmg*1.45);
        this.atkPerSec*=1.12;
        this.scale=Math.round(this.scale*1.4);
        this.xp=Math.round(this.xp*3.2);this.gold=Math.round(this.gold*3.4);
      }
    }
    this.hp=this.maxHp;this.pal=palette(this.hue,this.boss?48:40);
    // Schild schluckt ein Drittel des Lebens, bevor echter Schaden durchgeht
    this.shield=(this.affix&&this.affix.k==="shielded")?Math.round(this.maxHp*.35):0;
    this.shieldMax=this.shield;
    this.sp=SPRITES[this.model];
  }
}

/** Zeichnet Ohren, Bärte, Hauer, Hörner, Haar, Stirnband und Narbe.
    Wird von der Spielfigur und der Editor-Vorschau gemeinsam genutzt. */
function drawRaceFeatures(ctx,look,x,headY,s,helmet){
  const skin=palette(look.skin,look.skin>200?18:34,look.skin===96||look.skin===78?-8:6);
  const hair=palette(look.hair,look.hair===0?6:40,-8);
  const has=k=>look.feat.indexOf(k)>=0;
  if(has("ears")){
    ctx.fillStyle=skin[2];
    ctx.beginPath();ctx.moveTo(x-9*s,headY);ctx.lineTo(x-15*s,headY-7*s);ctx.lineTo(x-8*s,headY+3*s);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x+9*s,headY);ctx.lineTo(x+15*s,headY-7*s);ctx.lineTo(x+8*s,headY+3*s);ctx.closePath();ctx.fill();
    ctx.fillStyle=skin[3];
    ctx.fillRect(x-12*s,headY-3*s,2*s,2*s);ctx.fillRect(x+10*s,headY-3*s,2*s,2*s);
  }
  if(has("hair")&&!helmet){
    ctx.fillStyle=hair[2];
    ctx.fillRect(x-9*s,headY-9*s,18*s,6*s);
    ctx.fillStyle=hair[3];ctx.fillRect(x-9*s,headY-9*s,18*s,2*s);
    ctx.fillStyle=hair[4];
    ctx.fillRect(x-10*s,headY-6*s,3*s,10*s);ctx.fillRect(x+7*s,headY-6*s,3*s,10*s);
  }
  if(has("horns")){
    ctx.fillStyle="#e8e2d0";
    ctx.beginPath();ctx.moveTo(x-8*s,headY-6*s);ctx.lineTo(x-13*s,headY-14*s);
    ctx.lineTo(x-6*s,headY-8*s);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x+8*s,headY-6*s);ctx.lineTo(x+13*s,headY-14*s);
    ctx.lineTo(x+6*s,headY-8*s);ctx.closePath();ctx.fill();
  }
  if(has("band")&&!helmet){
    ctx.fillStyle=hair[6];ctx.fillRect(x-9*s,headY-4*s,18*s,2.5*s);
    ctx.fillStyle=hair[3];ctx.fillRect(x-2*s,headY-4.5*s,4*s,3.5*s);
  }
  if(has("circlet")&&!helmet){
    ctx.fillStyle="#ffe07a";ctx.fillRect(x-8*s,headY-5*s,16*s,2*s);
    ctx.fillStyle="#8be9fd";ctx.fillRect(x-1.5*s,headY-7*s,3*s,3*s);
  }
  if(has("beard")){
    ctx.fillStyle=hair[4];ctx.fillRect(x-7*s,headY+5*s,14*s,7*s);
    ctx.fillStyle=hair[2];ctx.fillRect(x-7*s,headY+5*s,14*s,2.5*s);
    ctx.fillStyle=hair[4];ctx.fillRect(x-5*s,headY+12*s,10*s,5*s);
    ctx.fillStyle=hair[1];ctx.fillRect(x-2*s,headY+12*s,4*s,6*s);
  }
  if(has("tusks")){
    ctx.fillStyle=skin[2];ctx.fillRect(x-8*s,headY+2*s,16*s,4*s);
    ctx.fillStyle=skin[4];ctx.fillRect(x-8*s,headY+6*s,16*s,1.5*s);
    ctx.fillStyle="#f2eee0";
    ctx.fillRect(x-5*s,headY+6*s,2.5*s,6*s);ctx.fillRect(x+3*s,headY+6*s,2.5*s,6*s);
  }
  if(has("scar")){
    ctx.fillStyle="#c0616a";ctx.fillRect(x+3*s,headY-2*s,1.5*s,7*s);
  }
}

/* ============================================================================
   8. GAME — Loop, Welt, Kampf
   ========================================================================== */
const W=420,H=280,GROUND=214;
class Game{
  constructor(){
    this.cv=$("game");this.ctx=this.cv.getContext("2d");
    this.ctx.imageSmoothingEnabled=false;
    this.res=this.cv.width/W;               // Geräte-Pixel je logischem Pixel
    this.parts=new Particles();this.fct=new FloatTexts();this.spells=new SpellFx(this.parts);
    this.shake=0;this.shakeMag=0;this.time=0;this.dayT=.25;
    this.scroll=0;this.state="idle";this.hero=null;this.enemy=null;this.enemies=[];
    this.zone=1;this.dist=0;this.nextEncounter=170;
    this.weather="clear";this.weatherT=0;this.drops=[];
    this.meta={};this.shards=0;this.heirlooms=[];this.heirGems=[];this.heirGold=0;this.heirAttr=null;
    this.bossMarks=[];
    this.graves=[];this.totalDist=0;
    this.stats={runs:0,bestLevel:0,bestZone:1,kills:0,bosses:0};
    this.biome=BIOMES[0];this.biomeLeft=6;this.prevBiome=null;this.blend=1;
    this.layers=this.buildLayers();
    this.hitStop=0;this.lootGlow=0;this.autoEquip=false;
    this.props=[];this.propT=18;this.mountCd=0;this.rideT=0;
    this.last=performance.now();
    requestAnimationFrame(t=>this.frame(t));
  }
  /* ---------- Landschaft: Biom wählen und Silhouetten erzeugen ---------- */
  /** Streut Objekte über eine Bildschirmbreite; jede Ebene wiederholt sich nahtlos */
  makeRow(minH,maxH,wMin,wMax,dens){
    const a=[];let x=0;
    while(x<W){
      const ww=ri(wMin,wMax);
      a.push({x,w:ww,h:ri(minH,maxH),v:Math.random()});
      x+=ww*rnd(dens||.6,(dens||.6)+.45);
    }
    return a;
  }
  buildLayers(){
    const b=this.biome;
    const rowFor=type=>{
      switch(type){
        case "mountain": return this.makeRow(45,105,50,110,.55);
        case "hills":    return this.makeRow(20,52,70,150,.5);
        case "trees":    return this.makeRow(30,66,14,26,.5);
        case "trees2":   return this.makeRow(26,58,18,34,.5);
        case "houses":   return this.makeRow(22,40,26,44,.75);
        case "city":     return this.makeRow(50,120,20,40,.7);
        case "castle":   return this.makeRow(46,96,40,80,.8);
        case "wall":     return this.makeRow(24,38,30,60,.95);
        case "sea":      return this.makeRow(6,16,60,140,.5);
        case "waves":    return this.makeRow(3,8,20,44,.7);
        case "bricks":   return this.makeRow(0,0,W,W,1);
        case "pillars":  return this.makeRow(48,76,14,22,.6);
        case "arches":   return this.makeRow(44,70,34,56,.85);
        case "spires":   return this.makeRow(30,90,16,44,.5);
        case "grass":    return this.makeRow(6,16,5,14,.35);
        case "fence":    return this.makeRow(8,14,6,10,.5);
        case "sand":     return this.makeRow(4,9,8,20,.4);
        case "stones":   return this.makeRow(5,13,6,16,.4);
        default:         return this.makeRow(8,20,6,16,.5);
      }
    };
    const clouds=[];let cx2=0;
    while(cx2<W){clouds.push({x:cx2,w:ri(34,86),h:ri(8,18),y:ri(14,86),v:Math.random()});cx2+=ri(70,150);}
    return {sky:{t:"clouds",r:clouds},
            far:{t:b.far,r:rowFor(b.far)},mid:{t:b.mid,r:rowFor(b.mid)},near:{t:b.near,r:rowFor(b.near)}};
  }
  /** Wählt ein neues Biom, gewichtet nach Spieltiefe */
  rollBiome(){
    // Zone 1 zeigt Land und Siedlungen, ab Zone 2 Gemäuer, ab Zone 3 den Höllenschlund
    const maxTier=clamp(1+Math.round(this.zone/1.15),1,4);
    const pool=BIOMES.filter(b=>b.tier<=maxTier&&b!==this.biome);
    const weighted=[];
    for(const b of pool){
      // tiefere Zonen bevorzugen die düsteren Orte
      const w=b.tier>=3?1+this.zone*.35:Math.max(.4,2.2-this.zone*.16);
      for(let i=0;i<Math.max(1,Math.round(w*3));i++)weighted.push(b);
    }
    return pick(weighted.length?weighted:BIOMES);
  }
  changeBiome(silent){
    // Das alte Bild bleibt stehen und wird über wenige Sekunden überblendet
    if(this.biome&&!silent){this.prevBiome=this.biome;this.prevLayers=this.layers;this.blend=0;}
    else{this.prevBiome=null;this.blend=1;}
    this.biome=this.rollBiome();
    this.layers=this.buildLayers();
    updateMusic();
    this.biomeLeft=ri(4,8);            // so viele Begegnungen bleibt die Umgebung
    if(this.biome.indoor)this.weather=this.biome.dust?"fog":"clear";
    if(!silent&&this.hero){
      UI.log("Die Landschaft wechselt: "+this.biome.n+".","sys");
      this.fct.add(210,58,this.biome.n,"loot");
    }
  }
  /* ---------- Run-Steuerung ---------- */
  startRun(name,race,cls){
    this.hero=new Hero(name,race,cls,this.meta);
    this.hero.gold=Math.round(30*(1+(this.meta.gold||0)*.15));
    this.hero.equip.weapon=makeItem(1,"weapon",1,0);this.hero.recompute();this.hero.hp=this.hero.maxHp;
    if(this.meta.gemcutter)for(let i=0;i<2;i++)this.hero.gems.push(gemId(pick(GEMS).k,rollGemQuality(1)));
    // Das Vermächtnis: ohne Erbe kommt kaum ein Held tief
    for(const it of this.heirlooms){
      const c=JSON.parse(JSON.stringify(it));c.id=ITEM_ID++;c.isNew=true;
      if(this.meta.bloodline&&c.sockets.length<5)c.sockets.push(null);
      this.hero.bag.push(c);
    }
    if(this.heirAttr){
      for(const k in this.heirAttr)this.hero.base[k]+=this.heirAttr[k];
      this._heirAttrN=Object.keys(this.heirAttr).reduce((n,k)=>n+this.heirAttr[k],0);
      this.heirAttr=null;
    }else this._heirAttrN=0;
    for(const g of this.heirGems)this.hero.gems.push(g);
    if(this.heirGold)this.hero.gold+=this.heirGold;
    this._heirNames=this.heirlooms.map(i=>i.name);
    this._heirGemN=this.heirGems.length;this._heirGoldN=this.heirGold;
    this.heirlooms=[];this.heirGems=[];this.heirGold=0;
    this.zone=1;this.dist=0;this.nextEncounter=130;this.enemy=null;this.enemies=[];
    this.totalDist=0;this.bossMarks=[];this.props=[];this.propT=rnd(10,20);
    this.mountCd=0;this.rideT=0;this.changeBiome(true);
    this.shop=null;   // Händlerwaren richten sich nach dem neuen Helden
    UI.sel=null;UI.selSkill=null;
    this.state="walk";this.lastBoss=0;this.bossPending=false;
    this.parts.p.length=0;this.fct.t.length=0;this.drops.length=0;
    this.tq=[];this.ultFx=null;this.heroAnim=null;this.heroOx=0;this.heroOy=0;this.heroFade=1;
    UI.clearLog();
    updateMusic();
    UI.log("Ein neuer Run beginnt: "+name+", "+RACES[race].n+"-"+CLASSES[cls].n+".","sys");
    UI.log("Ziel: so tief wie möglich. Seelensplitter überdauern den Tod.","sys");
    UI.log("Magische Funde sind selten. Vergleiche im Inventar, bevor du etwas anlegst.","sys");
    if(this._heirNames&&this._heirNames.length)
      UI.log("Aus dem Vermächtnis erhalten: "+this._heirNames.join(", ")+".","loot");
    if(this._heirGemN)UI.log("Dazu "+this._heirGemN+" vererbte Seelensteine.","loot");
    if(this._heirAttrN)UI.log("Das Blut deiner Ahnen schenkt dir "+this._heirAttrN+" Attributpunkte.","lvl");
    if(this._heirGoldN)UI.log("Der Erbbeutel enthält "+fmt(this._heirGoldN)+" Gold.","gold");
    this.autoEquipBest();
    UI.renderAll();
    SFX.init();
  }
  autoEquipBest(){
    for(let i=this.hero.bag.length-1;i>=0;i--){
      const it=this.hero.bag[i];
      if(!this.hero.equip[it.slot]){this.hero.equip[it.slot]=it;this.hero.bag.splice(i,1);}
    }
    this.hero.recompute();
  }
  /* ---------- Haupt-Loop ---------- */
  frame(t){
    let dt=(t-this.last)/1000;this.last=t;
    dt=Math.min(dt,.05);
    if(this.hitStop>0){this.hitStop-=dt;dt*=.25;}
    this.update(dt);this.render();
    requestAnimationFrame(t2=>this.frame(t2));
  }
  update(dt){
    this.time+=dt;
    // Zeitplan für inszenierte Abläufe (Ultimates): läuft mit der Spielzeit
    if(this.tq&&this.tq.length)for(let i=this.tq.length-1;i>=0;i--){
      if(this.time>=this.tq[i].at){const fn=this.tq[i].fn;this.tq.splice(i,1);fn();}
    }
    if(this.ultFx){this.ultFx.t+=dt;if(this.ultFx.t>=this.ultFx.max)this.ultFx=null;}
    if(this.heroAnim)this.stepHeroAnim(dt);
    this.dayT=(this.dayT+dt/180)%1;               // voller Tageszyklus = 3 Minuten
    this.weatherT-=dt;
    if(this.weatherT<=0){this.weatherT=rnd(45,95);
      const r=Math.random();
      const inside=this.biome&&this.biome.indoor;
      const nw=inside?(r<.5?"clear":"fog"):(r<.55?"clear":r<.8?"rain":r<.93?"snow":"fog");
      if(nw!==this.weather){this.weather=nw;
        if(this.hero)UI.log(inside?
          {clear:"Die Luft wird klarer.",fog:"Modriger Dunst zieht durch die Gänge."}[nw]:
          {clear:"Der Himmel klart auf.",rain:"Regen zieht auf.",snow:"Schnee beginnt zu fallen.",
           fog:"Dichter Nebel legt sich über das Land."}[nw],"sys");}
    }
    if(this.blend<1){this.blend=Math.min(1,this.blend+dt/12.8);  // Biom-Überblendung, bewusst gemächlich
      if(this.blend>=1)this.prevBiome=null;}
    this.parts.update(dt);this.fct.update(dt);this.spells.update(dt);
    if(this.shake>0){this.shake-=dt;if(this.shake<0)this.shake=0;}
    if(this.lootGlow>0)this.lootGlow-=dt;
    if(this.flash&&this.flash.t>0)this.flash.t-=dt;
    if(this.boonPulse>0)this.boonPulse-=dt*1.6;
    for(let i=this.drops.length-1;i>=0;i--){const d=this.drops[i];d.life-=dt;d.y+=d.vy*dt;d.vy+=260*dt;
      if(d.y>GROUND){d.y=GROUND;d.vy=0;}if(d.life<=0)this.drops.splice(i,1);}
    if(!this.hero||this.state==="dead"||this.state==="idle")return;

    const h=this.hero;
    // Statuseffekte
    if(h.status.poison>0){h.status.poison-=dt;h.poisonTick=(h.poisonTick||0)+dt;
      if(h.poisonTick>=1){h.poisonTick=0;this.damageHero(h.status.poisonDmg,"Gift",true);} }
    if(h.status.slow>0){h.status.slow-=dt;if(h.status.slow<=0)h.recompute();}
    // Regeneration (Unique / Trank-Automatik)
    if(h.hasUniq("regen")){h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.01*dt);
      // Ewige Flamme: kleine Flammen züngeln am Helden
      if(Math.random()<.18)this.parts.add(122+rnd(-8,8),GROUND-rnd(6,40),1,{dir:-Math.PI/2,spread:.3,
        spdMin:10,spdMax:30,lifeMin:.3,lifeMax:.6,col:pick(["#ffd166","#ff7a2b"]),size:1,g:-30,glow:1});}
    if(h.regen)h.hp=Math.min(h.maxHp,h.hp+h.maxHp*h.regen/100*dt);
    if(this.mountCd>0)this.mountCd-=dt;
    if(this.rideT>0){                        // Ritt: der Boden fliegt vorbei
      this.rideT-=dt;
      this.scroll+=520*dt;h.anim+=dt*22;
      if(this.rideT<=0)UI.renderAll();
    }
    if(h.boons.length){                      // Segen laufen ab
      let changed=false;
      for(let i=h.boons.length-1;i>=0;i--){
        h.boons[i].t-=dt;
        if(h.boons[i].t<=0){
          UI.log(h.boons[i].n+" ist verklungen.","sys");
          h.boons.splice(i,1);changed=true;
        }
      }
      if(changed){h.recompute();UI.renderAll();}
    }
    if(h.hp/h.maxHp<.32&&h.potions>0&&this.state==="fight")this.usePotion();
    if(h.ultCd>0)h.ultCd=Math.max(0,h.ultCd-dt);
    if(h.ultShieldT>0){h.ultShieldT-=dt;if(h.ultShieldT<=0){h.ultShield=0;UI.log("Der Heilige Schild verblasst.","sys");}
      else if(h.ultShieldRegen)h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.02*dt);}

    if(this.state==="walk"){
      const spd=52;
      this.scroll+=spd*dt;this.dist+=spd*dt;
      this.updateProps(dt,spd);
      this.totalDist+=spd*dt;                        // zurückgelegte Wegstrecke
      h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.017*dt);   // Erholung zwischen den Kämpfen
      h.anim+=dt*9;
      if(this.dist>=this.nextEncounter)this.spawnEnemy();
    }else if(this.state==="approach"){
      if(this.intro){                        // Auftritt läuft: niemand bewegt sich
        this.intro.t-=dt;
        const k=1-this.intro.t/this.intro.max;
        const e=this.intro.foe;
        if(Math.random()<.55)
          this.parts.add(e.x+rnd(-26,26),GROUND,1,{dir:-Math.PI/2,spread:.5,
            spdMin:30,spdMax:110,lifeMin:.6,lifeMax:1.4,
            col:this.intro.boss?"#ff7ad9":"#ffb347",size:2,g:-40,glow:1});
        if(this.intro.t<=0){
          this.intro=null;
          this.doShake(.35,4);
        }
        return;
      }
      h.anim+=dt*6;
      let allIn=true;
      for(const e of this.enemies){
        if(e.x>e.tx){e.x=Math.max(e.tx,e.x-135*dt);}
        if(e.x>e.tx)allIn=false;
      }
      if(allIn){this.state="fight";this.firstHit=true;h.atkTimer=.35;updateMusic();}
    }else if(this.state==="fight"){
      h.anim+=dt*3;
      h.atkTimer-=dt*h.atkPerSec;
      if(h.atkTimer<=0){h.atkTimer=1;this.heroAttack();}
      for(const e of this.enemies){
        if(e.dead)continue;
        // Boss-Enrage ab 30% Leben
        if(e.boss&&!e.enraged&&e.hpPct<=.3){
          e.enraged=true;e.atkPerSec*=1.7;e.dmg=Math.round(e.dmg*1.25);
          this.doShake(.5,7);SFX.boss();
          UI.log(e.name+" gerät in Raserei!","boss");
          this.fct.add(e.x,GROUND-e.ph-12,"RASEREI!","crit");
          this.parts.ring(e.x,GROUND-30,"#ff4444");
        }
        e.atkTimer-=dt*e.atkPerSec;
        if(e.atkTimer<=0){
          if(e.act)e.atkTimer=.05;              // erst die laufende Animation beenden
          else{e.atkTimer=1;this.enemyAttack(e);}
        }
      }
    }else if(this.state==="victory"){
      this.vicT-=dt;
      if(this.vicT<=0){
        // Lief Kampfmusik, kehrt sie hier zur Umgebung zurück
        const wasBattle=MUSIC.current==="steel"||MUSIC.current==="reckoning";
        this.state="walk";this.enemy=null;this.enemies=[];
        this.dist=0;this.nextEncounter=rnd(80,150);
        if(--this.biomeLeft<=0)this.changeBiome();
        if(wasBattle)updateMusic();
      }
    }
    if(h.flash>0)h.flash-=dt;

      at(.5,()=>{this.spells.flare(ex-e.pw*.35,ey,"#a24bff",14,.25);SFX.drain();
        shoot({col:"#a24bff",core:"#e0c6ff",r:3.2,spd:240,trail:"dark",arc:8},{col:"#a24bff"});});
    }else if(st==="frost"){
      at(.45,()=>{this.spells.flare(ex-e.pw*.35,ey,"#9fd8ff",12,.2);SFX.frost();
        shoot({shape:"shard",col:"#9fd8ff",core:"#ffffff",spd:390,trail:null},{col:"#cfeaff"});});
    }else if(st==="orb"){
      if(k<.5&&Math.random()<.6)this.parts.add(ex,ey-6,1,{spdMin:5,spdMax:25,lifeMin:.2,lifeMax:.5,col:a.col,size:2,g:-20,glow:1});
      at(.5,()=>{SFX.whoosh();shoot({col:a.col,core:"#ffffff",r:4,spd:250,trail:"glow",arc:12},{col:a.col});});
    }else if(st==="stars"){
      for(const w of [.35,.5,.65])at(w,()=>{SFX.zap();
        const o={shape:"star",col:"#fff3b0",core:"#ffffff",spd:320+w*120,trail:"glow"};
        if(w===.35)shoot(o,{col:"#fff3b0"});
        else this.spells.shot(ex-e.pw*.35,ey+rnd(-8,8),{x:HX,y:HY+rnd(-10,10)},o);});
    }else if(st==="laser"){
      const lc=e.model==="alien"?"#7cff6b":"#ff3b6b";
      if(k<.6&&Math.random()<.9){const r=rnd(10,22),an=rnd(0,7);
        this.parts.add(ex-e.pw*.2+Math.cos(an)*r,ey+Math.sin(an)*r,1,{dir:an+Math.PI,spread:.1,spdMin:30,spdMax:50,
          lifeMin:.2,lifeMax:.4,col:lc,size:1,g:0,glow:1});}
      at(.6,()=>{this.spells.beam(ex-e.pw*.2,ey,HX,HY,lc,.3,e.boss?1.8:1);this.spells.flare(HX,HY,lc,18,.25);
        SFX.zap();hit({col:lc});});
    }else if(st==="breath"){
      const bc=e.model==="boss4"?["#7cd66a","#c6ff8a","#2f6b2a"]:["#ffd166","#ff7a2b","#ff4d1a"];
      if(k>.25&&k<.8){const an=Math.atan2(HY-ey,HX-(ex-e.pw*.35));
        this.parts.add(ex-e.pw*.35,ey,5,{dir:an,spread:.2,spdMin:190,spdMax:260,lifeMin:.5,lifeMax:.75,
          col:()=>pick(bc),size:3,g:-20,glow:1});}
      at(.25,()=>SFX.meteor());
      at(.5,()=>hit({col:bc[1]}));
    }else if(st==="roots"){
      at(.25,()=>{this.spells.roots(HX+2,"#c6ff8a",.6);this.doShake(.1,1.5);SFX.venom();});
      at(.45,()=>hit({col:"#7cd66a"}));
    }else if(st==="tentacle"){
      at(.2,()=>{this.spells.tentacle(HX+4,"#6b3a8a",.62);SFX.drain();});
      at(.5,()=>{this.doShake(.15,2.5);hit({col:"#8a4fff"});});
    }else if(st==="quake"){
      e.oy=k<.25?-Math.sin(Math.PI*k/.25)*(e.boss?14:9):0;
      at(.25,()=>{this.doShake(.25,e.boss?5:3);SFX.boom();
        this.spells.quake(ex-e.pw*.3,HX+8,"#c9b48a",.45,()=>hit({col:"#b8a888"}));});
    }else if(st==="wail"){
      e.ox=k<.3?a.dx*.35*ease(k/.3):k<.6?a.dx*.35:a.dx*.35*(1-ease((k-.6)/.4));
      at(.3,()=>{SFX.wail();this.spells.wave(ex-14,HX+10,HY-4,"#cfd6ff",.4,()=>hit({col:"#cfd6ff"}));});
    }
    if(a.t>=a.dur){e.act=null;e.ox=0;e.oy=0;}
  }
  /** Der eigentliche Treffer — erst wenn die Animation den Helden erreicht */
  enemyStrike(e,fx){
    const h=this.hero;if(!e||e.dead||!h||this.state==="dead")return;
    this._hitFx=fx;
    let dmg=rnd(e.dmg*.82,e.dmg*1.2);
    if(e.affix&&e.affix.k==="cursed")dmg*=1.15;
    const crit=Math.random()<(e.boss?.16:.08);
    if(crit)dmg*=1.7;
    // Rüstungsmitigation
    const mit=h.armor/(h.armor+45+22*h.level);
    dmg=Math.max(1,Math.round(dmg*(1-mit)));
    dmg*=1-h.dmgRed/100;
    const blocked=Math.random()*100<h.blockChance;
    if(blocked){dmg=Math.round(dmg*.3);this.parts.sparks(126,GROUND-40);SFX.block();}
    this.damageHero(dmg,e.name,false,crit,blocked,e);
    if(e.boss){this.doShake(crit?.42:.22,crit?6.5:3.4);}
    else if(crit)this.doShake(.16,2.6);
    // Affix-Effekte des Gegners
    if(e.affix){
      const k=e.affix.k;
      if(k==="poison"){h.status.poison=5;h.status.poisonDmg=Math.max(1,Math.round(e.dmg*.16));}
      if(k==="frozen"&&h.status.slow<=0){h.status.slow=3.5;h.recompute();
        this.fct.add(120,GROUND-58,"Verlangsamt","block");}
      if(k==="vampiric"){const g=Math.round(dmg*.3);e.hp=Math.min(e.maxHp,e.hp+g);
        this.fct.add(e.x,GROUND-40,"+"+g,"heal");}
      if(k==="burning"){h.status.poison=Math.max(h.status.poison,3);
        h.status.poisonDmg=Math.max(h.status.poisonDmg,Math.round(e.dmg*.12));}
    }
    this._hitFx=null;
    // Dornen
    if(h.thorns>0){const r=Math.max(1,Math.round(dmg*h.thorns/100+h.thorns*.4));
      // Dornen fliegen als grüne Stacheln zurück; Schaden beim Einschlag
      const n=h.hasUniq("thorns")?3:1;
      for(let j=0;j<n;j++)this.spells.shot(128,GROUND-36-j*6,e,{col:"#a3d977",core:"#efffd0",r:1.4,
        spd:420,trail:"thorn",onHit:j?null:()=>this.spellHit(e,r,"dmg")});}
  }
  damageHero(dmg,src,silent,crit,blocked,foe){
    const h=this.hero;
    if(foe)this.lastFoe=foe;
    this.lastCause=src;
    if(h.ultShield>0&&dmg>0){                // Heiliger Schild schluckt zuerst
      const take=Math.min(h.ultShield,dmg);h.ultShield-=take;dmg-=take;
      this.parts.add(122,GROUND-40,6,{spdMin:30,spdMax:90,lifeMin:.2,lifeMax:.4,col:"#ffd166",size:2,g:0,glow:1});
      if(dmg<=0){this.fct.add(118,GROUND-56,"Schild","block");this._hitFx=null;return;}
      if(h.ultShield<=0){h.ultShieldT=0;this.fct.add(118,GROUND-70,"Schild bricht","block");}
    }
    h.hp-=dmg;h.flash=.09;
    const hf=this._hitFx;this._hitFx=null;
    if(hf&&hf.col&&!hf.blood)this.parts.add(122,GROUND-42,12,{spdMin:30,spdMax:120,lifeMin:.2,lifeMax:.5,
      col:()=>pick([hf.col,"#ffffff"]),size:2,g:60,glow:1});
    else this.parts.blood(122,GROUND-42,Math.PI*.85+rnd(-.4,.4));
    this.fct.add(118+rnd(-6,6),GROUND-50,"-"+dmg,crit?"crit":"bad");
    if(!silent&&!blocked)SFX.hurt();
    if(!silent&&Math.random()<.5)UI.log(src+" trifft für "+dmg+(crit?" (kritisch!)":"")+".","dmg");
    if(silent)UI.log("Gift verursacht "+dmg+" Schaden.","dmg");
    if(h.hp<=0){h.hp=0;this.heroDies();}
  }
  usePotion(){
    const h=this.hero;if(h.potions<=0)return;
    h.potions--;
    const heal=Math.round(h.maxHp*(.35+(this.meta.potion||0)*.07)*(1+h.potionPower/100));
    h.hp=Math.min(h.maxHp,h.hp+heal);
    this.fct.add(120,GROUND-58,"+"+heal,"heal");
    this.parts.puff(120,GROUND-40,"#5ce08a");
    UI.log("Trank getrunken: +"+heal+" Leben ("+h.potions+" übrig).","heal");
    SFX.loot();UI.renderAll();
  }
  killEnemy(e){
    const h=this.hero;
    if(!e||e.dead)return;
    e.dead=true;
    const cx=e.x,cy=GROUND-e.ph*.5;
    if(e.affix&&e.affix.k==="explosive"&&this.state!=="dead"){
      // Berstender: Druckwelle trifft den Helden
      const d=Math.max(1,Math.round(e.dmg*1.2*(1-h.dmgRed/100)));
      this.spells.flare(cx,cy,"#ff5b1a",56,.45);
      this.spells.nova(cx,GROUND,"#ff7a2b",160);
      this.parts.add(cx,cy,34,{spdMin:60,spdMax:240,lifeMin:.3,lifeMax:.8,
        col:()=>pick(["#ffd166","#ff5b1a","#3a2a22"]),size:3,g:300,glow:1});
      this.doShake(.4,5);SFX.boom();
      setTimeout(()=>{if(this.hero&&this.state!=="dead")this.damageHero(d,"Explosion",false,false,false,e);},120);
    }
    this.parts.add(cx,cy,e.boss?70:26,{spdMin:40,spdMax:e.boss?260:150,lifeMin:.4,lifeMax:1.1,
      col:()=>pick([e.pal[2],e.pal[3],e.pal[6],"#ffffff"]),size:2,g:280,glow:1});
    if(e.boss){this.doShake(.7,8);SFX.boss();}
    h.kills++;this.stats.kills++;
    h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.04);
    // Belohnungen
    const gold=Math.round(e.gold*(1+h.gf/100)*(h.hasUniq("gold")?2:1));
    h.gold+=gold;
    const xp=Math.round(e.xp*(1+h.xpBonus/100));
    h.xp+=xp;
    this.fct.add(cx,cy-14,"+"+gold+" G","gold");
    this.fct.add(cx,cy-26,"+"+xp+" XP","xp");
    UI.log(e.name+" fällt. +"+gold+" Gold, +"+xp+" Erfahrung.","gold");
    if(h.sk.killheal){const heal=Math.round(h.maxHp*h.sk.killheal/100);
      h.hp=Math.min(h.maxHp,h.hp+heal);this.fct.add(120,GROUND-58,"+"+heal,"heal");}
    // Seelensplitter
    let sh=0;                                   // Splitter fallen achtmal seltener als früher
    if(e.boss)sh=1+Math.floor(h.level/16);
    else if(e.mini&&Math.random()<.35)sh=1;
    else if(e.affix&&e.affix.k==="golden"&&Math.random()<.25)sh=1;
    else if(Math.random()<.0075*(1+(h.sk.shard||0)/100))sh=1;
    if(sh){
      sh=Math.round(sh*(1+(this.meta.shard||0)*.12));h.shardsRun+=sh;
      this.fct.add(cx,cy-38,"+"+sh+" \u2726","loot");
      this.parts.ring(cx,cy-20,"#7ef0d0");
      SFX.loot();
      UI.log("+"+sh+" Seelensplitter \u2014 dieser Lauf: "+h.shardsRun+".","loot");
    }
    // Loot
    const chance=e.boss?1:e.mini?.85:clamp(.24+h.mf/500,0,.6);
    if(Math.random()<chance){
      const n=e.boss?3:1;
      for(let i=0;i<n;i++){
        const it=makeItem(h.level,null,e.boss&&i===0?(Math.random()<.12?3:2):null,h.mf);
        this.dropItem(it,cx+rnd(-20,20));
      }
    }
    if(Math.random()<(e.boss?.15:.017))this.dropGem(cx);
    // Runen und Zauber: so selten wie das Beste, das die Welt hergibt
    if(h.level>=4&&Math.random()<(e.boss?.05:.0013)*(1+h.mf/100)){
      const rn=makeRune(h.level);
      h.bag.push(rn);rn.isNew=true;
      this.parts.ring(cx,GROUND-50,"#ffd166");
      this.fct.add(cx,GROUND-92,rn.name,"crit");
      this.doShake(.3,3);SFX.levelup();
      UI.log("Eine Rune fällt: "+rn.name+" \u2014 "+rn.uniqTxt,"loot");
    }   // Seelensteine sind selten
    if(Math.random()<.14){h.potions++;UI.log("Ein Heiltrank gefunden.","loot");}
    if(e.boss){
      h.bossKills++;this.stats.bosses++;
      // Weltenbosse werden auf dem Weg vermerkt — Minibosse ausdrücklich nicht
      this.bossMarks.push({d:Math.round(this.totalDist),n:e.name,lvl:e.level,zone:this.zone});
      if(!h.mount)this.grantMount();          // der erste Boss bringt das Reittier
      this.zone++;this.stats.bestZone=Math.max(this.stats.bestZone,this.zone);
      this.changeBiome(true);
      UI.log("Zone "+this.zone+" erreicht. Die Gegner werden stärker.","lvl");}
    this.checkLevel();
    // Sieg erst, wenn die gesamte Gruppe gefallen ist
    if(!this.target()){
      this.state="victory";this.vicT=e.boss?1.3:.55;
    }else{
      this.enemy=this.target();
      UI.log("Noch "+this.enemies.filter(x=>!x.dead).length+" Gegner übrig.","sys");
    }
    UI.renderAll();
  }
  dropItem(it,x){
    const h=this.hero;
    const eqNow=h.equip[it.slot];
    if(it.rar===0&&eqNow&&itemScore(it)<=itemScore(eqNow)){
      const g=Math.round(itemScore(it)*.4+it.lvl*2);
      h.gold+=g;
      this.fct.add(x,GROUND-72,"+"+g+" G","gold");
      UI.log("Verwertet: "+it.name+" \u2192 "+g+" Gold.","sys");
      SFX.loot();return;
    }
    h.bag.push(it);
    this.trimBag();
    this.drops.push({x,y:GROUND-60,vy:-90,life:1.6,col:RARITY[it.rar].hex});
    this.parts.add(x,GROUND-50,10,{spdMin:20,spdMax:80,lifeMin:.3,lifeMax:.7,col:RARITY[it.rar].hex,size:2,g:180,glow:1});
    this.fct.add(x,GROUND-72,it.name,"loot");
    this.lootGlow=.5;SFX.loot();
    UI.log("Beute: "+it.name+" ("+RARITY[it.rar].n+")","loot");
    // Der Spieler entscheidet selbst — außer die Automatik ist eingeschaltet
    it.isNew=true;
    const cur=h.equip[it.slot];
    const better=!cur||itemScore(it)>itemScore(cur);
    if(better)UI.log("\u25B2 Stärker als das angelegte Teil — im Inventar vergleichen.","loot");
    if(this.autoEquip&&better)UI.equipItem(h.bag.indexOf(it),true);
  }
  /** Hält den Beutel überschaubar: schwächste graue/blaue Beute wird verkauft */
  trimBag(){
    const h=this.hero;
    if(h.bag.length<=42)return;
    const worse=it=>{const eq=h.equip[it.slot];return eq&&itemScore(it)<itemScore(eq)*.75;};
    const junk=h.bag.map(it=>it).filter(it=>it.rar<=1||(it.rar===2&&worse(it)))
      .sort((a,b)=>itemScore(a)-itemScore(b));
    let sold=0,gold=0;
    while(h.bag.length>36&&junk.length){
      const it=junk.shift();const idx=h.bag.indexOf(it);
      if(idx<0)continue;
      gold+=Math.round(itemScore(it)*.5+it.lvl*2);
      h.bag.splice(idx,1);sold++;
    }
    if(sold){h.gold+=gold;UI.log("Der Beutel ist voll: "+sold+" schwache Fundstücke für "+gold+" Gold verkauft.","gold");}
  }
  dropGem(x){
    const g=pick(GEMS),q=rollGemQuality(this.hero.level);
    const id=gemId(g.k,q),P=parseGem(id);
    this.hero.gems.push(id);
    this.fct.add(x,GROUND-86,P.name,"loot");
    this.parts.puff(x,GROUND-50,P.Q.col);
    if(q>=7){this.parts.ring(x,GROUND-50,P.Q.col);SFX.levelup();}
    UI.log("Edelstein gefunden: "+P.name+" ("+P.txt+").","loot");
  }
  checkLevel(){
    const h=this.hero;let leveled=false;
    while(h.xp>=h.xpNeeded()){
      h.xp-=h.xpNeeded();h.level++;h.skillPts++;h.attrPts+=4;leveled=true;
      // Keine automatischen Attribute mehr — der Spieler verteilt selbst
      h.recompute();h.hp=h.maxHp;
      UI.log("Du hast 4 Attributpunkte und 1 Fähigkeitspunkt zu vergeben.","lvl");
      this.stats.bestLevel=Math.max(this.stats.bestLevel,h.level);
      UI.log("STUFE "+h.level+" erreicht! Voll geheilt, +1 Fähigkeitspunkt.","lvl");
      this.parts.confetti(120,GROUND-50);
      this.fct.add(120,GROUND-80,"STUFE "+h.level,"crit");
      if(h.level%10===0){this.bossPending=true;
        UI.log("Etwas Gewaltiges erwacht weiter vorn ...","boss");}
    }
    if(leveled){SFX.levelup();this.doShake(.25,2);}
  }
  heroDies(){
    const h=this.hero;
    // Letztes Bild und Todesursache festhalten, bevor die Oberfläche übernimmt
    const foe=this.lastFoe;
    this.deathInfo={
      cause:this.lastCause||"unbekannte Ursache",
      kind:foe?(foe.boss?"Weltenboss":foe.mini?"Miniboss":(this.enemies.filter(x=>!x.dead).length>1?"Gruppe":"Gegner")):"Zustand",
      lvl:foe?foe.level:h.level,
      count:this.enemies.filter(x=>!x.dead).length
    };
    // Der Töter wird separat gemerkt, damit er auch dann zu sehen ist,
    // wenn die Bildkopie am Browser scheitert.
    this.deathFoe=foe?{model:foe.model,hue:foe.hue,boss:!!foe.boss,mini:!!foe.mini,
      name:foe.name,level:foe.level,affix:foe.affix?foe.affix.d:null,
      hpMax:foe.maxHp,dmg:foe.dmg}:null;
    this.render();
    this.grabFrame();
    this.state="dead";
    MUSIC.stop();
    this.parts.add(120,GROUND-40,60,{spdMin:30,spdMax:200,lifeMin:.6,lifeMax:1.4,
      col:()=>pick(["#ff5566","#8d0801","#ffffff"]),size:2,g:300});
    this.doShake(.8,7);SFX.death();
    UI.log(h.name+" ist gefallen. Der Run endet auf Stufe "+h.level+".","bad");
    // Ort des Todes für die Chronik festhalten
    // Ein Viertel der selbst verteilten Attributpunkte überdauert den Tod
    this.heirAttr={};
    let carried=0;
    for(const k in h.alloc){
      const v=Math.floor(h.alloc[k]*.25);
      this.heirAttr[k]=v;carried+=v;
    }
    this._carried=carried;
    this.graves.push({
      name:h.name,race:h.race,cls:h.cls,look:h.look||0,tint:h.tint||0,
      level:h.level,zone:this.zone,
      biome:this.biome?this.biome.n:"",bk:h.bossKills,kills:h.kills,
      bosses:this.bossMarks.slice(),
      dist:Math.round(this.totalDist),run:this.stats.runs+1,
      t:Date.now(),
      cause:this.deathInfo?this.deathInfo.kind+": "+this.deathInfo.cause:"",
      str:h.str|0,dex:h.dex|0,int:h.int|0,vit:h.vit|0,
      dps:h.dps|0,armor:h.armor|0,maxHp:h.maxHp|0,shards:h.shardsRun|0,
      relic:null,active:false
    });
    if(this.graves.length>40)this.graves.shift();
    const bonus=Math.round((h.level*2+this.zone*4+h.bossKills*5)*(1+(this.meta.shard||0)*.12));
    const total=h.shardsRun+bonus;
    this.shards+=total;
    this.stats.runs++;
    this.stats.bestLevel=Math.max(this.stats.bestLevel,h.level);
    this.save();
    setTimeout(()=>UI.showDeath(total,bonus),1200);
  }
  /** Friert das aktuelle Bild in einem eigenen Canvas ein.
      Kopiert wird das Canvas selbst statt über toDataURL — sobald Grafiken aus
      dem assets-Ordner geladen sind, verweigert der Browser das Auslesen. */
  grabFrame(){
    try{
      const cv=document.createElement("canvas");
      cv.width=this.cv.width;cv.height=this.cv.height;
      const dctx=cv.getContext("2d");
      dctx.imageSmoothingEnabled=false;
      dctx.drawImage(this.cv,0,0);
      this.deathCv=cv;this.deathShot=true;
      return true;
    }catch(e){this.deathShot=false;return false;}
  }
  /* ---------- Rendering ---------- */
  render(){
    const c=this.ctx;
    c.setTransform(this.res,0,0,this.res,0,0);
    c.imageSmoothingEnabled=false;
    c.save();
    if(this.shake>0){
      const m=this.shakeMag*(this.shake);
      c.translate(Math.round(rnd(-m,m)),Math.round(rnd(-m,m)));
    }
    this.drawWorld(c);
    this.drawProps(c);
    this.drawDrops(c);
    this.drawUltShade(c);
    if(this.hero&&this.state!=="idle"){
      if(this.heroFade<1){
        // Schattengestalt: Held in eigenes Bild, dann halbtransparent einsetzen
        if(!this._fadeCv){this._fadeCv=document.createElement("canvas");}
        const fc=this._fadeCv;fc.width=this.cv.width;fc.height=this.cv.height;
        const fx=fc.getContext("2d");fx.setTransform(this.res,0,0,this.res,0,0);fx.imageSmoothingEnabled=false;
        this.drawHero(fx);
        c.save();c.setTransform(1,0,0,1,0,0);
        // Schattengestalt: dunkler Körper mit farbigem Schimmer in der Pfadfarbe
        if(CAN_FILTER){c.globalAlpha=.55;c.filter="blur(3px)";c.globalCompositeOperation="lighter";
          c.drawImage(fc,0,0);c.globalCompositeOperation="source-over";}
        c.globalAlpha=.75;c.filter=CAN_FILTER?"brightness(.25) saturate(.3)":"none";
        c.drawImage(fc,0,0);c.filter="none";c.restore();
        c.setTransform(this.res,0,0,this.res,0,0);
      }else this.drawHero(c);
    }
    this.drawUltDome(c);
    this.drawEnemies(c);
    this.spells.draw(c);
    this.parts.draw(c);
    this.drawWeather(c);
    this.drawNightTint(c);
    this.fct.draw(c);
    this.drawIntro(c);
    this.drawUltBanner(c);

  /** Zeichnet Himmel, Parallax und Boden — bei einem Ortswechsel zwei Welten übereinander */

  skyColors(){

    const kf=[
      {t:0.00,a:[16,14,34],b:[38,28,64]},   // Nacht
      {t:0.22,a:[92,58,96],b:[236,140,110]},// Morgenrot
      {t:0.35,a:[70,132,196],b:[168,214,240]},// Tag
      {t:0.62,a:[70,132,196],b:[168,214,240]},// Tag
      {t:0.78,a:[128,66,110],b:[248,150,86]}, // Abendrot
      {t:0.92,a:[24,18,44],b:[52,36,80]},   // Dämmerung
      {t:1.00,a:[16,14,34],b:[38,28,64]}
    ];
    let i=0;while(i<kf.length-2&&this.dayT>kf[i+1].t)i++;
    const k=clamp((this.dayT-kf[i].t)/(kf[i+1].t-kf[i].t),0,1);
    return {a:lerpCol(kf[i].a,kf[i+1].a,k),b:lerpCol(kf[i].b,kf[i+1].b,k)};

  isNight(){return this.dayT<.16||this.dayT>.86;}
  /** Innenräume bekommen statt Himmel eine Mauer-, Gewölbe- oder Lavawand */
  drawIndoorBack(c,b){

    if(b.lava){g.addColorStop(0,"#1a0806");g.addColorStop(.55,"#3d0f08");g.addColorStop(1,"#7a1c0a");}
    else{g.addColorStop(0,hsl(b.hue,b.gs,7));g.addColorStop(1,hsl(b.hue,b.gs,15));}
    c.fillStyle=g;c.fillRect(0,0,W,GROUND+2);

      c.fillStyle="rgba(255,120,30,.5)";
      for(let x=0;x<W;x+=6){
        const hh=5+Math.sin(this.time*2+x*.09)*3;
        c.fillRect(x,y-hh,6,hh+8);
      }
      c.fillStyle="rgba(255,214,120,.35)";c.fillRect(0,y+4,W,3);
    }else{

      const off=(this.scroll*.12)%40;
      c.strokeStyle="rgba(255,255,255,.05)";c.lineWidth=1;
      for(let y=8;y<GROUND;y+=18){
        c.beginPath();c.moveTo(0,y+.5);c.lineTo(W,y+.5);c.stroke();

  /** Schachbrett-Muster als Canvas-Pattern — ein Füllbefehl statt tausender Pixel */
  ditherPat(col,step){
    this._dp=this._dp||{};

    if(this._dp[key])return this._dp[key];
    if(Object.keys(this._dp).length>80)this._dp={};
    const cv=document.createElement("canvas");
    cv.width=step;cv.height=step;
    const x=cv.getContext("2d");
    x.fillStyle=col;
    x.fillRect(0,0,1,1);
    if(step>2)x.fillRect(Math.floor(step/2),Math.floor(step/2),1,1);
    const pat=this.ctx.createPattern(cv,"repeat");

    for(const b of bands){
      c.fillStyle=this.ditherPat(col,b[2]);
      c.fillRect(0,y0+h*b[0],W,h*(b[1]-b[0])+1);
    }

  drawClouds(c,lo,layers){

      for(const m of L.r){
        const x=m.x-off+r*W;

        c.fillStyle="rgba(255,255,255,"+(lo?.10:.20)+")";
        c.beginPath();
        c.ellipse(x+drift,m.y,m.w*.5,m.h*.5,0,0,7);
        c.ellipse(x+drift-m.w*.26,m.y+m.h*.18,m.w*.28,m.h*.36,0,0,7);
        c.ellipse(x+drift+m.w*.28,m.y+m.h*.14,m.w*.3,m.h*.4,0,0,7);
        c.fill();
        c.fillStyle="rgba(255,255,255,"+(lo?.06:.14)+")";
        c.beginPath();c.ellipse(x+drift+m.w*.1,m.y-m.h*.26,m.w*.32,m.h*.3,0,0,7);c.fill();

  drawSky(c,b){
    b=b||this.biome;
    if(b&&b.indoor){this.drawIndoorBack(c,b);return;}
    const s=this.skyColors();
    const g=c.createLinearGradient(0,0,0,GROUND);
    g.addColorStop(0,rgb(s.a));g.addColorStop(1,rgb(s.b));
    c.fillStyle=g;c.fillRect(0,0,W,GROUND+2);
    // Sterne bei Nacht
    const night=clamp((this.dayT<.5?(.18-this.dayT)/.18:(this.dayT-.82)/.18),0,1);
    if(night>0){
      c.globalAlpha=night*.9;

        const x=(i*97)%W,y=(i*53)%110;

  drawParallax(c,b,layers){

      const off=(this.scroll*speed)%W;

          const x=m.x-off+r*W;

  drawGround(c,b){

        c.fillRect(x,yy,3,1.5);
      }
    }
    // Pflasterfugen in Stadt, Schloss und Verlies
    if(b.k==="stadt"||b.k==="schloss"||b.indoor){
      const off=this.scroll%28;
      c.strokeStyle="rgba(0,0,0,.22)";c.lineWidth=1;
      for(let x=-off;x<W;x+=28){c.beginPath();c.moveTo(x+.5,GROUND+4);c.lineTo(x+.5-10,H);c.stroke();}
      for(let y=GROUND+14;y<H;y+=16){c.beginPath();c.moveTo(0,y+.5);c.lineTo(W,y+.5);c.stroke();}
    }
    // Lavaspalten im Höllenschlund
    if(b.lava){
      const off=this.scroll%90;
      for(let i=-1;i<6;i++){
        const x=i*90-off;
        c.save();c.shadowBlur=9;c.shadowColor="#ff6a1a";
        c.fillStyle="rgba(255,110,26,.75)";
        c.fillRect(x,GROUND+18+((i*13)%30),34,3);
        c.restore();
      }
    }
    // Bodenkante mit ausdünnendem Dithering (Tiefenwirkung)
    this.dither(c,GROUND+5,GROUND+19,night?hsl(b.hue,b.gs*.7,b.gl-13):hsl(b.hue,b.gs,b.gl-6));
    // Ausgetretener Pfad, auf dem der Held läuft
    if(!b.indoor&&b.k!=="meer"){
      c.fillStyle=night?hsl(b.hue-8,b.gs*.6,b.gl-2):hsl(b.hue-8,b.gs*.7,b.gl+9);
      c.fillRect(0,GROUND+24,W,26);
      this.dither(c,GROUND+18,GROUND+26,night?hsl(b.hue-8,b.gs*.6,b.gl-2):hsl(b.hue-8,b.gs*.7,b.gl+9));
      c.fillStyle="rgba(0,0,0,.10)";c.fillRect(0,GROUND+48,W,3);
      const po=this.scroll%46;                       // Wagenspuren
      c.fillStyle=night?"rgba(255,255,255,.05)":"rgba(0,0,0,.13)";
      for(let x=-po;x<W;x+=46){c.fillRect(x,GROUND+30,26,1.5);c.fillRect(x+12,GROUND+42,26,1.5);}
    }
    // Kiesel, Grasbüschel und Wegspuren
    const off=this.scroll%W;
    for(let i=0;i<110;i++){
      const x=((((i*37)%W)-off)%W+W)%W;
      const y=GROUND+9+((i*19)%54);
      const kind=i%5;
      if(kind===0&&!b.indoor&&b.k!=="meer"){
        // Grasbüschel mit Lichtkante
        c.fillStyle=night?hsl(b.hue,b.gs,b.gl+4):hsl(b.hue,b.gs+10,b.gl+12);
        c.fillRect(x,y-2,1,3);c.fillRect(x+1,y-3,1,4);c.fillRect(x+2,y-1,1,2);
      }else if(kind===1){
        // Kiesel mit Glanzpunkt
        c.fillStyle=night?"rgba(255,255,255,.07)":"rgba(0,0,0,.20)";
        c.fillRect(x,y,2,2);
        c.fillStyle=night?"rgba(255,255,255,.13)":"rgba(255,255,255,.16)";
        c.fillRect(x,y,1,1);
      }else{
        c.fillStyle=night?"rgba(255,255,255,.045)":"rgba(0,0,0,.13)";
        c.fillRect(x,y,(i%4)+1,1);
      }
    }
  }
  /** Fallen, Brunnen und Segenskugeln auf dem Weg */
  drawProps(c){
    for(const p of this.props){
      const sp=SPRITES[p.data.sp];
      if(!sp)continue;
      const sc=p.kind==="boon"?2.4:2.8;
      const u=sc/sp.f;
      const float=p.kind==="boon"?Math.round(Math.sin(this.time*2.6+p.x*.05)*3)-16:0;
      if(p.kind!=="boon"){
        c.globalAlpha=.25;c.fillStyle="#000";
        c.beginPath();c.ellipse(p.x,GROUND+1,sp.w*u*.36,3,0,0,7);c.fill();c.globalAlpha=1;
      }else{
        c.save();c.shadowBlur=10;c.shadowColor=p.data.col;
      }
      drawSprite(c,sp,p.x,GROUND+float,sc,palette(
        p.kind==="trap"?12:p.kind==="boon"?265:180,
        p.kind==="boon"?60:40),false,null,p.hit?.35:1);
      if(p.kind==="boon")c.restore();
      if(!p.hit&&p.x<420&&p.x>0){          // Hinweisschild über dem Objekt
        c.font="700 7px 'Courier New',monospace";c.textAlign="center";
        c.fillStyle="rgba(0,0,0,.6)";
        const w=c.measureText(p.data.n).width+6;
        c.fillRect(p.x-w/2,GROUND-sp.base*u+float-13,w,9);
        c.fillStyle=p.data.col;c.fillText(p.data.n,p.x,GROUND-sp.base*u+float-6);
        c.textAlign="left";
      }
    }
  }
  drawDrops(c){
    for(const d of this.drops){
      c.save();c.shadowBlur=8;c.shadowColor=d.col;c.fillStyle=d.col;
      c.fillRect(d.x-2,d.y-2,4,4);
      c.globalAlpha=.4;c.fillRect(d.x-4,d.y-4,8,8);
      c.restore();
    }
  }
  /* Held: Basiskörper aus Matrix + prozedural gezeichnete Ausrüstung */
  drawHero(c){
    const h=this.hero;
    const look=raceLook(h.race,h.look||0);
    const comboId=HERO_SPRITES[look.key+"_"+h.cls];
    const hasArt=!!ASSETS[comboId];                    // eigene Grafik vorhanden?
    const sp=(hasArt?SPRITES[comboId]:SPRITES[CLASSES[h.cls].sp])||SPRITES.humanoid;
    const sc=3*look.sc;                                  // Zwerge klein, Orks massig
    const bob=this.state==="walk"||this.state==="approach"?Math.round(Math.abs(Math.sin(h.anim))*2):0;
    const lunge=h.lunge>0?Math.round(h.lunge*9):0;
    const x=118+lunge+Math.round(this.heroOx||0);
    const chest=h.equip.chest;
    const hue=(chest?chest.hue:CLASSES[h.cls].hue)+(h.tint||0);
    const pal=palette(hue,55);
    // Schatten
    c.globalAlpha=.28;c.fillStyle="#000";
    c.beginPath();c.ellipse(x,GROUND+1,15*look.sc*(look.wide||1),4,0,0,7);c.fill();c.globalAlpha=1;
    const gy=GROUND-bob-(this.rideT>0?16:0)-Math.round(this.heroOy||0);
    // Umhang zuerst: er gehört hinter den Körper, sonst verdeckt er Rumpf und Nebenhand
    if(h.equip.chest&&h.equip.chest.rar>=1){
      const cp=palette((hue+180)%360,52);
      const sway=Math.sin(h.anim*.9)*2.2+(this.state==="walk"?2.6:0);
      c.fillStyle=cp[4];
      c.beginPath();
      c.moveTo(x-3,gy-30);
      c.quadraticCurveTo(x-10-sway,gy-18,x-7-sway*1.5,gy-2);
      c.lineTo(x+1,gy-4);c.lineTo(x+1,gy-30);
      c.closePath();c.fill();
      c.fillStyle=cp[2];
      c.fillRect(x-4,gy-31,6,3);
    }
    if(look.wide){c.save();c.translate(x,0);c.scale(look.wide,1);c.translate(-x,0);}
    drawSprite(c,sp,x,gy,sc,pal,false,h.flash>0?"#ffffff":null,1,hasArt?ASSET_HUE:hue);
    if(look.wide)c.restore();
    this.drawBoonAura(c,x,gy,h);
    if(this.rideT>0&&h.mount){              // während des Ritts das Tier darunter
      const msp=SPRITES[h.mount.sp];
      if(msp)drawSprite(c,msp,x+4,GROUND,3.4,palette(28,45),false,null,1);
    }
    // Merkmale nur zeichnen, wenn sie nicht schon in der Grafik stecken
    if(!hasArt)drawRaceFeatures(c,look,x,gy-sp.base*(sc/sp.f)+7*look.sc,look.sc,false);
    // Kopfbedeckung wird bewusst nicht gezeichnet: die Klassen-Sprites tragen
    // bereits Helm, Kapuze oder Hut, ein zweiter darüber sah falsch aus.
    // Waffe (Farbe/Form folgt dem ausgerüsteten Item — Paperdoll-Update)
    const w=h.equip.weapon;
    const wy=gy-22;
    const swing=h.lunge>0?h.lunge:0;
    c.save();
    c.translate(x+11,wy+4);
    c.rotate(-.5-swing*1.5);
    if(w){
      const wp=palette(w.hue,RARITY[w.rar].hex==="#b6b2c9"?18:65);
      const glow=RARITY[w.rar].hex;
      // Der Schein wird hinter die Waffe gelegt statt als Canvas-Schatten gesetzt:
      // ein gesetzter shadowBlur wirkt auf jeden folgenden Zeichenbefehl und hat
      // farbige Ausrüstung unsichtbar gemacht.
      if(w.rar>=1)this.rarityGlow(c,0,-9,13+w.rar*3,glow,.16+w.rar*.06);
      const wart=ASSETS[artIdFor(w)];
      if(wart){
        // Eigene Waffengrafik: aufrecht, Griff am unteren Ende
        const hgt=w.wtype==="dagger"?20:w.wtype==="staff"?32:27;
        c.drawImage(wart,-hgt*.28,-hgt+7,hgt*.56,hgt);
      }else if(w.wtype==="staff"){
        c.fillStyle=wp[4];c.fillRect(-1,-16,2,26);
        c.fillStyle=glow;c.fillRect(-3,-21,6,6);
        c.fillStyle=wp[3];c.fillRect(-2,-20,4,4);
      }else if(w.wtype==="axe"){
        c.fillStyle=wp[4];c.fillRect(-1,-14,2,24);
        c.fillStyle=wp[3];c.fillRect(0,-16,8,9);
        c.fillStyle=wp[2];c.fillRect(0,-9,8,3);
      }else if(w.wtype==="bow"){
        c.strokeStyle=wp[3];c.lineWidth=2;
        c.beginPath();c.arc(0,-4,10,-1.2,1.2);c.stroke();
        c.strokeStyle="#e8e5f6";c.lineWidth=1;
        c.beginPath();c.moveTo(3.6,-13);c.lineTo(3.6,5);c.stroke();
      }else{ // Schwert oder Dolch: Klinge, Hohlkehle, Parierstange, Knauf
        const len=w.wtype==="dagger"?12:20;
        c.fillStyle=wp[4];c.fillRect(-1.5,-len,3,len);          // Klinge
        c.fillStyle=wp[3];c.fillRect(-1.5,-len,1.5,len);        // Lichtkante
        c.fillStyle=wp[2];c.fillRect(0,-len+2,.8,len-3);        // Hohlkehle
        c.fillStyle=wp[1];                                      // Spitze
        c.beginPath();c.moveTo(-1.5,-len);c.lineTo(0,-len-3);c.lineTo(1.5,-len);c.closePath();c.fill();
        c.fillStyle=wp[4];c.fillRect(-5,-.5,10,2.5);            // Parierstange
        c.fillStyle=wp[3];c.fillRect(-5,-.5,10,1);
        c.fillStyle=wp[1];c.fillRect(-1.2,2,2.4,5);             // Griff
        c.fillStyle=glow;c.beginPath();c.arc(0,8,1.8,0,7);c.fill();  // Knauf
      }
    }else{
      c.fillStyle="#9d95c0";c.fillRect(-1,-9,2,9);
    }
    c.restore();
    // Schild / Nebenhand
    if(h.equip.offhand){
      const op=palette(h.equip.offhand.hue,60);
      c.save();c.translate(x-13,wy+6);
      if(h.equip.offhand.rar>=1)
        this.rarityGlow(c,0,0,13+h.equip.offhand.rar*2,RARITY[h.equip.offhand.rar].hex,.16+h.equip.offhand.rar*.06);
      // Nebenhand: eigene Grafik, sonst der gezeichnete Schild
      const oart=ASSETS[artIdFor(h.equip.offhand)];
      if(oart){
        c.drawImage(oart,-9,-11,18,20);
      }else{
        c.fillStyle=op[1];
        c.beginPath();c.moveTo(-5,-8);c.lineTo(5,-8);c.lineTo(5,4);c.lineTo(0,8);c.lineTo(-5,4);c.closePath();c.fill();
        c.fillStyle=op[2];
        c.beginPath();c.moveTo(-4,-7);c.lineTo(4,-7);c.lineTo(4,3.5);c.lineTo(0,7);c.lineTo(-4,3.5);c.closePath();c.fill();
        c.fillStyle=op[3];c.fillRect(-4,-7,8,2.5);
        c.fillStyle=op[7]||op[3];
        c.beginPath();c.arc(0,-1,2.2,0,7);c.fill();
      }
      c.restore();
    }
    // Statusanzeigen
    if(h.status.poison>0){
      if(Math.random()<.25)this.parts.puff(x+rnd(-6,6),gy-30,"#7cd66a");
    }
  }
  /** Weicher Schein in der Farbe der Seltenheit — als Fläche, nicht als Schatten */
  rarityGlow(c,cx,cy,r,col,alpha){
    const g=c.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,hexA(col,alpha));
    g.addColorStop(.55,hexA(col,alpha*.5));
    g.addColorStop(1,hexA(col,0));
    c.fillStyle=g;
    c.beginPath();c.arc(cx,cy,r,0,7);c.fill();
  }
  /** Sichtbare Aura, solange Segen wirken: Lichtkreis, kreisende Funken, Aufwind */
  drawBoonAura(c,x,gy,h){
    if(!h.boons||!h.boons.length)return;
    const t=this.time;
    for(let i=0;i<h.boons.length;i++){
      const b=h.boons[i];
      const fade=clamp(b.t/3,0,1);                 // klingt in den letzten Sekunden aus
      const puls=.6+.4*Math.sin(t*3.4+i*1.7);
      c.save();
      c.globalAlpha=.30*fade*puls;
      c.strokeStyle=b.col;c.lineWidth=2;
      c.shadowBlur=12;c.shadowColor=b.col;
      const r=20+i*4+Math.sin(t*2.2+i)*2;
      c.beginPath();c.ellipse(x,gy-4,r,r*.32,0,0,7);c.stroke();
      c.globalAlpha=.5*fade;
      const a=t*(1.6+i*.5)+i*2.1;                  // kreisender Funke je Segen
      const px=x+Math.cos(a)*r, py=gy-4+Math.sin(a)*r*.32;
      c.fillStyle=b.col;c.fillRect(px-1.5,py-1.5,3,3);
      c.restore();
      if(Math.random()<.20*fade)
        this.parts.add(x+rnd(-12,12),gy-2,1,{dir:-Math.PI/2,spread:.5,spdMin:12,spdMax:38,
          lifeMin:.5,lifeMax:1.1,col:b.col,size:2,g:-24,glow:1});
    }
  }
  drawEnemies(c){
    if(this.state==="walk"||this.state==="idle")return;
    // von hinten nach vorn, damit der vorderste Gegner oben liegt
    const list=this.enemies.slice().sort((a,b)=>b.x-a.x);
    for(const e of list)if(!e.dead)this.drawEnemy(c,e);
  }
  drawEnemy(c,e){
    if(!e)return;
    const sp=e.sp;
    const bob=this.state==="approach"?Math.round(Math.abs(Math.sin(this.time*10))*2):0;
    const lunge=e.lunge>0?Math.round(e.lunge*9):0;
    const x=e.x-lunge+Math.round(e.ox||0);
    c.globalAlpha=.28;c.fillStyle="#000";
    c.beginPath();c.ellipse(x,GROUND+1,e.pw*.42,4,0,0,7);c.fill();c.globalAlpha=1;
    let pal=e.pal;
    if(e.enraged)pal=palette(0,85,8);
    // schwebende Gegner leicht anheben
    const floaty=(["geist","gespenst","astral","elementar","flying"].indexOf(e.model)>=0?
      Math.round(Math.sin(this.time*2.4)*3)-6:0)+Math.round(e.oy||0);
    drawSprite(c,sp,x,GROUND-bob+floaty,e.scale,pal,true,e.flash>0?"#ffffff":null,
      e.model==="gespenst"||e.model==="geist"?.78:1,e.enraged?0:e.hue);
    if(e.shield>0){                    // Schildblase, wird mit dem Schild schwächer
      const k=e.shield/e.shieldMax,cy=GROUND-e.ph*.5+floaty;
      const art=ASSETS.affix_shielded;
      if(art){
        // Kuppel aus assets/affix_shielded.png, etwas größer als die Figur
        const bw=Math.max(e.pw,e.ph*.8)*1.32,bh=e.ph*1.3;
        c.save();c.imageSmoothingEnabled=false;
        c.globalAlpha=(.45+.5*k)*(.88+.12*Math.sin(this.time*4));
        const by=GROUND+floaty+3-bh;          // Kuppel steht auf dem Boden
        c.drawImage(art,Math.round(x-bw/2),Math.round(by),Math.round(bw),Math.round(bh));
        c.restore();
      }else{
        c.save();c.globalAlpha=.18+.22*k;c.fillStyle="#5aa9ff";
        c.beginPath();c.ellipse(x,cy,e.pw*.62,e.ph*.62,0,0,7);c.fill();
        c.globalAlpha=.5+.4*k;c.strokeStyle="#bde0ff";c.lineWidth=1.5;
        c.setLineDash([4,3]);c.lineDashOffset=-this.time*20;c.stroke();c.setLineDash([]);
        c.restore();
      }
    }
    if(e.affix&&e.affix.k==="explosive"){   // Glutrisse und pulsierender Kern warnen vor dem Bersten
      const p=.5+.5*Math.sin(this.time*(e.hpPct<.35?16:6));
      const cy=GROUND-e.ph*.5+floaty;
      const cracks=affixMask("affix_explosive",sp,e.pal,e.enraged?0:e.hue);
      if(cracks){
        // Risse liegen nur auf dem Körper: gleiche Lage und Spiegelung wie die Figur
        const u=e.scale/(sp.f||1),w=sp.w*u,hh=sp.h*u;
        const x0=Math.round((x-w/2)*2)/2,y0=Math.round((GROUND-bob+floaty-sp.base*u)*2)/2;
        c.save();c.imageSmoothingEnabled=false;
        c.globalAlpha=.55+.45*p;
        c.translate(x0+w,y0);c.scale(-1,1);c.drawImage(cracks,0,0,w,hh);
        c.restore();
      }
      c.save();c.globalAlpha=(cracks?.12:.25)+(cracks?.2:.35)*p;
      const g=c.createRadialGradient(x,cy,0,x,cy,e.pw*.6);
      g.addColorStop(0,"rgba(255,140,40,.9)");g.addColorStop(1,"rgba(255,60,20,0)");
      c.fillStyle=g;c.beginPath();c.arc(x,cy,e.pw*.6,0,7);c.fill();c.restore();
    }
    if(e.chill>0){                     // Eisschicht am Boden und kalter Schimmer
      const a=clamp(e.chill,0,1);
      c.save();c.globalAlpha=.55*a;c.fillStyle="#cfeaff";
      c.beginPath();c.ellipse(x,GROUND,e.pw*.5,5,0,0,7);c.fill();
      c.globalAlpha=.9*a;c.fillStyle="#ffffff";
      for(let j=-2;j<=2;j++)c.fillRect(x+j*e.pw*.18,GROUND-3-((j+3)%3)*3,2,4+((j+5)%3)*2);
      c.restore();
    }
    if(e.dot&&e.dot.t>0&&Math.random()<.35)
      this.parts.add(x+rnd(-e.pw*.3,e.pw*.3),GROUND-e.ph*.6,1,{spdMin:4,spdMax:16,lifeMin:.4,lifeMax:.8,
        col:pick(["#7cd66a","#c6ff8a"]),size:2,g:-20});
    // Lebensbalken über dem Kopf
    const top=GROUND-e.ph+floaty-9;
    const bw=e.boss?86:e.mini?70:clamp(e.pw*.85,26,56);
    c.fillStyle="rgba(0,0,0,.65)";c.fillRect(x-bw/2-1,top-1,bw+2,e.boss?7:5);
    c.fillStyle=e.enraged?"#ff3b3b":e.boss?"#ff7ad9":e.mini?"#ffb347":"#ff5566";
    c.fillRect(x-bw/2,top,bw*e.hpPct,e.boss?5:e.mini?4:3);
    c.fillStyle="rgba(255,255,255,.25)";c.fillRect(x-bw/2,top,bw*e.hpPct,1);
    if(e.boss||e.mini){
      c.font="700 8px 'Courier New',monospace";c.textAlign="center";
      c.fillStyle="#000";c.fillText(e.name,x+1,top-4);
      c.fillStyle=e.boss?"#ff7ad9":"#ffb347";c.fillText(e.name,x,top-5);
      c.textAlign="left";
    }
  }
  drawWeather(c){
    // Stimmungspartikel je nach Ort
    const b=this.biome;
    if(b.embers&&Math.random()<.5)
      this.parts.add(rnd(0,W),GROUND+rnd(0,40),1,{spdMin:4,spdMax:22,lifeMin:1.1,lifeMax:2.2,
        col:pick(["#ff8a2b","#ffc861","#ff5b1a"]),size:1,g:-26,glow:1});
    if(b.dust&&Math.random()<.14)
      this.parts.add(rnd(0,W),rnd(40,GROUND),1,{spdMin:2,spdMax:9,lifeMin:1.6,lifeMax:3,
        col:"rgba(200,190,230,.5)",size:1,g:6});
    if(b.spray&&Math.random()<.3)
      this.parts.add(rnd(0,W),GROUND+34,1,{spdMin:20,spdMax:60,lifeMin:.4,lifeMax:.9,
        col:"rgba(220,240,255,.8)",size:1,g:150});
    if(this.weather==="clear")return;
    if(b.indoor&&this.weather!=="fog")return;
    if(this.weather==="fog"){
      c.globalAlpha=.16;
      for(let i=0;i<5;i++){
        const y=90+i*28,off=(this.time*(8+i*4)+i*130)%(W+180)-90;
        c.fillStyle="#cfd6ff";c.fillRect(off,y,150,10);
        c.fillRect(off-200,y,150,10);
      }
      c.globalAlpha=1;return;
    }
    const rain=this.weather==="rain";
    c.strokeStyle=rain?"rgba(150,190,255,.5)":"rgba(255,255,255,.75)";
    c.lineWidth=1;
    const n=rain?70:52;
    for(let i=0;i<n;i++){
      const seed=i*37.7;
      const spd=rain?420:70;
      const y=((this.time*spd+seed*13)%(H+40))-20;
      const x=((seed*29)+(rain?y*.35:Math.sin(this.time*1.2+i)*16))%W;
      if(rain){c.beginPath();c.moveTo(x,y);c.lineTo(x-2,y+7);c.stroke();}
      else{c.fillStyle="rgba(255,255,255,.8)";c.fillRect(x,y,2,2);}
    }
  }
  drawNightTint(c){
    const b=this.biome;
    if(b.indoor){
      c.fillStyle=b.lava?"rgba(60,10,0,.20)":"rgba(14,10,32,.34)";c.fillRect(0,0,W,H);
      if(b.lava&&this.lavaPulse===undefined)this.lavaPulse=0;
      if(b.lava){c.fillStyle="rgba(255,90,20,"+(.05+Math.sin(this.time*1.3)*.02)+")";c.fillRect(0,0,W,H);}
    }
    const night=b.indoor?0:clamp((this.dayT<.5?(.20-this.dayT)/.20:(this.dayT-.80)/.20),0,1);
    if(night>0){c.fillStyle="rgba(24,20,58,"+(night*.42)+")";c.fillRect(0,0,W,H);}
    if(this.weather==="rain"){c.fillStyle="rgba(20,28,60,.18)";c.fillRect(0,0,W,H);}
    if(this.lootGlow>0){c.fillStyle="rgba(139,233,253,"+(this.lootGlow*.12)+")";c.fillRect(0,0,W,H);}
    if(this.hero&&this.hero.boons&&this.hero.boons.length){
      // Farbiger Randschimmer in der Farbe des jüngsten Segens
      const b=this.hero.boons[this.hero.boons.length-1];
      const p=.10+.05*Math.sin(this.time*3)+clamp(this.boonPulse||0,0,1)*.25;
      const g=c.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);
      g.addColorStop(0,"rgba(0,0,0,0)");
      g.addColorStop(1,hexA(b.col,p));
      c.fillStyle=g;c.fillRect(0,0,W,H);
    }
    if(this.flash&&this.flash.t>0){         // kurzer Vollbildblitz
      c.fillStyle=hexA(this.flash.col,(this.flash.t/this.flash.max)*.5);
      c.fillRect(0,0,W,H);
    }
  }
  /** Inszenierter Auftritt: Abdunklung, Schockwellen, Namensbanner, Lichtsäule */
  drawIntro(c){
    const I=this.intro;if(!I)return;
    const k=clamp(1-I.t/I.max,0,1);              // 0 = Beginn, 1 = Ende
    const e=I.foe;
    const col=I.boss?"#ff7ad9":"#ffb347";
    const inOut=Math.min(k*4,1)*Math.min((1-k)*5,1);   // ein- und ausblenden
    // Abdunklung mit Lichtkegel auf dem Gegner
    const g=c.createRadialGradient(e.x,GROUND-e.ph*.5,10,e.x,GROUND-e.ph*.5,190);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1,"rgba(0,0,0,"+(.62*inOut).toFixed(2)+")");
    c.fillStyle=g;c.fillRect(0,0,W,H);
    // Lichtsäule
    c.save();c.globalAlpha=.22*inOut;
    const lg=c.createLinearGradient(0,0,0,GROUND);
    lg.addColorStop(0,hexA(col,0));lg.addColorStop(1,hexA(col,.9));
    c.fillStyle=lg;
    c.beginPath();
    c.moveTo(e.x-14,0);c.lineTo(e.x+14,0);
    c.lineTo(e.x+e.pw*.5,GROUND);c.lineTo(e.x-e.pw*.5,GROUND);
    c.closePath();c.fill();c.restore();
    // Drei Schockwellen auf dem Boden
    for(let i=0;i<3;i++){
      const p=(k*1.9-i*.22);
      if(p<=0||p>=1)continue;
      c.save();c.globalAlpha=(1-p)*.8*inOut;
      c.strokeStyle=col;c.lineWidth=2.5-p*1.8;
      c.shadowBlur=12;c.shadowColor=col;
      c.beginPath();c.ellipse(e.x,GROUND+2,20+p*170,(20+p*170)*.22,0,0,7);c.stroke();
      c.restore();
    }
    // Kurzes Aufblitzen des Gegners zu Beginn
    if(k<.14){c.fillStyle="rgba(255,255,255,"+((.14-k)/.14*.5).toFixed(2)+")";c.fillRect(0,0,W,H);}
    // Namensbanner
    const slide=Math.min(k*6,1);
    const by=52+(1-slide)*-26;
    c.save();c.globalAlpha=inOut;
    c.fillStyle="rgba(8,6,14,.78)";
    c.fillRect(0,by-15,W,34);
    c.fillStyle=col;
    c.fillRect(0,by-15,W,1.5);c.fillRect(0,by+17.5,W,1.5);
    c.textAlign="center";
    c.font="700 8px 'Courier New',monospace";
    c.fillStyle=col;
    c.fillText(I.boss?"W E L T E N B O S S":"M I N I B O S S",W/2,by-4);
    c.font="700 15px 'Courier New',monospace";
    c.fillStyle="#000";c.fillText(I.name,W/2+1,by+13);
    c.fillStyle="#fff8fb";c.fillText(I.name,W/2,by+12);
    c.textAlign="left";c.restore();
  }
  drawHud(c){
    c.font="8px 'Courier New',monospace";
    const t=["Nacht","Morgen","Tag","Abend"][this.dayT<.16?0:this.dayT<.30?1:this.dayT<.72?2:this.dayT<.88?3:0];
    const wt={clear:"Klar",rain:"Regen",snow:"Schnee",fog:"Nebel"}[this.weather];
    if(this.hero&&this.hero.boons.length){       // laufende Segen unten links
      let bx=6;
      for(const b of this.hero.boons){
        c.fillStyle="rgba(0,0,0,.55)";c.fillRect(bx,H-16,34,11);
        c.fillStyle=b.col;c.fillRect(bx,H-16,34*clamp(b.t/b.max,0,1),2);
        c.font="7px 'Courier New',monospace";c.fillStyle=b.col;
        c.fillText(b.n.replace(/^Segen (der|des) /,"").slice(0,7),bx+2,H-7);
        bx+=37;
      }
    }
    const s="Zone "+this.zone+"  \u2022  "+(this.biome?this.biome.n:"")+
      (this.biome&&this.biome.indoor?"":"  \u2022  "+t)+"  \u2022  "+wt;
    c.fillStyle="rgba(0,0,0,.5)";c.fillRect(4,4,c.measureText(s).width+8,12);
    c.fillStyle="#a99fd0";c.fillText(s,8,13);
    if(this.hero){
      const st=this.state==="fight"?"KAMPF":this.state==="walk"?"Unterwegs":
        this.state==="approach"?"Gegner naht":this.state==="dead"?"GEFALLEN":"Sieg";
      c.textAlign="right";
      c.fillStyle="rgba(0,0,0,.5)";
      const w2=c.measureText(st).width+8;
      c.fillRect(W-4-w2,4,w2,12);
      c.fillStyle=this.state==="fight"?"#ff8fa3":"#a99fd0";
      c.fillText(st,W-8,13);c.textAlign="left";
    }
  }
  /* ---------- Speichern ---------- */
  async save(){
    await Store.set("ad_meta",{meta:this.meta,shards:this.shards,stats:this.stats,
      heirlooms:this.heirlooms,heirGems:this.heirGems,heirGold:this.heirGold,
      heirAttr:this.heirAttr,graves:this.graves});
    if(this.hero&&this.state!=="dead"){
      await Store.set("ad_run",{
        hero:{name:this.hero.name,race:this.hero.race,cls:this.hero.cls,level:this.hero.level,
          xp:this.hero.xp,gold:this.hero.gold,potions:this.hero.potions,skillPts:this.hero.skillPts,
          skills:this.hero.skills,equip:this.hero.equip,bag:this.hero.bag,gems:this.hero.gems,
          base:this.hero.base,hp:this.hero.hp,kills:this.hero.kills,bossKills:this.hero.bossKills,
          shardsRun:this.hero.shardsRun,dmgDone:this.hero.dmgDone,ult:this.hero.ult,ultCd:this.hero.ultCd},
        zone:this.zone,dist:this.dist,lastBoss:this.lastBoss,bossPending:this.bossPending,
        totalDist:this.totalDist,bossMarks:this.bossMarks
      });
    }
  }
  async loadAudioSettings(){
    const a=await Store.get("ad_audio");
    if(a){
      MUSIC.vol=clamp(a.musicVol===undefined?.5:a.musicVol,0,1);
      MUSIC.on=a.musicOn!==false;
      SFX.on=a.sfxOn!==false;
      SFX.vol=clamp(a.sfxVol===undefined?.28:a.sfxVol,0,1);
    }
  }
  async saveAudioSettings(){
    await Store.set("ad_audio",{musicVol:MUSIC.vol,musicOn:MUSIC.on,sfxOn:SFX.on,sfxVol:SFX.vol});
  }
  async loadMeta(){
    const m=await Store.get("ad_meta");
    if(m){this.meta=m.meta||{};this.shards=m.shards||0;
      this.stats=Object.assign(this.stats,m.stats||{});this.heirlooms=m.heirlooms||[];
      this.heirGems=m.heirGems||[];this.heirGold=m.heirGold||0;this.heirAttr=m.heirAttr||null;
      this.graves=m.graves||[];}
  }
  async loadRun(){
    const r=await Store.get("ad_run");
    if(!r)return false;
    const d=r.hero;
    this.hero=new Hero(d.name,d.race,d.cls,this.meta);
    Object.assign(this.hero,{level:d.level,xp:d.xp,gold:d.gold,potions:d.potions,
      skillPts:d.skillPts,skills:d.skills||{},equip:d.equip||{},bag:d.bag||[],gems:d.gems||[],
      base:d.base,kills:d.kills||0,bossKills:d.bossKills||0,shardsRun:d.shardsRun||0,dmgDone:d.dmgDone||0,
      ult:d.ult||{rank:1,path:null},ultCd:d.ultCd||0});
    this.hero.recompute();this.hero.hp=Math.max(1,d.hp||this.hero.maxHp);
    this.zone=r.zone||1;this.dist=0;this.nextEncounter=150;this.totalDist=r.totalDist||0;this.bossMarks=r.bossMarks||[];
    this.bossPending=r.bossPending||false;
    this.state="walk";this.enemy=null;
    UI.clearLog();UI.log("Run fortgesetzt: "+d.name+", Stufe "+d.level+".","sys");
    UI.renderAll();
    return true;
  }
}

/* ============================================================================
   9. UI — Tabs, Inventar, Tooltips, Skilltree, Stadt, Ahnenhalle
   ========================================================================== */
const UI={
  socketGem:null,
  sellFilter:{0:true,1:true,2:false,3:false},
  /* ---------- Detailfenster ---------- */
  openSheet(html,bind){
    const w=$("sheetWrap"),sh=$("sheet");
    sh.innerHTML='<button class="close" id="sheetX">\u2715</button>'+html;
    w.classList.add("on");
    $("sheetX").onclick=()=>this.closeSheet();
    // Nur ein Tipp auf den Hintergrund schließt, nicht auf den Inhalt
    w.onclick=e=>{if(e.target===w)this.closeSheet();};
    sh.onclick=e=>e.stopPropagation();
    if(bind)bind();
    sh.scrollTop=0;
  },
  closeSheet(){
    $("sheetWrap").classList.remove("on");
    this.sel=null;this.selSkill=null;
    if(G.hero)this.renderAll();
  },
  sheetOpen(){return $("sheetWrap").classList.contains("on");},
  /** Sperrt das Scrollen der Seite, solange ein Fenster oder Overlay offen ist */
  watchModals(){
    const upd=()=>document.body.classList.toggle("modal",
      $("overlay").classList.contains("on")||$("sheetWrap").classList.contains("on"));
    const mo=new MutationObserver(upd);
    mo.observe($("overlay"),{attributes:true,attributeFilter:["class"]});
    mo.observe($("sheetWrap"),{attributes:true,attributeFilter:["class"]});
    upd();
    // Protokoll auf dem Handy auf- und zuklappen statt darin zu scrollen
    const t=$("logTitle"),lg=$("log");
    t.style.cursor="pointer";
    t.onclick=()=>{const on=lg.classList.toggle("full");$("logToggle").textContent=on?"zuklappen":"aufklappen";
      if(!on)lg.scrollTop=lg.scrollHeight;};
  },
  init(){
    setTimeout(()=>this.watchModals(),0);
    $("tabs").addEventListener("click",e=>{
      const b=e.target.closest("button[data-tab]");if(!b)return;
      this.switchTab(b.dataset.tab);SFX.init();
    });
    document.addEventListener("mousemove",e=>{
      const tt=$("tooltip");
      if(!tt.classList.contains("on"))return;
      this.placeTooltip(e.clientX,e.clientY);
    });
    window.addEventListener("keydown",e=>{
      if(e.key==="q"&&G.hero&&G.state!=="dead")G.usePotion();
      const tag=(e.target&&e.target.tagName)||"";
      if((e.key==="r"||e.key==="R"||e.key===" ")&&G.hero&&!/INPUT|TEXTAREA|SELECT/.test(tag)){
        if(e.key===" ")e.preventDefault();
        if(!$("overlay").classList.contains("on"))G.castUlt();
      }
      const map={"1":"hero","2":"inv","3":"skills","4":"town","5":"ahnen","6":"sys"};
      if(map[e.key])this.switchTab(map[e.key]);
    });
  },
  switchTab(name){
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
    document.querySelectorAll(".tab").forEach(t=>{
      const on=t.id==="tab-"+name;
      if(on){t.classList.add("active");requestAnimationFrame(()=>t.classList.add("shown"));}
      else{t.classList.remove("active");t.classList.remove("shown");}
    });
    this.renderAll();
    // Eine Spalte: war man weit unten, beginnt der neue Tab oben an der Leiste
    const box=$("tabs").parentElement.getBoundingClientRect();
    if(innerWidth<=900&&box.top<0)window.scrollTo(0,window.scrollY+box.top);
  },
  /* ---------- Log ---------- */
  clearLog(){$("log").innerHTML="";},
  log(msg,type){
    const el=$("log");
    const d=document.createElement("div");
    d.className="c-"+(type||"sys");
    const z=G?G.zone:1;
    d.innerHTML='<span class="t">Z'+z+'</span>'+msg;
    el.appendChild(d);
    while(el.children.length>140)el.removeChild(el.firstChild);
    if(!el.classList.contains("full"))el.scrollTop=el.scrollHeight;
  },
  toast(msg){
    const t=$("toast");t.textContent=msg;t.classList.add("on");
    clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove("on"),1800);
  },
  /* ---------- Bars / Chips ---------- */
  updateBars(){
    const h=G.hero;if(!h)return;
    const hp=h.hpPct*100;
    $("barHp").style.width=hp+"%";
    $("txtHp").textContent="Leben  "+Math.ceil(h.hp)+" / "+h.maxHp;
    const need=h.xpNeeded(),p=clamp(h.xp/need,0,1)*100;
    $("barXp").style.width=p+"%";
    $("txtXp").textContent="Erfahrung  "+Math.floor(h.xp)+" / "+need;
    $("xpWrap").classList.toggle("full",p>96);
    $("chipHero").textContent=h.name+"  Stufe "+h.level;
    $("chipZone").textContent="Zone "+G.zone;
    $("chipGold").textContent=fmt(h.gold)+" Gold";
    // Der Vorrat der Ahnenhalle wächst erst beim Tod — die Ausbeute des
    // laufenden Helden wird deshalb getrennt daneben angezeigt.
    const cs=$("chipSoul"),run=h.shardsRun||0;
    cs.innerHTML=G.shards+' \u2726'+
      (run?' <span class="gain">+'+run+'</span>':'')+
      ' <span class="csub">Seelensplitter</span>';

      if(this._lastShards!==undefined&&run>this._lastShards){
        cs.classList.remove("pulse");void cs.offsetWidth;cs.classList.add("pulse");
      }
      this._lastShards=run;
    }
    const badge=(id,n)=>{
      const b=$(id);if(!b)return;
      const el=b.querySelector(".badge");
      if(el){el.textContent=n;el.hidden=!n;}

    };
